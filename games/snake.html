<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 - 绒球游戏厅 🧶</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #FFF8F0;
      color: #4A3728;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .nav {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav a {
      color: #D4726A;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav a:hover { text-decoration: underline; }

    h1 {
      font-size: 1.5rem;
      color: #D4726A;
      margin-bottom: 8px;
    }

    .score-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .score-bar span { font-weight: 600; }

    #gameCanvas {
      border: 3px solid #E8A87C;
      border-radius: 8px;
      background: #FEFCF9;
      box-shadow: 0 4px 20px rgba(74, 55, 40, 0.08);
      display: block;
      max-width: 100%;
      touch-action: none;
    }

    .controls {
      margin-top: 20px;
      text-align: center;
      color: #8B7355;
      font-size: 0.85rem;
      line-height: 1.8;
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 28px;
      background: #E8A87C;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #D4726A; }

    .game-over {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 248, 240, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .game-over.show { display: flex; }

    .game-over h2 {
      font-size: 2rem;
      color: #D4726A;
      margin-bottom: 12px;
    }

    .game-over p {
      font-size: 1.2rem;
      color: #4A3728;
      margin-bottom: 24px;
    }

    /* 移动端虚拟方向键 */
    .dpad {
      display: none;
      margin-top: 20px;
      width: 160px;
      height: 160px;
      position: relative;
    }

    .dpad button {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #E8A87C;
      border: none;
      border-radius: 12px;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .dpad button:active { background: #D4726A; }

    .dpad .up    { top: 0; left: 54px; }
    .dpad .down  { bottom: 0; left: 54px; }
    .dpad .left  { top: 54px; left: 0; }
    .dpad .right { top: 54px; right: 0; }

    @media (pointer: coarse) {
      .dpad { display: block; }
      .controls .keys-hint { display: none; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="../index.html">← 返回游戏厅</a>
  </div>

  <h1>🐍 贪吃蛇</h1>

  <div class="score-bar">
    <span>得分: <span id="score">0</span></span>
    <span>最高: <span id="highScore">0</span></span>
  </div>

  <canvas id="gameCanvas" width="500" height="500"></canvas>

  <div class="dpad">
    <button class="up" ontouchstart="setDir(0,-1)">↑</button>
    <button class="down" ontouchstart="setDir(0,1)">↓</button>
    <button class="left" ontouchstart="setDir(-1,0)">←</button>
    <button class="right" ontouchstart="setDir(1,0)">→</button>
  </div>

  <div class="controls">
    <p class="keys-hint">方向键 / WASD 控制方向 &nbsp;|&nbsp; 空格键暂停</p>
    <button class="btn" id="startBtn" onclick="startGame()">开始游戏</button>
  </div>

  <div class="game-over" id="gameOverScreen">
    <h2>游戏结束</h2>
    <p>得分: <span id="finalScore">0</span></p>
    <button class="btn" onclick="startGame()">再来一局</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, highScore, gameLoop, speed, running, paused;

    highScore = parseInt(localStorage.getItem('snake_high') || '0');
    document.getElementById('highScore').textContent = highScore;

    function init() {
      snake = [{ x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 120;
      running = true;
      paused = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('gameOverScreen').classList.remove('show');
      placeFood();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function draw() {
      // 背景
      ctx.fillStyle = '#FEFCF9';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 网格（极淡）
      ctx.strokeStyle = 'rgba(232,168,124,0.08)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
      }

      // 食物
      ctx.fillStyle = '#D4726A';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // 蛇身
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        const r = Math.round(168 + (232 - 168) * ratio);
        const g = Math.round(134 + (168 - 134) * ratio);
        const b = Math.round(124 + (124 - 124) * ratio);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad * 2, GRID - pad * 2, 4);
        ctx.fill();
      });

      // 暂停提示
      if (paused) {
        ctx.fillStyle = 'rgba(255,248,240,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#D4726A';
        ctx.font = '24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('暂停中', canvas.width / 2, canvas.height / 2);
      }
    }

    function update() {
      if (paused) return;

      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 碰壁
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }
      // 碰自己
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        placeFood();
        // 加速
        if (speed > 60) speed -= 2;
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
      } else {
        snake.pop();
      }
    }

    function tick() {
      update();
      draw();
    }

    function gameOver() {
      running = false;
      clearInterval(gameLoop);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high', highScore);
        document.getElementById('highScore').textContent = highScore;
      }
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').classList.add('show');
    }

    function startGame() {
      clearInterval(gameLoop);
      init();
      draw();
      gameLoop = setInterval(tick, speed);
      document.getElementById('startBtn').textContent = '重新开始';
    }

    function setDir(x, y) {
      if (dir.x === -x && dir.y === -y) return; // 不能反向
      nextDir = { x, y };
    }

    document.addEventListener('keydown', e => {
      if (!running) return;
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
        case ' ': paused = !paused; draw(); e.preventDefault(); break;
      }
    });

    // 触摸滑动
    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
    canvas.addEventListener('touchend', e => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        setDir(dx > 0 ? 1 : -1, 0);
      } else {
        setDir(0, dy > 0 ? 1 : -1);
      }
      touchStart = null;
    });

    // 初始绘制
    init();
    draw();
  </script>
</body>
</html>
