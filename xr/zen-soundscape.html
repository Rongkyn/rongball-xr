<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>禅意声景 | 绒球 XR 实验室</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    
    .ui-overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      font-family: 'Noto Serif SC', serif;
    }
    
    .title-card {
      background: rgba(255, 253, 245, 0.92);
      padding: 18px 28px;
      border-radius: 2px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      border-left: 3px solid #6b8e6b;
      max-width: 300px;
      opacity: 0;
      animation: fadeIn 1.5s ease-out 0.5s forwards;
    }
    
    .title-card h1 {
      font-size: 1.3rem;
      color: #3d3d3d;
      font-weight: 400;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
    }
    
    .title-card p {
      font-size: 0.8rem;
      color: #7a7a7a;
      line-height: 1.7;
      letter-spacing: 0.05em;
    }
    
    .hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(60, 60, 60, 0.75);
      color: rgba(255, 253, 245, 0.95);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      font-family: 'Noto Serif SC', serif;
      opacity: 0;
      animation: fadeIn 1s ease-out 2s forwards;
    }

    .sound-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(107, 142, 107, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-family: 'Noto Serif SC', serif;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 100;
    }
    .sound-indicator.show { opacity: 1; }

    .active-sounds {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
    }
    .active-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(107, 142, 107, 0.4);
      transition: all 0.3s;
    }
    .active-dot.active {
      background: #6b8e6b;
      box-shadow: 0 0 8px rgba(107, 142, 107, 0.6);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <div class="title-card">
      <h1>禅意声景</h1>
      <p>点击山水 · 聆听禅意<br>声从景生，景随声动</p>
    </div>
  </div>

  <div class="hint">点击山石、松树、水面 · VR 中使用手柄交互</div>

  <div class="sound-indicator" id="soundIndicator">🎵 声音已启动</div>

  <div class="active-sounds">
    <div class="active-dot" id="dot-wind"></div>
    <div class="active-dot" id="dot-water"></div>
    <div class="active-dot" id="dot-chime"></div>
    <div class="active-dot" id="dot-bird"></div>
  </div>

  <a-scene 
    fog="type: exponential; color: #f5f3ef; density: 0.025"
    renderer="antialias: true; colorManagement: true; sortObjects: true"
    vr-mode-ui="enabled: true"
  >
    <!-- 相机 -->
    <a-entity id="rig" position="0 1.6 8">
      <a-camera 
        wasd-controls="acceleration: 12; fly: false"
        look-controls="pointerLockEnabled: true"
      >
        <a-cursor 
          color="#6b8e6b" 
          opacity="0.8"
          fuse="false"
          raycaster="objects: .clickable"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <!-- 天空 -->
    <a-sky color="#f8f6f1"></a-sky>

    <!-- ===== 远山层次 ===== -->
    <a-entity id="mountains-far">
      <a-cone position="-8 2.5 -25" radius-bottom="6" radius-top="0.2" height="5" color="#d4cfc7" segments-radial="8" material="shader: standard; flatShading: true; opacity: 0.7"></a-cone>
      <a-cone position="4 2 -28" radius-bottom="7" radius-top="0.3" height="4.5" color="#cfc9c0" segments-radial="8" material="opacity: 0.65"></a-cone>
      <a-cone position="12 2.8 -22" radius-bottom="5" radius-top="0.2" height="5.5" color="#d4cfc7" segments-radial="8" material="opacity: 0.6"></a-cone>
    </a-entity>

    <!-- ===== 中景山 ===== -->
    <a-entity id="mountains-mid">
      <a-cone position="-12 1.5 -15" radius-bottom="5" radius-top="0.4" height="6" color="#a8a095" segments-radial="6" material="flatShading: true; opacity: 0.85"></a-cone>
      <a-cone position="0 2 -18" radius-bottom="6" radius-top="0.5" height="7" color="#9c968b" segments-radial="6" material="flatShading: true; opacity: 0.9"></a-cone>
      <a-cone position="10 1.2 -14" radius-bottom="4" radius-top="0.3" height="5" color="#a8a095" segments-radial="6" material="flatShading: true"></a-cone>
      <a-cone position="-5 1.8 -12" radius-bottom="4.5" radius-top="0.4" height="5.5" color="#b0a898" segments-radial="6" material="flatShading: true; opacity: 0.95"></a-cone>
    </a-entity>

    <!-- ===== 近景山石（可交互） ===== -->
    <a-entity id="rocks">
      <!-- 左侧主石 -->
      <a-entity position="-3 0.8 -5" class="clickable sound-source" data-sound="stone" data-pos="-3 0.8 -5">
        <a-cone radius-bottom="2.5" radius-top="0.6" height="3.5" color="#6b6358" segments-radial="5" material="flatShading: true; roughness: 0.9"></a-cone>
      </a-entity>
      <a-entity position="-1.5 0.5 -4" class="clickable sound-source" data-sound="stone" data-pos="-1.5 0.5 -4">
        <a-cone radius-bottom="1.8" radius-top="0.4" height="2.5" color="#7a7268" segments-radial="5" material="flatShading: true; roughness: 0.85"></a-cone>
      </a-entity>
      
      <!-- 右侧山石 -->
      <a-entity position="4 0.6 -6" class="clickable sound-source" data-sound="stone" data-pos="4 0.6 -6">
        <a-cone radius-bottom="2" radius-top="0.5" height="2.8" color="#6b6358" segments-radial="5" material="flatShading: true; roughness: 0.9"></a-cone>
      </a-entity>
      <a-entity position="5.5 0.4 -4.5" class="clickable sound-source" data-sound="stone" data-pos="5.5 0.4 -4.5">
        <a-cone radius-bottom="1.5" radius-top="0.35" height="2" color="#7a7268" segments-radial="5" material="flatShading: true; roughness: 0.85"></a-cone>
      </a-entity>
      
      <!-- 前景点缀 -->
      <a-cone position="-2 0.3 -2" radius-bottom="0.8" radius-top="0.2" height="1.2" color="#8a8278" segments-radial="4" material="flatShading: true"></a-cone>
      <a-cone position="2 0.25 -2.5" radius-bottom="0.6" radius-top="0.15" height="1" color="#8a8278" segments-radial="4" material="flatShading: true"></a-cone>
    </a-entity>

    <!-- ===== 水面（可交互） ===== -->
    <a-entity class="clickable sound-source" data-sound="water" data-pos="0 0 -8">
      <a-circle 
        position="0 0.01 -8" 
        radius="12" 
        rotation="-90 0 0" 
        color="#e8e4db"
        material="shader: standard; metalness: 0.1; roughness: 0.6; opacity: 0.9"
      ></a-circle>
    </a-entity>
    
    <!-- 水面波纹 -->
    <a-ring position="0 0.02 -6" radius-inner="1.5" radius-outer="1.6" rotation="-90 0 0" color="#d4cfc7" material="opacity: 0.4"></a-ring>
    <a-ring position="0.5 0.02 -7" radius-inner="2" radius-outer="2.1" rotation="-90 0 0" color="#d4cfc7" material="opacity: 0.3"></a-ring>
    <a-ring position="-0.3 0.02 -5.5" radius-inner="0.8" radius-outer="0.85" rotation="-90 0 0" color="#d4cfc7" material="opacity: 0.35"></a-ring>

    <!-- ===== 松树（可交互） ===== -->
    <a-entity id="trees" position="0 0 0">
      <!-- 主松 - 左侧 -->
      <a-entity position="-2.5 0 -3" rotation="0 15 0" class="clickable sound-source" data-sound="wind" data-pos="-2.5 1 -3">
        <a-cylinder height="1.8" radius="0.08" color="#4a4035" material="roughness: 0.95"></a-cylinder>
        <a-cone position="0 1.2 0" radius-bottom="0.9" radius-top="0.1" height="1.2" color="#3d4a3a" material="flatShading: true; opacity: 0.92"></a-cone>
        <a-cone position="0 1.8 0" radius-bottom="0.65" radius-top="0.08" height="0.9" color="#3d4a3a" material="flatShading: true; opacity: 0.88"></a-cone>
        <a-cone position="0 2.3 0" radius-bottom="0.4" radius-top="0.05" height="0.7" color="#3d4a3a" material="flatShading: true; opacity: 0.85"></a-cone>
      </a-entity>
      
      <!-- 次松 - 右侧 -->
      <a-entity position="3 0 -4" rotation="0 -10 0" class="clickable sound-source" data-sound="wind" data-pos="3 1 -4">
        <a-cylinder height="1.4" radius="0.06" color="#4a4035" material="roughness: 0.95"></a-cylinder>
        <a-cone position="0 1 0" radius-bottom="0.7" radius-top="0.08" height="1" color="#4a5a48" material="flatShading: true; opacity: 0.9"></a-cone>
        <a-cone position="0 1.5 0" radius-bottom="0.5" radius-top="0.05" height="0.75" color="#4a5a48" material="flatShading: true; opacity: 0.85"></a-cone>
      </a-entity>
      
      <!-- 远松 -->
      <a-entity position="6 0 -10" rotation="0 -20 0">
        <a-cylinder height="1" radius="0.04" color="#5a5045" material="roughness: 0.95"></a-cylinder>
        <a-cone position="0 0.7 0" radius-bottom="0.5" radius-top="0.06" height="0.8" color="#3d4a3a" material="flatShading: true; opacity: 0.75"></a-cone>
        <a-cone position="0 1.15 0" radius-bottom="0.35" radius-top="0.04" height="0.6" color="#3d4a3a" material="flatShading: true; opacity: 0.7"></a-cone>
      </a-entity>
    </a-entity>

    <!-- ===== 远山（可交互 - 钟声） ===== -->
    <a-entity id="far-mountains">
      <a-entity position="-8 2.5 -25" class="clickable sound-source" data-sound="chime" data-pos="-8 3 -25">
        <a-cone radius-bottom="6" radius-top="0.2" height="5" color="#d4cfc7" segments-radial="8" material="shader: standard; flatShading: true; opacity: 0.7"></a-cone>
      </a-entity>
    </a-entity>

    <!-- ===== 飘雾 ===== -->
    <a-entity id="fog-layers">
      <a-plane position="-4 1.2 -8" width="8" height="1.5" rotation="-90 0 0" color="#ffffff" material="shader: standard; opacity: 0.12; transparent: true; side: double"></a-plane>
      <a-plane position="3 1 -10" width="6" height="1.2" rotation="-90 0 0" color="#ffffff" material="shader: standard; opacity: 0.1; transparent: true; side: double"></a-plane>
      <a-plane position="0 0.8 -5" width="10" height="1" rotation="-90 0 0" color="#f5f3ef" material="shader: standard; opacity: 0.15; transparent: true; side: double"></a-plane>
    </a-entity>

    <!-- ===== 环境光 ===== -->
    <a-light type="ambient" color="#f5f0e8" intensity="0.6"></a-light>
    <a-light type="directional" color="#fff8f0" intensity="0.8" position="-1 3 1"></a-light>
    <a-light type="hemisphere" color="#f5f3ef" groundColor="#a8a095" intensity="0.4"></a-light>

  </a-scene>

  <script>
    // ========== 禅意声景音频引擎 ==========
    class ZenSoundscape {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.panner = null;
        this.reverb = null;
        this.audioReady = false;
        this.activeAmbience = {};
        this.camera = null;
      }

      async init() {
        if (this.ctx) return;
        await Tone.start();

        this.ctx = Tone.getContext().rawContext;
        
        // 主音量
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.5;
        this.masterGain.connect(this.ctx.destination);

        // 混响效果
        this.reverb = this.ctx.createConvolver();
        await this.loadImpulseResponse();
        
        // 默认开始环境音
        this.startAmbience();
        this.audioReady = true;
        
        // 显示提示
        document.getElementById('soundIndicator').classList.add('show');
        setTimeout(() => {
          document.getElementById('soundIndicator').classList.remove('show');
        }, 2000);
      }

      // 生成简单的混响脉冲响应
      async loadImpulseResponse() {
        const length = this.ctx.sampleRate * 3;
        const impulse = this.ctx.createBuffer(2, length, this.ctx.sampleRate);
        
        for (let channel = 0; channel < 2; channel++) {
          const data = impulse.getChannelData(channel);
          for (let i = 0; i < length; i++) {
            // 指数衰减的噪声
            const decay = Math.exp(-i / (this.ctx.sampleRate * 1.5));
            data[i] = (Math.random() * 2 - 1) * decay;
          }
        }
        
        this.reverb.buffer = impulse;
        this.reverb.connect(this.masterGain);
      }

      // 更新相机位置（用于3D音频定位）
      updateCameraPosition(pos) {
        this.cameraPos = pos;
      }

      // 创建空间音频源
      createSpatialSource(x, y, z) {
        const panner = this.ctx.createPanner();
        panner.panningModel = 'HRTF';
        panner.distanceModel = 'inverse';
        panner.refDistance = 1;
        panner.maxDistance = 50;
        panner.rolloffFactor = 1;
        panner.coneInnerAngle = 360;
        panner.coneOuterAngle = 360;
        
        // 设置声音位置
        panner.positionX.value = x;
        panner.positionY.value = y;
        panner.positionZ.value = z;

        // 连接链
        panner.connect(this.reverb);
        
        return panner;
      }

      // 更新听者位置
      updateListener() {
        if (!this.camera) {
          this.camera = document.querySelector('#rig');
        }
        if (!this.camera) return;

        const pos = this.camera.getAttribute('position');
        const rot = this.camera.getAttribute('rotation') || { x: 0, y: 0, z: 0 };

        // 更新 Web Audio listener
        if (this.ctx.listener.positionX) {
          this.ctx.listener.positionX.value = pos.x;
          this.ctx.listener.positionY.value = pos.y;
          this.ctx.listener.positionZ.value = pos.z;
          this.ctx.listener.forwardX.value = -Math.sin(rot.y * Math.PI / 180);
          this.ctx.listener.forwardY.value = -Math.sin(rot.x * Math.PI / 180);
          this.ctx.listener.forwardZ.value = -Math.cos(rot.y * Math.PI / 180);
          this.ctx.listener.upX.value = 0;
          this.ctx.listener.upY.value = 1;
          this.ctx.listener.upZ.value = 0;
        }
      }

      // ===== 环境音 =====
      startAmbience() {
        this.startWind();
        this.startBirds();
        this.startChime();
      }

      startWind() {
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.createNoiseBuffer(4, 'pink');
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 300;
        filter.Q.value = 0.5;

        const gain = this.ctx.createGain();
        gain.gain.value = 0.08;

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start();

        // 更新点光源
        document.getElementById('dot-wind').classList.add('active');

        this.activeAmbience.wind = { noise, filter, gain };
      }

      startBirds() {
        const chirp = () => {
          if (!this.activeAmbience.birds) {
            this.activeAmbience.birds = { active: true };
          }
          if (!this.activeAmbience.birds.active) return;
          
          const now = this.ctx.currentTime;
          const baseFreq = 2500 + Math.random() * 2000;
          const bursts = 2 + Math.floor(Math.random() * 4);
          
          for (let i = 0; i < bursts; i++) {
            const t = now + i * 0.15;
            const osc = this.ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq + Math.random() * 500, t);
            osc.frequency.linearRampToValueAtTime(baseFreq - 300 + Math.random() * 400, t + 0.1);
            
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.025, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            
            // 空间化 - 鸟在天上
            const panner = this.createSpatialSource(
              (Math.random() - 0.5) * 20,
              8 + Math.random() * 5,
              -15 - Math.random() * 10
            );
            
            osc.connect(gain);
            gain.connect(panner);
            
            osc.start(t);
            osc.stop(t + 0.2);
          }
          
          // 更新点光源
          document.getElementById('dot-bird').classList.add('active');
          
          setTimeout(chirp, 8000 + Math.random() * 12000);
        };
        
        setTimeout(chirp, 2000 + Math.random() * 5000);
      }

      startChime() {
        const playChime = () => {
          if (!this.activeAmbience.chime) {
            this.activeAmbience.chime = { active: true };
          }
          if (!this.activeAmbience.chime.active) return;
          
          const now = this.ctx.currentTime;
          const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00]; // C D E G A
          const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
          
          // 主音
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          // 泛音
          const osc2 = this.ctx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.value = freq * 2.01;
          
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.08, now + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 5);
          
          const gain2 = this.ctx.createGain();
          gain2.gain.setValueAtTime(0, now);
          gain2.gain.linearRampToValueAtTime(0.03, now + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 3);
          
          // 空间化 - 远山
          const panner = this.createSpatialSource(-8, 3, -25);
          
          osc.connect(gain);
          osc2.connect(gain2);
          gain.connect(panner);
          gain2.connect(panner);
          
          osc.start(now);
          osc2.start(now);
          osc.stop(now + 5.5);
          osc2.stop(now + 3.5);
          
          // 更新点光源
          document.getElementById('dot-chime').classList.add('active');
          
          setTimeout(playChime, 10000 + Math.random() * 15000);
        };
        
        setTimeout(playChime, 4000 + Math.random() * 6000);
      }

      // ===== 交互音效 =====
      
      // 点击山石 - 石头打击音
      playStone(x, y, z) {
        const panner = this.createSpatialSource(x, y, z);
        
        // 低沉的石头声
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150 + Math.random() * 100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.3);
        
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
        
        // 添加点击感
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.createNoiseBuffer(0.1, 'white');
        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 2000;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        
        osc.connect(gain);
        gain.connect(panner);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(panner);
        
        osc.start();
        osc.stop(this.ctx.currentTime + 0.8);
        noise.start();
        noise.stop(this.ctx.currentTime + 0.1);
      }

      // 点击水面 - 水波声
      playWater(x, y, z) {
        const panner = this.createSpatialSource(x, y, z);
        
        // 水波涟漪
        for (let i = 0; i < 3; i++) {
          const t = this.ctx.currentTime + i * 0.15;
          
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 + i * 100, t);
          osc.frequency.exponentialRampToValueAtTime(200 - i * 30, t + 0.4);
          
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.08 - i * 0.02, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
          
          osc.connect(gain);
          gain.connect(panner);
          osc.start(t);
          osc.stop(t + 0.5);
        }
        
        // 更新点光源
        document.getElementById('dot-water').classList.add('active');
        setTimeout(() => {
          document.getElementById('dot-water').classList.remove('active');
        }, 1000);
      }

      // 点击松树 - 风吹树叶
      playWind(x, y, z) {
        const panner = this.createSpatialSource(x, y, z);
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.createNoiseBuffer(2, 'pink');
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 600;
        filter.Q.value = 1;
        
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 0.3);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.5);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        noise.start();
        noise.stop(this.ctx.currentTime + 1.5);
      }

      // 点击远山 - 钟声
      playChimeClick(x, y, z) {
        const panner = this.createSpatialSource(x, y, z);
        
        const pentatonic = [261.63, 329.63, 392.00, 523.25]; // C E G C
        const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
        
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        const osc2 = this.ctx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.value = freq * 3;
        
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, this.ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 4);
        
        const gain2 = this.ctx.createGain();
        gain2.gain.setValueAtTime(0, this.ctx.currentTime);
        gain2.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.03);
        gain2.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 2);
        
        osc.connect(gain);
        osc2.connect(gain2);
        gain.connect(panner);
        gain2.connect(panner);
        
        osc.start();
        osc2.start();
        osc.stop(this.ctx.currentTime + 4.5);
        osc2.stop(this.ctx.currentTime + 2.5);
      }

      // 生成噪声
      createNoiseBuffer(duration, type = 'white') {
        const sampleRate = this.ctx.sampleRate;
        const length = sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        
        for (let i = 0; i < length; i++) {
          const white = Math.random() * 2 - 1;
          
          if (type === 'pink') {
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
            b6 = white * 0.115926;
          } else {
            data[i] = white;
          }
        }
        return buffer;
      }
    }

    // ========== 主逻辑 ==========
    const zenSound = new ZenSoundscape();

    // 初始化音频
    async function initAudio() {
      if (!zenSound.audioReady) {
        await zenSound.init();
      }
      zenSound.updateListener();
    }

    // 交互事件
    document.querySelectorAll('.sound-source').forEach(el => {
      el.addEventListener('click', async (evt) => {
        await initAudio();
        
        const soundType = el.dataset.sound;
        const pos = el.dataset.pos.split(' ').map(Number);
        const [x, y, z] = pos;
        
        // 视觉反馈 - 涟漪效果
        createRipple(x, y, z);
        
        // 播放音效
        switch (soundType) {
          case 'stone':
            zenSound.playStone(x, y, z);
            break;
          case 'water':
            zenSound.playWater(x, y, z);
            break;
          case 'wind':
            zenSound.playWind(x, y, z);
            break;
          case 'chime':
            zenSound.playChimeClick(x, y, z);
            break;
        }
      });
    });

    // 创建涟漪视觉效果
    function createRipple(x, y, z) {
      const ripple = document.createElement('a-ring');
      ripple.setAttribute('position', `${x} ${y + 0.02} ${z}`);
      ripple.setAttribute('radius-inner', '0');
      ripple.setAttribute('radius-outer', '0.1');
      ripple.setAttribute('rotation', '-90 0 0');
      ripple.setAttribute('color', '#6b8e6b');
      ripple.setAttribute('material', 'opacity: 0.7; transparent: true');
      ripple.setAttribute('animation', 'property: scale; to: 15 15 1; dur: 1500; easing: easeOutQuad');
      ripple.setAttribute('animation__fade', 'property: material.opacity; to: 0; dur: 1500; easing: easeOutQuad');
      
      document.querySelector('a-scene').appendChild(ripple);
      setTimeout(() => ripple.remove(), 1500);
    }

    // 相机移动时更新音频
    document.querySelector('#rig').addEventListener('componentchanged', () => {
      if (zenSound.audioReady) {
        zenSound.updateListener();
      }
    });

    // 持续更新听者位置
    document.querySelector('a-scene').addEventListener('enter-vr', () => {
      if (zenSound.audioReady) {
        zenSound.updateListener();
      }
    });

    // 首次交互启动
    ['click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, initAudio, { once: true });
    });

    // 每帧更新听者位置
    document.querySelector('a-scene').addEventListener('loaded', () => {
      function updateLoop() {
        if (zenSound.audioReady) {
          zenSound.updateListener();
        }
        requestAnimationFrame(updateLoop);
      }
      updateLoop();
    });
  </script>
</body>
</html>
