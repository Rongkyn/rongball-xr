<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>社区组件综合 - 绒球 XR 实验室</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <!-- 社区组件 -->
    <script src="https://unpkg.com/aframe-particle-system-component/dist/aframe-particle-system-component.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-extras/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene 
      renderer="antialias: true; colorManagement: true"
      environment="preset: tron; lighting: none; shadow: true; fog: 0.15"
    >
      <!-- 粒子系统 -->
      <a-entity particle-system="preset: rain; particleCount: 500; maxAge: 2; velocityValue: 0 5 0"></a-entity>

      <!-- 灯光 -->
      <a-light type="ambient" color="#202040" intensity="0.4"></a-light>
      <a-light type="point" color="#E8A87C" intensity="0.8" position="0 8 0" distance="25" decay="2"
        animation="property: position; from: -5 8 -5; to: 5 8 5; dur: 8000; dir: alternate; loop: true; easing: easeInOutQuad"></a-light>
      <a-light type="point" color="#7BC8A4" intensity="0.5" position="5 4 -5" distance="15" decay="2"
        animation="property: position; from: 5 4 -5; to: -5 6 5; dur: 10000; dir: alternate; loop: true; easing: easeInOutSine"></a-light>
      <a-light type="directional" color="#3498DB" intensity="0.3" position="-3 10 5" castShadow="true"></a-light>

      <!-- 海洋 -->
      <a-ocean="width: 50; depth: 50; speed: 0.5; amplitude: 0.3; amplitudeVariance: 0.3"></a-ocean>

      <!-- 交互几何体 -->
      <a-box class="clickable" position="-3 1.5 -5" rotation="0 30 0" width="1" height="1" depth="1" 
        color="#E8A87C" shadow="cast: true"
        animation="property: rotation; to: 0 390 0; dur: 6000; loop: true; easing: linear"
        interaction-behavior></a-box>

      <a-sphere class="clickable" position="0 2 -6" radius="0.8" color="#7BC8A4" shadow="cast: true"
        animation="property: position; from: 0 1.5 -6; to: 0 3 -6; dur: 3000; dir: alternate; loop: true; easing: easeInOutQuad"
        interaction-behavior></a-sphere>

      <a-torus class="clickable" position="3 2 -5" radius="0.7" radius-tubular="0.12" 
        color="#F7DC6F" shadow="cast: true"
        animation="property: rotation; to: 360 360 0; dur: 8000; loop: true; easing: linear"
        interaction-behavior></a-torus>

      <!-- 相机 + VR 手柄 -->
      <a-entity id="camera-rig" position="0 1.6 3" movement-controls="speed: 0.15; fly: true">
        <a-camera look-controls wasd-controls="enabled: false">
          <a-cursor color="#E8A87C" raycaster="objects: .clickable; far: 20"></a-cursor>
        </a-camera>
        <a-entity laser-controls="hand: left; model: true; defaultModelColor: #7BC8A4"
          raycaster="objects: .clickable; far: 20; showLine: true" line="color: #7BC8A4; opacity: 0.5"></a-entity>
        <a-entity laser-controls="hand: right; model: true; defaultModelColor: #E8A87C"
          raycaster="objects: .clickable; far: 20; showLine: true" line="color: #E8A87C; opacity: 0.5"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      // 点击变色 + 缩放反馈
      AFRAME.registerComponent('interaction-behavior', {
        init: function () {
          const colors = ['#E74C3C', '#3498DB', '#2ECC71', '#F7DC6F', '#E8A87C', '#9B59B6', '#1ABC9C'];
          let idx = 0;
          const el = this.el;

          const handleClick = () => {
            idx = (idx + 1) % colors.length;
            el.setAttribute('material', 'color', colors[idx]);
            // 点击缩放反馈
            el.setAttribute('animation__click', 'property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dur: 150; easing: easeOutQuad');
            setTimeout(() => {
              el.setAttribute('animation__click', 'property: scale; to: 1 1 1; dur: 200; easing: easeOutBack');
            }, 150);
          };

          el.addEventListener('click', handleClick);
          el.addEventListener('triggerdown', handleClick);

          el.addEventListener('mouseenter', () => {
            el.setAttribute('material', 'emissive', '#333');
            el.setAttribute('material', 'emissiveIntensity', '0.4');
          });
          el.addEventListener('mouseleave', () => {
            el.setAttribute('material', 'emissive', '#000');
            el.setAttribute('material', 'emissiveIntensity', '0');
          });
        }
      });
    </script>
  </body>
</html>
