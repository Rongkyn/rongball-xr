<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Soundscape Demo - 绒球 XR 实验室</title>
    <meta name="description" content="空间音频创作 VR 原型 — 支持 VR 手柄交互">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      .info-panel {
        position: fixed; top: 20px; left: 20px;
        background: rgba(0,0,0,0.75); color: #fff;
        padding: 16px 20px; border-radius: 12px;
        font-family: system-ui, sans-serif; font-size: 14px;
        line-height: 1.6; max-width: 340px; z-index: 999;
        backdrop-filter: blur(10px); border: 1px solid rgba(123,200,164,0.15);
      }
      .info-panel h3 { margin-bottom: 8px; color: #7BC8A4; font-size: 15px; }
      .info-panel p { margin: 3px 0; opacity: 0.85; }
      .info-panel .key { font-weight: 600; }
      .red { color: #E74C3C; } .blue { color: #3498DB; } .green { color: #2ECC71; }
      .badge { display: inline-block; background: rgba(232,168,124,0.2); color: #E8A87C; padding: 1px 7px; border-radius: 8px; font-size: 11px; margin-left: 4px; }
      .hint { margin-top: 10px; font-size: 11px; opacity: 0.5; }
    </style>
  </head>
  <body>

    <div class="info-panel" id="infoPanel">
      <h3>🧶 VR Soundscape 空间音频原型</h3>
      <p>用 <span class="key">手柄射线</span> 指向球体，扣扳机切换声源</p>
      <p><span class="key red">红球</span> 雨声 <span class="badge">环境音</span></p>
      <p><span class="key blue">蓝球</span> 铃声 <span class="badge">点声源</span></p>
      <p><span class="key green">绿球</span> 风声 <span class="badge">氛围音</span></p>
      <p class="hint">桌面端：鼠标点击球体 | VR 端：手柄射线 + 扳机</p>
    </div>

    <a-scene 
      renderer="antialias: true; colorManagement: true; sortObjects: true"
      vr-mode-ui="enabled: true"
      device-orientation-permission-ui="enabled: true"
    >
      <!-- ====== 环境 ====== -->
      <a-sky color="#0a0a1a"></a-sky>
      
      <!-- 地面 -->
      <a-plane 
        position="0 0 0" rotation="-90 0 0" 
        width="40" height="40" 
        color="#111122"
        shadow="receive: true"
      ></a-plane>

      <!-- 网格地面 -->
      <a-entity
        geometry="primitive: plane; width: 40; height: 40; segmentsWidth: 40; segmentsHeight: 40"
        material="color: #1a2a3e; opacity: 0.25; transparent: true; wireframe: true; wireframeLinewidth: 1"
        rotation="-90 0 0" position="0 0.01 0"
      ></a-entity>

      <!-- ====== 灯光 ====== -->
      <a-light type="ambient" color="#303050" intensity="0.5"></a-light>
      <a-light type="point" color="#E8A87C" intensity="0.6" position="0 6 0" distance="20" decay="2"></a-light>
      <a-light type="directional" color="#7BC8A4" intensity="0.3" position="-5 10 -5" castShadow="true"></a-light>

      <!-- ====== 中央交互台 ====== -->
      <a-entity id="center-platform" position="0 0 -4">
        <!-- 平台基座 -->
        <a-cylinder 
          position="0 0.05 0" radius="3.5" height="0.1" 
          color="#1a1a3a" segments-radial="48" shadow="receive: true"
        ></a-cylinder>
        
        <!-- 平台光环 -->
        <a-torus 
          position="0 0.12 0" rotation="-90 0 0"
          radius="3.5" radius-tubular="0.025"
          color="#7BC8A4" opacity="0.5" segments-tubular="64"
          animation="property: rotation; from: -90 0 0; to: -90 360 0; dur: 25000; loop: true; easing: linear"
        ></a-torus>

        <!-- 内圈光环 -->
        <a-torus 
          position="0 0.12 0" rotation="-90 0 0"
          radius="2" radius-tubular="0.015"
          color="#E8A87C" opacity="0.3" segments-tubular="48"
          animation="property: rotation; from: -90 0 0; to: -90 -360 0; dur: 18000; loop: true; easing: linear"
        ></a-torus>

        <!-- ====== 声源球体（可交互） ====== -->
        
        <!-- 雨声源 -->
        <a-entity id="source-rain" class="clickable"
          position="-2 1 -1"
          sound-toggle="type: rain"
        >
          <a-sphere 
            radius="0.28" color="#E74C3C" opacity="0.85"
            shader="standard" metalness="0.2" roughness="0.5" shadow
            animation="property: scale; from: 1 1 1; to: 1.12 1.12 1.12; dur: 1500; dir: alternate; loop: true; easing: easeInOutQuad"
          ></a-sphere>
          <!-- 声源波纹 -->
          <a-ring radius-inner="0.33" radius-outer="0.37" color="#E74C3C" opacity="0.3" side="double"
            animation="property: scale; from: 1 1 1; to: 2.2 2.2 2.2; dur: 2000; loop: true; easing: easeOutQuad"
            animation__opacity="property: material.opacity; from: 0.35; to: 0; dur: 2000; loop: true; easing: linear"
          ></a-ring>
          <!-- 标签（面向相机） -->
          <a-text value="雨声" align="center" position="0 0.55 0" color="#E74C3C" width="2.5"></a-text>
          <!-- 状态指示 -->
          <a-text class="status-label" value="●" align="center" position="0 -0.5 0" color="#555" width="1.5"></a-text>
        </a-entity>

        <!-- 铃声源 -->
        <a-entity id="source-bell" class="clickable"
          position="0 1.4 -1"
          sound-toggle="type: bell"
        >
          <a-sphere 
            radius="0.28" color="#3498DB" opacity="0.85"
            shader="standard" metalness="0.4" roughness="0.3" shadow
            animation="property: scale; from: 1 1 1; to: 1.18 1.18 1.18; dur: 1000; dir: alternate; loop: true; easing: easeInOutQuad"
          ></a-sphere>
          <a-ring radius-inner="0.33" radius-outer="0.37" color="#3498DB" opacity="0.3" side="double"
            animation="property: scale; from: 1 1 1; to: 2.8 2.8 2.8; dur: 2500; loop: true; easing: easeOutQuad"
            animation__opacity="property: material.opacity; from: 0.4; to: 0; dur: 2500; loop: true; easing: linear"
          ></a-ring>
          <a-text value="铃声" align="center" position="0 0.55 0" color="#3498DB" width="2.5"></a-text>
          <a-text class="status-label" value="●" align="center" position="0 -0.5 0" color="#555" width="1.5"></a-text>
        </a-entity>

        <!-- 风声源 -->
        <a-entity id="source-wind" class="clickable"
          position="2 0.8 -1"
          sound-toggle="type: wind"
        >
          <a-sphere 
            radius="0.28" color="#2ECC71" opacity="0.85"
            shader="standard" metalness="0.1" roughness="0.7" shadow
            animation="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 2000; dir: alternate; loop: true; easing: easeInOutQuad"
          ></a-sphere>
          <a-ring radius-inner="0.33" radius-outer="0.37" color="#2ECC71" opacity="0.3" side="double"
            animation="property: scale; from: 1 1 1; to: 2 2 2; dur: 3000; loop: true; easing: easeOutQuad"
            animation__opacity="property: material.opacity; from: 0.3; to: 0; dur: 3000; loop: true; easing: linear"
          ></a-ring>
          <a-text value="风声" align="center" position="0 0.55 0" color="#2ECC71" width="2.5"></a-text>
          <a-text class="status-label" value="●" align="center" position="0 -0.5 0" color="#555" width="1.5"></a-text>
        </a-entity>
      </a-entity>

      <!-- ====== 远处装饰 ====== -->
      <a-entity position="-8 3 -14">
        <a-sphere radius="0.4" color="#E8A87C" opacity="0.2"
          animation="property: position; from: -8 3 -14; to: -8 5 -14; dur: 5000; dir: alternate; loop: true; easing: easeInOutQuad"
        ></a-sphere>
      </a-entity>
      <a-entity position="9 4 -12">
        <a-sphere radius="0.25" color="#7BC8A4" opacity="0.2"
          animation="property: position; from: 9 4 -12; to: 9 2.5 -12; dur: 4000; dir: alternate; loop: true; easing: easeInOutQuad"
        ></a-sphere>
      </a-entity>
      <a-entity position="6 2 -18">
        <a-sphere radius="0.35" color="#3498DB" opacity="0.15"
          animation="property: position; from: 6 2 -18; to: 8 3.5 -18; dur: 6000; dir: alternate; loop: true; easing: easeInOutQuad"
        ></a-sphere>
      </a-entity>

      <!-- ====== 浮动粒子 ====== -->
      <a-entity id="particles"></a-entity>

      <!-- ====== 相机 + 手柄 ====== -->
      <a-entity id="camera-rig" position="0 1.6 2" movement-controls="speed: 0.1">
        <a-camera 
          look-controls="magicWindowTrackingElement: true"
          wasd-controls="enabled: false"
        >
          <!-- 桌面端注视光标（仅非VR模式） -->
          <a-cursor 
            id="desktop-cursor"
            color="#E8A87C" 
            raycaster="objects: .clickable; far: 20"
            animation__click="property: scale; from: 1 1 1; to: 0.3 0.3 0.3; startEvents: click; dur: 150; easing: easeOutQuad"
            animation__restore="property: scale; to: 1 1 1; startEvents: animationcomplete__click; dur: 150; easing: easeOutQuad"
          ></a-cursor>
        </a-camera>

        <!-- ====== VR 左手柄 ====== -->
        <a-entity 
          id="left-hand"
          laser-controls="hand: left; model: true; defaultModelColor: #7BC8A4"
          raycaster="objects: .clickable; far: 20; showLine: true"
          line="color: #7BC8A4; opacity: 0.6"
        ></a-entity>

        <!-- ====== VR 右手柄 ====== -->
        <a-entity 
          id="right-hand"
          laser-controls="hand: right; model: true; defaultModelColor: #E8A87C"
          raycaster="objects: .clickable; far: 20; showLine: true"
          line="color: #E8A87C; opacity: 0.6"
        ></a-entity>
      </a-entity>

    </a-scene>

    <script>
      // ====== 自定义组件：声音切换 ======
      AFRAME.registerComponent('sound-toggle', {
        schema: { type: { default: 'rain' } },

        init: function () {
          this.isPlaying = false;
          this.audioCtx = null;
          this.nodes = null;
          this.statusLabel = this.el.querySelector('.status-label');
          
          // 绑定交互事件 — 同时支持鼠标和手柄
          this.el.addEventListener('click', () => this.toggle());
          
          // 手柄扳机事件
          this.el.addEventListener('triggerdown', () => this.toggle());
          
          // 悬停高亮
          this.el.addEventListener('mouseenter', () => {
            const sphere = this.el.querySelector('a-sphere');
            if (sphere) sphere.setAttribute('opacity', '1');
          });
          this.el.addEventListener('mouseleave', () => {
            const sphere = this.el.querySelector('a-sphere');
            if (sphere) sphere.setAttribute('opacity', '0.85');
          });
        },

        toggle: function () {
          if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }

          if (this.isPlaying) {
            this.stop();
          } else {
            this.play();
          }
        },

        play: function () {
          const type = this.data.type;
          const pos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(pos);
          
          let nodes;
          if (type === 'rain') nodes = this.createRain(pos);
          else if (type === 'bell') nodes = this.createBell(pos);
          else if (type === 'wind') nodes = this.createWind(pos);
          
          this.nodes = nodes;
          this.isPlaying = true;
          
          if (this.statusLabel) {
            this.statusLabel.setAttribute('value', '▶');
            this.statusLabel.setAttribute('color', '#7BC8A4');
          }
          console.log(`🧶 Playing: ${type}`);
        },

        stop: function () {
          if (!this.nodes) return;
          const type = this.data.type;
          
          try {
            if (type === 'bell') {
              this.nodes.sources.forEach(s => { try { s.stop(); } catch(e){} });
              this.nodes.lfo.stop();
            } else {
              this.nodes.source.stop();
              if (this.nodes.lfo) this.nodes.lfo.stop();
            }
          } catch(e) { console.warn('stop error:', e); }
          
          this.isPlaying = false;
          this.nodes = null;
          
          if (this.statusLabel) {
            this.statusLabel.setAttribute('value', '●');
            this.statusLabel.setAttribute('color', '#555');
          }
          console.log(`🧶 Stopped: ${type}`);
        },

        createPanner: function (pos) {
          const panner = this.audioCtx.createPanner();
          panner.panningModel = 'HRTF';
          panner.distanceModel = 'inverse';
          panner.refDistance = 1;
          panner.maxDistance = 15;
          panner.rolloffFactor = 1;
          panner.coneInnerAngle = 360;
          panner.coneOuterAngle = 360;
          panner.setPosition(pos.x, pos.y, pos.z);
          return panner;
        },

        createRain: function (pos) {
          const ctx = this.audioCtx;
          const bufferSize = 2 * ctx.sampleRate;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.12;
          
          const source = ctx.createBufferSource();
          source.buffer = buffer; source.loop = true;
          
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass'; filter.frequency.value = 1000; filter.Q.value = 0.5;
          
          const gain = ctx.createGain(); gain.gain.value = 0.3;
          const panner = this.createPanner(pos);
          
          source.connect(filter).connect(gain).connect(panner).connect(ctx.destination);
          source.start();
          return { source, panner };
        },

        createBell: function (pos) {
          const ctx = this.audioCtx;
          const osc1 = ctx.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = 880;
          const osc2 = ctx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 1320;
          
          const gain = ctx.createGain(); gain.gain.value = 0.12;
          
          const lfo = ctx.createOscillator(); lfo.frequency.value = 6;
          const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.04;
          lfo.connect(lfoGain).connect(gain.gain);
          
          const panner = this.createPanner(pos);
          osc1.connect(gain).connect(panner).connect(ctx.destination);
          osc2.connect(gain);
          
          osc1.start(); osc2.start(); lfo.start();
          return { sources: [osc1, osc2], lfo, panner };
        },

        createWind: function (pos) {
          const ctx = this.audioCtx;
          const bufferSize = 2 * ctx.sampleRate;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.08;
          
          const source = ctx.createBufferSource();
          source.buffer = buffer; source.loop = true;
          
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass'; filter.frequency.value = 400; filter.Q.value = 1;
          
          const gain = ctx.createGain(); gain.gain.value = 0.25;
          
          const lfo = ctx.createOscillator(); lfo.frequency.value = 0.3;
          const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.08;
          lfo.connect(lfoGain).connect(gain.gain);
          
          const panner = this.createPanner(pos);
          source.connect(filter).connect(gain).connect(panner).connect(ctx.destination);
          source.start(); lfo.start();
          return { source, panner, lfo };
        }
      });

      // ====== 浮动粒子 ======
      function createParticles() {
        const container = document.getElementById('particles');
        const colors = ['#E8A87C', '#7BC8A4', '#3498DB', '#F7DC6F'];
        for (let i = 0; i < 25; i++) {
          const x = (Math.random() - 0.5) * 20;
          const y = 0.5 + Math.random() * 5;
          const z = -2 - Math.random() * 20;
          const size = 0.02 + Math.random() * 0.05;
          const color = colors[Math.floor(Math.random() * colors.length)];
          const dur = 4000 + Math.random() * 6000;
          
          const el = document.createElement('a-sphere');
          el.setAttribute('radius', size);
          el.setAttribute('color', color);
          el.setAttribute('opacity', 0.2 + Math.random() * 0.3);
          el.setAttribute('position', `${x} ${y} ${z}`);
          el.setAttribute('animation', `property: position; to: ${x + (Math.random()-0.5)*3} ${y + (Math.random()-0.5)*2} ${z}; dur: ${dur}; dir: alternate; loop: true; easing: easeInOutQuad`);
          container.appendChild(el);
        }
      }

      // ====== 场景加载 ======
      document.querySelector('a-scene').addEventListener('loaded', () => {
        createParticles();
        console.log('🧶 VR Soundscape Demo loaded — 手柄已就绪');
      });

      // 进入/退出 VR 时切换 UI
      document.querySelector('a-scene').addEventListener('enter-vr', () => {
        document.getElementById('infoPanel').style.display = 'none';
      });
      document.querySelector('a-scene').addEventListener('exit-vr', () => {
        document.getElementById('infoPanel').style.display = 'block';
      });
    </script>
  </body>
</html>
