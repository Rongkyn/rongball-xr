<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>练习：自定义组件 - 绒球 A-Frame 学习</title>
    <meta name="description" content="跟着官方 Writing a Component 教程练习">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // ====== 练习1: hello-world 组件 ======
      AFRAME.registerComponent('hello-world', {
        init: function () {
          console.log('🧶 Hello, World! 绒球组件已初始化');
        }
      });

      // ====== 练习2: log 组件（带 schema、事件、更新）======
      AFRAME.registerComponent('log', {
        schema: {
          event: {type: 'string', default: ''},
          message: {type: 'string', default: 'Hello, World!'}
        },
        multiple: true,
        init: function () {
          var self = this;
          this.eventHandlerFn = function () { console.log(self.data.message); };
        },
        update: function (oldData) {
          var data = this.data;
          var el = this.el;
          if (oldData.event && data.event !== oldData.event) {
            el.removeEventListener(oldData.event, this.eventHandlerFn);
          }
          if (data.event) {
            el.addEventListener(data.event, this.eventHandlerFn);
          } else {
            console.log(data.message);
          }
        },
        remove: function () {
          var data = this.data;
          var el = this.el;
          if (data.event) {
            el.removeEventListener(data.event, this.eventHandlerFn);
          }
        }
      });

      // ====== 练习3: box 组件（three.js 网格操作）======
      AFRAME.registerComponent('custom-box', {
        schema: {
          width: {type: 'number', default: 1},
          height: {type: 'number', default: 1},
          depth: {type: 'number', default: 1},
          color: {type: 'color', default: '#AAA'}
        },
        init: function () {
          var data = this.data;
          var el = this.el;
          this.geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
          this.material = new THREE.MeshStandardMaterial({color: data.color});
          this.mesh = new THREE.Mesh(this.geometry, this.material);
          el.setObject3D('mesh', this.mesh);
        },
        update: function (oldData) {
          var data = this.data;
          var el = this.el;
          if (Object.keys(oldData).length === 0) return;
          if (data.width !== oldData.width ||
              data.height !== oldData.height ||
              data.depth !== oldData.depth) {
            el.getObject3D('mesh').geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
          }
          if (data.color !== oldData.color) {
            el.getObject3D('mesh').material.color = new THREE.Color(data.color);
          }
        },
        remove: function () {
          this.el.removeObject3D('mesh');
        }
      });

      // ====== 练习4: follow 组件（tick 持续行为）======
      AFRAME.registerComponent('follow', {
        schema: {
          target: {type: 'selector'},
          speed: {type: 'number'}
        },
        init: function () {
          this.directionVec3 = new THREE.Vector3();
        },
        tick: function (time, timeDelta) {
          var directionVec3 = this.directionVec3;
          var targetPosition = this.data.target.object3D.position;
          var currentPosition = this.el.object3D.position;
          directionVec3.copy(targetPosition).sub(currentPosition);
          var distance = directionVec3.length();
          if (distance < 1) return;
          var factor = this.data.speed / distance;
          ['x', 'y', 'z'].forEach(function (axis) {
            directionVec3[axis] *= factor * (timeDelta / 1000);
          });
          this.el.setAttribute('position', {
            x: currentPosition.x + directionVec3.x,
            y: currentPosition.y + directionVec3.y,
            z: currentPosition.z + directionVec3.z
          });
        }
      });

      // ====== 练习5: cursor-listener 组件（颜色切换）======
      AFRAME.registerComponent('cursor-listener', {
        init: function () {
          var lastIndex = -1;
          var COLORS = ['#E74C3C', '#2ECC71', '#3498DB', '#F39C12', '#9B59B6', '#1ABC9C'];
          this.el.addEventListener('click', function (evt) {
            lastIndex = (lastIndex + 1) % COLORS.length;
            this.setAttribute('material', 'color', COLORS[lastIndex]);
            console.log('点击位置: ', evt.detail.intersection.point);
          });
        }
      });

      // ====== 练习6: 自定义粒子组件（不用社区库）======
      AFRAME.registerComponent('floating-particles', {
        schema: {
          count: {type: 'number', default: 50},
          spread: {type: 'number', default: 10},
          size: {type: 'number', default: 0.05},
          speed: {type: 'number', default: 1},
          color: {type: 'color', default: '#E8A87C'}
        },
        init: function () {
          this.particles = [];
          this.velocities = [];
          var data = this.data;
          
          for (var i = 0; i < data.count; i++) {
            var particleGeo = new THREE.SphereGeometry(data.size, 6, 6);
            var particleMat = new THREE.MeshBasicMaterial({
              color: data.color,
              transparent: true,
              opacity: 0.3 + Math.random() * 0.5
            });
            var particle = new THREE.Mesh(particleGeo, particleMat);
            particle.position.set(
              (Math.random() - 0.5) * data.spread,
              Math.random() * data.spread * 0.5,
              (Math.random() - 0.5) * data.spread
            );
            this.el.object3D.add(particle);
            this.particles.push(particle);
            this.velocities.push({
              x: (Math.random() - 0.5) * data.speed * 0.01,
              y: (Math.random() - 0.5) * data.speed * 0.005,
              z: (Math.random() - 0.5) * data.speed * 0.01
            });
          }
        },
        tick: function (time, timeDelta) {
          var spread = this.data.spread;
          for (var i = 0; i < this.particles.length; i++) {
            var p = this.particles[i];
            var v = this.velocities[i];
            p.position.x += v.x * timeDelta;
            p.position.y += v.y * timeDelta;
            p.position.z += v.z * timeDelta;
            // 边界弹回
            if (Math.abs(p.position.x) > spread / 2) v.x *= -1;
            if (p.position.y > spread * 0.5 || p.position.y < 0) v.y *= -1;
            if (Math.abs(p.position.z) > spread / 2) v.z *= -1;
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <!-- 使用 hello-world 组件 -->
      <a-entity hello-world></a-entity>

      <!-- 使用 log 组件（多实例） -->
      <a-entity log__welcome="message: 欢迎来到绒球 A-Frame 练习场！"
                log__tip="event: click; message: 你点击了场景！"></a-entity>

      <!-- 天空和环境 -->
      <a-sky color="#1a1a2e"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" 
               color="#16213e" shadow="receive: true"></a-plane>

      <!-- 光照 -->
      <a-light type="ambient" color="#404060" intensity="0.4"></a-light>
      <a-light type="point" color="#E8A87C" intensity="0.8" position="0 5 0" distance="15"></a-light>
      <a-light type="directional" color="#7BC8A4" intensity="0.3" position="-5 8 -5" castShadow="true"></a-light>

      <!-- 练习3: 自定义 box 组件 -->
      <a-entity custom-box="width: 1; height: 1; depth: 1; color: #E8A87C" position="-3 0.5 -5"></a-entity>

      <!-- 练习5: cursor-listener 可点击变色的球 -->
      <a-sphere cursor-listener radius="0.5" color="#4CC3D9" position="0 1.5 -5" shadow></a-sphere>
      <a-sphere cursor-listener radius="0.4" color="#EF2D5E" position="2 1 -4" shadow></a-sphere>
      <a-sphere cursor-listener radius="0.35" color="#FFC65D" position="-2 1.2 -6" shadow></a-sphere>

      <!-- 练习4: follow 组件 - 小球跟随目标 -->
      <a-box id="follow-target" color="#2ECC71" position="0 1 -8" width="0.3" height="0.3" depth="0.3"
             animation="property: position; to: 3 1 -5; dur: 3000; dir: alternate; loop: true; easing: easeInOutSine">
      </a-box>
      <a-sphere follow="target: #follow-target; speed: 2" radius="0.2" color="#9B59B6" position="-3 1 -8"
                material="emissive: #9B59B6; emissiveIntensity: 0.3">
      </a-sphere>

      <!-- 练习6: 自定义粒子组件 -->
      <a-entity floating-particles="count: 80; spread: 12; size: 0.04; speed: 0.8; color: #E8A87C" position="0 0 -5"></a-entity>

      <!-- 光标 -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-cursor color="#E8A87C" fuse="true" fuse-timeout="1500"
                  animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                  animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
                  animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
        </a-cursor>
      </a-entity>

      <!-- 说明文字 -->
      <a-text value="🧶 A-Frame 自定义组件练习\n\n• 点击球体变色 (cursor-listener)\n• 紫色球跟随绿色方块 (follow)\n• 左方盒 (custom-box)\n• 浮动粒子 (floating-particles)" 
              align="center" position="0 3.5 -8" color="#E8A87C" width="8" font="mozillavr"></a-text>
    </a-scene>
  </body>
</html>
