<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>自定义组件练习 - 绒球 XR 实验室</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene renderer="antialias: true; colorManagement: true">
      <a-sky color="#0a0a1a"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#111122" shadow="receive: true"></a-plane>
      <a-light type="ambient" color="#303050" intensity="0.5"></a-light>
      <a-light type="directional" color="#E8A87C" intensity="0.7" position="2 8 3" castShadow="true"></a-light>

      <!-- 1. hello-world 组件 -->
      <a-entity hello-world position="-3 1.5 -5"></a-entity>

      <!-- 2. log 多实例 -->
      <a-entity log="msg: box1; color: #E8A87C" position="0 1.5 -5"
        geometry="primitive: box; width: 0.8; height: 0.8; depth: 0.8"
        material="color: #E8A87C" shadow="cast: true"
        animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-entity>

      <!-- 3. three.js box -->
      <a-entity three-box position="3 1.5 -5"></a-entity>

      <!-- 4. follow 组件 -->
      <a-entity id="target" position="0 1.5 -5"
        geometry="primitive: sphere; radius: 0.3" material="color: #F7DC6F"
        animation="property: position; to: 3 2 -5; dur: 3000; dir: alternate; loop: true; easing: easeInOutQuad"></a-entity>
      <a-entity follow="target: #target; speed: 2; offset: 0 0 1"
        geometry="primitive: sphere; radius: 0.15" material="color: #7BC8A4; emissive: #7BC8A4; emissiveIntensity: 0.3"
        animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dur: 800; dir: alternate; loop: true"></a-entity>

      <!-- 5. cursor-listener 变色球 -->
      <a-entity class="clickable"
        position="-2 1.2 -3"
        geometry="primitive: sphere; radius: 0.4"
        material="color: #3498DB; shader: standard"
        cursor-listener shadow="cast: true"
        animation="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; dur: 1200; dir: alternate; loop: true; easing: easeInOutQuad"></a-entity>

      <!-- 6. 浮动粒子 -->
      <a-entity id="particles"></a-entity>

      <!-- 相机 + VR 手柄 -->
      <a-entity id="camera-rig" position="0 1.6 2" movement-controls="speed: 0.1">
        <a-camera look-controls wasd-controls="enabled: false">
          <a-cursor color="#E8A87C" raycaster="objects: .clickable; far: 20"></a-cursor>
        </a-camera>
        <a-entity laser-controls="hand: left; model: true; defaultModelColor: #7BC8A4"
          raycaster="objects: .clickable; far: 20; showLine: true" line="color: #7BC8A4; opacity: 0.5"></a-entity>
        <a-entity laser-controls="hand: right; model: true; defaultModelColor: #E8A87C"
          raycaster="objects: .clickable; far: 20; showLine: true" line="color: #E8A87C; opacity: 0.5"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      // 1. hello-world
      AFRAME.registerComponent('hello-world', {
        init: function () {
          const el = document.createElement('a-text');
          el.setAttribute('value', '你好，A-Frame! 🧶');
          el.setAttribute('color', '#7BC8A4');
          el.setAttribute('width', '3');
          el.setAttribute('align', 'center');
          this.el.appendChild(el);
          console.log('hello-world initialized');
        }
      });

      // 2. log（支持多实例）
      AFRAME.registerComponent('log', {
        schema: {
          msg: { type: 'string', default: 'log' },
          color: { type: 'color', default: '#fff' }
        },
        init: function () {
          console.log(`[log] ${this.data.msg} | color: ${this.data.color}`);
        }
      });

      // 3. three.js 直接操作
      AFRAME.registerComponent('three-box', {
        init: function () {
          const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
          const mat = new THREE.MeshStandardMaterial({ color: 0x3498DB, metalness: 0.3, roughness: 0.6 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.castShadow = true;
          this.el.setObject3D('mesh', mesh);
        }
      });

      // 4. follow 组件
      AFRAME.registerComponent('follow', {
        schema: {
          target: { type: 'selector' },
          speed: { type: 'number', default: 2 },
          offset: { type: 'vec3', default: { x: 0, y: 0, z: 0 } }
        },
        tick: function (time, delta) {
          if (!this.data.target) return;
          const targetPos = new THREE.Vector3();
          this.data.target.object3D.getWorldPosition(targetPos);
          const offset = this.data.offset;
          const desired = targetPos.clone().add(new THREE.Vector3(offset.x, offset.y, offset.z));
          const current = this.el.object3D.position;
          current.lerp(desired, this.data.speed * (delta / 1000));
          this.el.object3D.position.copy(current);
        }
      });

      // 5. cursor-listener（点击变色）
      AFRAME.registerComponent('cursor-listener', {
        init: function () {
          const colors = ['#E74C3C', '#3498DB', '#2ECC71', '#F7DC6F', '#E8A87C', '#9B59B6'];
          let idx = 0;
          this.el.addEventListener('click', () => {
            idx = (idx + 1) % colors.length;
            this.el.setAttribute('material', 'color', colors[idx]);
            console.log(`Color changed to ${colors[idx]}`);
          });
          this.el.addEventListener('triggerdown', () => {
            idx = (idx + 1) % colors.length;
            this.el.setAttribute('material', 'color', colors[idx]);
          });
          // 悬停反馈
          this.el.addEventListener('mouseenter', () => {
            this.el.setAttribute('material', 'emissive', '#222');
            this.el.setAttribute('material', 'emissiveIntensity', '0.3');
          });
          this.el.addEventListener('mouseleave', () => {
            this.el.setAttribute('material', 'emissive', '#000');
            this.el.setAttribute('material', 'emissiveIntensity', '0');
          });
        }
      });

      // 6. 浮动粒子
      function createParticles() {
        const container = document.getElementById('particles');
        const colors = ['#E8A87C', '#7BC8A4', '#3498DB', '#F7DC6F'];
        for (let i = 0; i < 20; i++) {
          const x = (Math.random() - 0.5) * 12;
          const y = 0.5 + Math.random() * 4;
          const z = -2 - Math.random() * 12;
          const el = document.createElement('a-sphere');
          el.setAttribute('radius', 0.02 + Math.random() * 0.04);
          el.setAttribute('color', colors[Math.floor(Math.random() * colors.length)]);
          el.setAttribute('opacity', 0.2 + Math.random() * 0.3);
          el.setAttribute('position', `${x} ${y} ${z}`);
          el.setAttribute('animation', `property: position; to: ${x+(Math.random()-0.5)*2} ${y+(Math.random()-0.5)*2} ${z}; dur: ${3000+Math.random()*5000}; dir: alternate; loop: true; easing: easeInOutQuad`);
          container.appendChild(el);
        }
      }

      document.querySelector('a-scene').addEventListener('loaded', () => {
        createParticles();
        console.log('🧶 组件练习场景加载完成');
      });
    </script>
  </body>
</html>
