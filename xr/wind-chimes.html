<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸风铃 · Wind Chimes</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  overflow: hidden;
  font-family: 'Georgia', serif;
  cursor: default;
}
canvas { display: block; }
#ui {
  position: fixed;
  top: 20px;
  left: 20px;
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  pointer-events: none;
  z-index: 10;
}
#title {
  font-size: 22px;
  letter-spacing: 6px;
  margin-bottom: 8px;
  color: rgba(255,255,255,0.8);
}
#subtitle {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
}
#controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  z-index: 10;
}
.ctrl-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 1px;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.ctrl-btn.active { background: rgba(255,200,150,0.2); border-color: rgba(255,200,150,0.4); color: rgba(255,220,180,0.9); }
#wind-indicator {
  position: fixed;
  top: 20px;
  right: 20px;
  color: rgba(255,255,255,0.4);
  font-size: 11px;
  text-align: right;
  pointer-events: none;
}
#start-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,20,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 100;
  cursor: pointer;
}
#start-overlay h1 {
  color: rgba(255,255,255,0.85);
  font-size: 36px;
  letter-spacing: 12px;
  font-weight: 300;
  margin-bottom: 16px;
}
#start-overlay p {
  color: rgba(255,255,255,0.4);
  font-size: 13px;
  letter-spacing: 3px;
}
</style>
</head>
<body>
<div id="start-overlay" onclick="start()">
  <h1>纸 风 铃</h1>
  <p>点击开始 · click to start</p>
</div>
<div id="ui">
  <div id="title">纸风铃</div>
  <div id="subtitle">Wind Chimes</div>
</div>
<div id="wind-indicator">
  <div id="wind-text">微风</div>
  <div id="wind-dir">→</div>
</div>
<div id="controls">
  <button class="ctrl-btn active" onclick="setMaterial(0,this)">竹</button>
  <button class="ctrl-btn" onclick="setMaterial(1,this)">铜</button>
  <button class="ctrl-btn" onclick="setMaterial(2,this)">瓷</button>
  <button class="ctrl-btn" onclick="setMaterial(3,this)">木</button>
  <button class="ctrl-btn" onclick="setWind(0,this)">无风</button>
  <button class="ctrl-btn active" onclick="setWind(1,this)">微风</button>
  <button class="ctrl-btn" onclick="setWind(2,this)">强风</button>
</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx, masterGain;
function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

// Material configs: [freq, decay, harmonics, filterFreq]
const materials = [
  { name:'竹', freq:800, decay:1.8, harmonics:[1,2.5,4], filterFreq:2000, color:'rgba(200,230,180,' },
  { name:'铜', freq:600, decay:3.0, harmonics:[1,2,3,4.2], filterFreq:3000, color:'rgba(220,180,120,' },
  { name:'瓷', freq:1200, decay:1.2, harmonics:[1,3,5], filterFreq:4000, color:'rgba(180,200,240,' },
  { name:'木', freq:400, decay:0.8, harmonics:[1,2], filterFreq:1500, color:'rgba(200,170,140,' }
];
let currentMaterial = 0;

function playChime(x, intensity) {
  if (!audioCtx) return;
  const mat = materials[currentMaterial];
  const now = audioCtx.currentTime;
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = mat.filterFreq;
  
  const vol = 0.15 * Math.min(intensity, 1);
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + mat.decay);
  
  filter.connect(gain);
  gain.connect(masterGain);
  
  // Pan based on x position
  const panner = audioCtx.createStereoPanner();
  panner.pan.value = (x / W) * 2 - 1;
  gain.disconnect();
  gain.connect(panner);
  panner.connect(filter);
  
  mat.harmonics.forEach((h, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i === 0 ? 'sine' : 'triangle';
    osc.frequency.value = mat.freq * h * (0.98 + Math.random() * 0.04);
    const hGain = audioCtx.createGain();
    hGain.gain.value = 1 / (i + 1);
    osc.connect(hGain);
    hGain.connect(filter);
    osc.start(now);
    osc.stop(now + mat.decay);
  });
}

// Wind system
let windStrength = 1; // 0=none, 1=light, 2=strong
let windAngle = 0;
let windTime = 0;
let windGust = 0;

function setWind(level, btn) {
  windStrength = level;
  document.querySelectorAll('.ctrl-btn').forEach(b => {
    if (b.textContent.includes('风') || b.textContent === '无风') b.classList.remove('active');
  });
  btn.classList.add('active');
}

function setMaterial(idx, btn) {
  currentMaterial = idx;
  document.querySelectorAll('.ctrl-btn').forEach(b => {
    if (['竹','铜','瓷','木'].includes(b.textContent)) b.classList.remove('active');
  });
  btn.classList.add('active');
}

// Wind chime tubes
class ChimeTube {
  constructor(x, y, length) {
    this.anchorX = x;
    this.anchorY = y;
    this.length = length;
    this.angle = 0;
    this.angVel = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.lastSoundAngle = 0;
    this.cooldown = 0;
  }
  
  update(dt, wind) {
    // Gravity
    const gravity = 0.5 * Math.sin(this.angle);
    // Wind force
    const windForce = wind * 2.5 * Math.sin(windTime * 0.7 + this.phase);
    // Damping
    const damping = -this.angVel * 0.02;
    
    this.angVel += (gravity + windForce + damping) * dt;
    this.angle += this.angVel * dt;
    this.angle = Math.max(-0.8, Math.min(0.8, this.angle));
    
    this.cooldown -= dt;
    
    // Sound trigger
    const angleDiff = Math.abs(this.angle - this.lastSoundAngle);
    if (angleDiff > 0.15 && this.cooldown <= 0 && Math.abs(this.angVel) > 0.3) {
      const intensity = Math.min(Math.abs(this.angVel) * 0.3, 1);
      const screenX = this.anchorX + Math.sin(this.angle) * this.length * 0.5;
      playChime(screenX, intensity);
      this.lastSoundAngle = this.angle;
      this.cooldown = 0.3;
      
      // Visual ripple
      ripples.push(new Ripple(screenX, this.anchorY + this.length * 0.8, intensity));
    }
  }
  
  draw() {
    const mat = materials[currentMaterial];
    const endX = this.anchorX + Math.sin(this.angle) * this.length;
    const endY = this.anchorY + Math.cos(this.angle) * this.length;
    
    // String
    ctx.beginPath();
    ctx.moveTo(this.anchorX, this.anchorY - 5);
    ctx.lineTo(this.anchorX, this.anchorY);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Tube
    ctx.beginPath();
    ctx.moveTo(this.anchorX, this.anchorY);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = mat.color + '0.6)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // Glow
    ctx.beginPath();
    ctx.moveTo(this.anchorX, this.anchorY);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = mat.color + '0.15)';
    ctx.lineWidth = 12;
    ctx.stroke();
    
    // Tip
    ctx.beginPath();
    ctx.arc(endX, endY, 3, 0, Math.PI * 2);
    ctx.fillStyle = mat.color + '0.8)';
    ctx.fill();
  }
}

// Paper cranes
class PaperCrane {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = -50 + Math.random() * (W + 100);
    this.y = -50;
    this.size = 12 + Math.random() * 18;
    this.speed = 0.3 + Math.random() * 0.5;
    this.wingPhase = Math.random() * Math.PI * 2;
    this.wingSpeed = 2 + Math.random() * 2;
    this.rotation = Math.random() * 0.3 - 0.15;
    this.opacity = 0.3 + Math.random() * 0.4;
    this.drift = Math.random() * 0.5;
  }
  update(dt) {
    const wind = windStrength * 1.5;
    this.x += (Math.sin(windTime * 0.5 + this.drift) * wind + this.speed * 0.3) * dt * 30;
    this.y += this.speed * dt * 30;
    this.wingPhase += this.wingSpeed * dt;
    
    if (this.y > H + 50 || this.x > W + 100 || this.x < -100) this.reset();
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation + Math.sin(windTime + this.drift) * 0.1);
    
    const wing = Math.sin(this.wingPhase) * 0.4;
    const s = this.size;
    
    ctx.globalAlpha = this.opacity;
    
    // Body
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.3);
    ctx.lineTo(s * 0.8, 0);
    ctx.lineTo(0, s * 0.15);
    ctx.lineTo(-s * 0.8, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,250,240,0.7)';
    ctx.fill();
    
    // Wings
    ctx.beginPath();
    ctx.moveTo(-s * 0.3, 0);
    ctx.quadraticCurveTo(-s * 0.8, -s * (0.5 + wing), -s * 1.2, -s * (0.2 + wing * 0.5));
    ctx.strokeStyle = 'rgba(255,250,240,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(s * 0.3, 0);
    ctx.quadraticCurveTo(s * 0.8, -s * (0.5 + wing), s * 1.2, -s * (0.2 + wing * 0.5));
    ctx.stroke();
    
    // Tail
    ctx.beginPath();
    ctx.moveTo(0, s * 0.15);
    ctx.lineTo(s * 0.1, s * 0.5);
    ctx.lineTo(-s * 0.1, s * 0.45);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,250,240,0.5)';
    ctx.fill();
    
    ctx.restore();
  }
}

// Ripples
class Ripple {
  constructor(x, y, intensity) {
    this.x = x; this.y = y;
    this.radius = 5;
    this.maxRadius = 30 + intensity * 40;
    this.opacity = 0.4 * intensity;
    this.speed = 40 + intensity * 30;
  }
  update(dt) {
    this.radius += this.speed * dt;
    this.opacity *= 0.97;
    return this.opacity > 0.01;
  }
  draw() {
    const mat = materials[currentMaterial];
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.strokeStyle = mat.color + this.opacity + ')';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

// Particles (floating dust/pollen)
class Particle {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.size = 1 + Math.random() * 2;
    this.speed = 0.2 + Math.random() * 0.3;
    this.opacity = 0.1 + Math.random() * 0.3;
    this.phase = Math.random() * Math.PI * 2;
  }
  update(dt) {
    this.x += (Math.sin(windTime * 0.3 + this.phase) * windStrength + this.speed) * dt * 20;
    this.y += Math.sin(windTime * 0.5 + this.phase) * 0.3 * dt * 20;
    if (this.x > W + 10) this.x = -10;
    if (this.x < -10) this.x = W + 10;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,240,220,${this.opacity})`;
    ctx.fill();
  }
}

// Initialize
let tubes = [];
let cranes = [];
let ripples = [];
let particles = [];

function initScene() {
  tubes = [];
  const numTubes = 7;
  const barWidth = Math.min(W * 0.5, 400);
  const startX = (W - barWidth) / 2;
  for (let i = 0; i < numTubes; i++) {
    const x = startX + (barWidth / (numTubes - 1)) * i;
    const y = H * 0.18;
    const length = 60 + Math.random() * 80;
    tubes.push(new ChimeTube(x, y, length));
  }
  
  cranes = [];
  for (let i = 0; i < 8; i++) {
    const c = new PaperCrane();
    c.y = Math.random() * H;
    cranes.push(c);
  }
  
  particles = [];
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle());
  }
}

// Background gradient
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1117');
  grad.addColorStop(0.4, '#1a1a2e');
  grad.addColorStop(1, '#16213e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Moon
  const moonX = W * 0.78;
  const moonY = H * 0.15;
  const moonGrad = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 60);
  moonGrad.addColorStop(0, 'rgba(255,240,210,0.15)');
  moonGrad.addColorStop(0.5, 'rgba(255,240,210,0.05)');
  moonGrad.addColorStop(1, 'rgba(255,240,210,0)');
  ctx.fillStyle = moonGrad;
  ctx.fillRect(moonX - 80, moonY - 80, 160, 160);
  
  ctx.beginPath();
  ctx.arc(moonX, moonY, 25, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,245,220,0.12)';
  ctx.fill();
}

// Hanging bar
function drawBar() {
  if (tubes.length === 0) return;
  const x1 = tubes[0].anchorX - 20;
  const x2 = tubes[tubes.length-1].anchorX + 20;
  const y = tubes[0].anchorY - 5;
  
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();
  
  // Hanging strings
  ctx.beginPath();
  ctx.moveTo((x1+x2)/2, y);
  ctx.lineTo((x1+x2)/2, y - 40);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// Wind streaks
function drawWindStreaks() {
  if (windStrength === 0) return;
  const count = windStrength * 5;
  for (let i = 0; i < count; i++) {
    const y = (H * 0.2) + Math.sin(windTime * 2 + i * 1.5) * H * 0.3;
    const x = ((windTime * 100 * windStrength + i * 200) % (W + 200)) - 100;
    const len = 30 + windStrength * 30;
    
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + Math.sin(windTime + i) * 3);
    ctx.strokeStyle = `rgba(255,255,255,${0.03 * windStrength})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// Main loop
let lastTime = 0;
let started = false;

function animate(time) {
  if (!started) { requestAnimationFrame(animate); return; }
  
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  windTime += dt;
  
  // Update wind
  const baseWind = [0, 0.5, 1.5][windStrength];
  windGust += (baseWind - windGust) * 0.02;
  const currentWind = windGust + Math.sin(windTime * 0.3) * 0.2 * windStrength;
  
  // Update UI
  const windNames = ['静', '微风', '清风'];
  document.getElementById('wind-text').textContent = windNames[windStrength];
  
  // Draw
  drawBackground();
  drawWindStreaks();
  
  particles.forEach(p => { p.update(dt); p.draw(); });
  cranes.forEach(c => { c.update(dt); c.draw(); });
  
  drawBar();
  tubes.forEach(t => { t.update(dt, currentWind); t.draw(); });
  
  ripples = ripples.filter(r => {
    const alive = r.update(dt);
    if (alive) r.draw();
    return alive;
  });
  
  requestAnimationFrame(animate);
}

function start() {
  document.getElementById('start-overlay').style.display = 'none';
  initAudio();
  initScene();
  started = true;
  lastTime = performance.now();
}

requestAnimationFrame(animate);

// Click to create wind gust
canvas.addEventListener('click', (e) => {
  if (!started) return;
  windGust += 2;
  // Visual + sound at click position
  ripples.push(new Ripple(e.clientX, e.clientY, 0.8));
  playChime(e.clientX, 0.6);
});
</script>
</body>
</html>
