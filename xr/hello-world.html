<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Hello World - 绒球学习</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- 天空和环境 -->
      <a-sky color="#ECECEC"></a-sky>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7BC8A4" shadow></a-plane>
      
      <!-- 基础几何体 -->
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E" shadow></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D" shadow></a-cylinder>
      
      <!-- 文本 -->
      <a-text value="绒球 A-Frame 学习之旅 🧶" align="center" position="0 2.5 -4" color="#333" width="6"></a-text>
      
      <!-- 相机默认已有，也可以自定义 -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
      
      <!-- 光照 -->
      <a-light type="directional" intensity="0.5" position="-1 1 1"></a-light>
      <a-light type="ambient" intensity="0.3"></a-light>
    </a-scene>
  </body>
</html>
