<body>
<canvas id="scene"></canvas>
<canvas id="sealCanvas"></canvas>

<div id="titleBlock">
  <h1>墨园</h1>
  <div class="en">INK&nbsp;&nbsp;GARDEN</div>

<div id="stats">

<script>
(function() {
  'use strict';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const sealCv = document.getElementById('sealCanvas');
  const sealCtx = sealCv.getContext('2d');
  let W, H;
  const dom = {
    plantCount: document.getElementById('plant-count'),
    timeDisplay: document.getElementById('time-display'),
    toast: document.getElementById('toast'),
    btnClear: document.getElementById('btn-clear'),
    btnUndo: document.getElementById('btn-undo'),
    btnWind: document.getElementById('btn-wind'),
    btnSave: document.getElementById('btn-save'),
    windIndicator: document.getElementById('wind-indicator'),
    windArrow: document.getElementById('wind-arrow'),
    windBars: [1,2,3,4,5].map(i => document.getElementById('wb'+i)),
    hint: document.getElementById('hint'),
  };
  const INK = {
    jiao:'#1a1612',
    nong:'#2e2820',
    zhong:'#443a30',
    dan:'#6b5e4c',
    qing:'#9a8d76',
    rouge:'#9a3a35',
    paper:'#e8dfc8',
  };

  // ─── Brush Engine (v4.0) · stamp铺贴毛笔触感 ───
  function createBrushStamp(size, opts) {
    opts = opts || {};
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var cx2 = c.getContext('2d');
    var elongation = opts.elongation !== undefined ? opts.elongation : 2.2;
    var feather = opts.feather !== undefined ? opts.feather : 0.35;
    var dryness = opts.dryness !== undefined ? opts.dryness : 0.3;
    var img = cx2.createImageData(size, size);
    var hx = size / 2, hy = size / 2;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dx = (x - hx) / hx;
        var dy = (y - hy) / hy * elongation;
        var d = Math.sqrt(dx * dx + dy * dy);
        var idx = (y * size + x) * 4;
        if (d < 1) {
          var a = Math.pow(1 - d, 1.2) * 240;
          if (d > 0.2) {
            var seed = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            var r = seed - Math.floor(seed);
            if (r < dryness * (d - 0.2) * 1.5) a *= 0.15 + r * 0.3;
          }
          if (d > 1 - feather) a *= Math.pow((1 - d) / feather, 0.7);
          img.data[idx] = 26;
          img.data[idx + 1] = 22;
          img.data[idx + 2] = 18;
          img.data[idx + 3] = Math.min(255, Math.max(0, a));
        }
      }
    }
    cx2.putImageData(img, 0, 0);
    return c;
  }

  function brushPath(ctx, pts, stamp, pressureFn, opts) {
    opts = opts || {};
    var opacity = opts.opacity !== undefined ? opts.opacity : 0.55;
    var spacing = opts.spacing !== undefined ? opts.spacing : 0.18;
    if (!pts || pts.length < 2) return;
    // 累计弧长，用于按弧长参数 t (0..1) 均匀采样压力
    var segLens = [];
    var total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dl = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(dl);
      total += dl;
    }
    if (total < 0.5) return;
    var acc = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p = pts[i], n = pts[i + 1];
      var dist = segLens[i];
      if (dist < 0.001) continue;
      var t0 = acc / total;
      var t1 = (acc + dist) / total;
      var pr0 = pressureFn(t0);
      var w0 = pr0.width;
      var step = Math.max(1, w0 * spacing);
      var sub = Math.ceil(dist / step);
      var angle = Math.atan2(n.y - p.y, n.x - p.x) + Math.PI / 2;
      for (var s = 0; s < sub; s++) {
        var f = s / sub;
        var x = p.x + (n.x - p.x) * f;
        var y = p.y + (n.y - p.y) * f;
        var t = t0 + (t1 - t0) * f;
        var pr = pressureFn(t);
        var w = pr.width;
        var a = pr.opacity * opacity;
        if (w < 0.3) continue;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = a;
        var sz = Math.max(3, w * 1.5);
        ctx.drawImage(stamp, -sz / 2, -sz / 2, sz, sz);
        ctx.restore();
      }
      acc += dist;
    }
  }

  function sampleQuad(p0, c, p1, segments) {
    var pts = [];
    for (var i = 0; i <= segments; i++) {
      var t = i / segments;
      var mt = 1 - t;
      pts.push({
        x: mt * mt * p0.x + 2 * mt * t * c.x + t * t * p1.x,
        y: mt * mt * p0.y + 2 * mt * t * c.y + t * t * p1.y
      });
    }
    return pts;
  }

  function makeOrchidPressure(maxW) {
    return function(t) {
      var w, o;
      if (t < 0.08) { w = maxW * (0.3 + 0.7 * (t / 0.08)); o = 0.85; }
      else if (t < 0.60) { w = maxW * (1.0 - 0.05 * ((t - 0.08) / 0.52)); o = 0.85; }
      else if (t < 0.90) { var k = (t - 0.60) / 0.30; w = maxW * (0.95 - 0.80 * k); o = 0.85 - 0.20 * k; }
      else { w = maxW * 0.15 * (1 - (t - 0.90) / 0.10); o = 0.6; }
      return { width: Math.max(0.3, w), opacity: o };
    };
  }

  function makeBambooPressure(maxW) {
    return function(t) {
      var w, o;
      if (t < 0.15) { w = maxW * (t / 0.15); o = 0.9; }
      else if (t < 0.70) { w = maxW * (1 - 0.375 * ((t - 0.15) / 0.55)); o = 0.85; }
      else { w = maxW * (0.625 * (1 - (t - 0.70) / 0.30)); o = 0.7; }
      return { width: Math.max(0.3, w), opacity: o };
    };
  }

  // stamp 全局缓存（初始化时生成一次，风动画不重新生成）
  var stamp = createBrushStamp(64, { elongation: 1, feather: 0.45, dryness: 0.2 });
  var stampDry = createBrushStamp(64, { elongation: 1, feather: 0.55, dryness: 0.45 });
  var stampSmall = createBrushStamp(32, { elongation: 1, feather: 0.50, dryness: 0.25 });

  let paperCanvas, paperW = 0, paperH = 0;
  let resizeTimer = null, firstResize = true;
  function createPaperTexture() {
    paperCanvas = document.createElement('canvas');
    paperCanvas.width = Math.round(W * dpr);
    paperCanvas.height = Math.round(H * dpr);
    paperW = W; paperH = H;
    const pc = paperCanvas.getContext('2d');
    pc.setTransform(dpr, 0, 0, dpr, 0, 0);
    pc.fillStyle = INK.paper;
    pc.fillRect(0, 0, W, H);
    const imgData = pc.getImageData(0, 0, Math.round(W*dpr), Math.round(H*dpr));
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 14;
      d[i] = Math.max(0, Math.min(255, d[i] + n));
      d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
      d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
    }
    pc.putImageData(imgData, 0, 0);
    for (let i = 0; i < 16; i++) {
      const x = Math.random() * W, y = Math.random() * H;
      const r = 60 + Math.random() * 160;
      const grad = pc.createRadialGradient(x, y, 0, x, y, r);
      const tone = Math.random() > 0.5 ? '180,168,140' : '210,198,170';
      grad.addColorStop(0, 'rgba(' + tone + ',0.12)');
      grad.addColorStop(1, 'rgba(' + tone + ',0)');
      pc.fillStyle = grad;
      pc.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }
  let vignetteCanvas;
  function buildVignette() {
    vignetteCanvas = document.createElement('canvas');
    vignetteCanvas.width = Math.round(W * dpr);
    vignetteCanvas.height = Math.round(H * dpr);
    const vc = vignetteCanvas.getContext('2d');
    vc.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vg = vc.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.92);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(70,55,35,0.09)');
    vc.fillStyle = vg;
    vc.fillRect(0, 0, W, H);
  }
  function hexToRgb(hex) {
    return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
  }
  const species = [
    { name:'竹', maxDepth:5, branchAngle:0.28, angleVariance:0.12, lengthRatio:0.55,
      baseLen:105, baseWidth:6.5, widthRatio:0.55, branchChance:0.85, doubleBranchChance:0.2,
      curve:0.006, color:INK.nong, leafColor:INK.zhong, leafSize:1.0, leafDensity:0.9,
      segments:5, growSpeed:1.8, midBranchChance:0.3 },
    { name:'松', maxDepth:5, branchAngle:0.75, angleVariance:0.3, lengthRatio:0.68,
      baseLen:78, baseWidth:14, widthRatio:0.6, branchChance:0.95, doubleBranchChance:0.6,
      curve:0.035, color:INK.jiao, leafColor:INK.nong, leafSize:1.0, leafDensity:0.95,
      segments:5, growSpeed:1.3, midBranchChance:0.45 },
    { name:'柳', maxDepth:6, branchAngle:0.35, angleVariance:0.2, lengthRatio:0.82,
      baseLen:85, baseWidth:7, widthRatio:0.5, branchChance:0.88, doubleBranchChance:0.15,
      curve:-0.012, color:INK.zhong, leafColor:INK.dan, leafSize:0.5, leafDensity:0.85,
      segments:8, growSpeed:1.2, midBranchChance:0.3 },
    { name:'梅', maxDepth:5, branchAngle:0.8, angleVariance:0.45, lengthRatio:0.58,
      baseLen:65, baseWidth:10, widthRatio:0.55, branchChance:0.95, doubleBranchChance:0.6,
      curve:0.035, color:INK.jiao, blossomColor:INK.qing, rouge:INK.rouge,
      leafSize:0.85, leafDensity:0.55, segments:5, growSpeed:1.5, midBranchChance:0.35 },
    { name:'兰', maxDepth:4, branchAngle:0.25, angleVariance:0.4, lengthRatio:0.6,
      baseLen:140, baseWidth:5.0, widthRatio:0.4, branchChance:0.3, doubleBranchChance:0.05,
      curve:0.06, color:INK.zhong, leafColor:null, leafSize:1.0, leafDensity:0,
      segments:16, growSpeed:2.0 },
    { name:'枯', maxDepth:8, branchAngle:0.45, angleVariance:0.32, lengthRatio:0.72,
      baseLen:52, baseWidth:4.5, widthRatio:0.66, branchChance:0.88, doubleBranchChance:0.5,
      curve:0.03, color:INK.dan, leafColor:null, leafSize:0, leafDensity:0,
      segments:4, growSpeed:1.5 },
  ];
  species.forEach(function(sp) {
    sp.rgb = hexToRgb(sp.color);
    if (sp.blossomColor) sp.blossomRgb = hexToRgb(sp.blossomColor);
  });
  let plants = [];
  let plantHistory = [];
  let particles = [];
  let fallingLeaves = [];
  const MAX_PLANTS = 60;
  let groundY;
  let hasPlanted = false;
  const _layer = { scale:1.0, inkMix:0, detail:true, detailAlpha:1 };
  function getDepthLayer(y) {
    const ratio = Math.max(0, Math.min(1, (groundY - y) / 720));
    if (ratio <= 0.3) {
      _layer.scale = 1.0; _layer.inkMix = 0; _layer.detailAlpha = 1;
    } else if (ratio <= 0.6) {
      const t = (ratio - 0.3) / 0.3;
      _layer.scale = 1.0 - t * 0.08; _layer.inkMix = t * 0.08; _layer.detailAlpha = 1;
    } else if (ratio <= 0.85) {
      const t = (ratio - 0.6) / 0.25;
      _layer.scale = 0.92 - t * 0.06; _layer.inkMix = 0.08 + t * 0.1; _layer.detailAlpha = 1 - t * 0.25;
    } else {
      const t = (ratio - 0.85) / 0.15;

      const useStamp = tone === 'nong' ? stamp : stampDry;
      const baseOpacity = tone === 'nong' ? 0.7 : 0.5;
      for (let n = 0; n < strokes; n++) {
        const offIdx = n % offs.length;
        const bendSeed = this.rand(b.id + n * 17) - 0.5;
        const na = baseAng + offs[offIdx] * spread + (this.rand(b.id + n * 3) - 0.5) * 0.15;
        const lmin = b.leafLenMin || 14;
        const lmax = b.leafLenMax || 22;
        const len = (lmin + this.rand(b.id + n * 5) * (lmax - lmin)) * sm;
        const w = (1.4 + this.rand(b.id + n * 9) * 1.4) * (0.85 + sm*0.15);
        const effAng = na + sway * 0.3;
        const x0 = lx, y0 = ly;
        const x1 = lx + Math.cos(effAng) * len;
        const y1 = ly + Math.sin(effAng) * len;
        const mx = (x0 + x1) / 2 + Math.cos(effAng + Math.PI / 2) * len * bendSeed * 0.25;
        const my = (y0 + y1) / 2 + Math.sin(effAng + Math.PI / 2) * len * bendSeed * 0.25;
        const segs = Math.max(8, Math.round(len / 2));
        const pts = sampleQuad({ x: x0, y: y0 }, { x: mx, y: my }, { x: x1, y: y1 }, segs);
        const a = baseOpacity * (0.8 + this.rand(b.id + n * 11) * 0.2) * leafAlpha;
        brushPath(ctx, pts, useStamp, makeBambooPressure(w), { opacity: a, spacing: 0.18 });
      }
    }
    drawPineNeedles(ctx, b, lx, ly, sway, leafAlpha, scaleMul) {
      const sm = scaleMul || 1;
      const clusters = 1 + Math.floor(this.rand(b.id*3)*2);
      let nlen = 20;
      for (let c = 0; c < clusters; c++) {
        const cx = lx + (this.rand(b.id+c*7)-0.5)*5;
        const cy = ly + (this.rand(b.id+c*9)-0.5)*5;
        const count = 10 + Math.floor(this.rand(b.id+c*11)*5);
        nlen = (18 + this.rand(b.id+c*13)*8) * sm;
        const spread = 0.9 + this.rand(b.id+c*17)*0.3;
        const baseDir = b.angle + (c-0.5)*0.3;
        // 每束针随机60%浓(nong) 40%焦(jiao)
        const needleColor = this.rand(b.id+c*19) < 0.6 ? INK.nong : INK.jiao;
        ctx.strokeStyle = needleColor;
        ctx.lineCap = 'round';
        ctx.lineWidth = 0.5;
        for (let n = 0; n < count; n++) {
          const t = count === 1 ? 0.5 : n/(count-1);
          const na = baseDir - spread/2 + t*spread + (this.rand(b.id+c*20+n)-0.5)*0.08;
          const nl = nlen*(0.75+this.rand(b.id+c*30+n)*0.35);
          ctx.globalAlpha = (0.55+this.rand(b.id+c*40+n)*0.3)*leafAlpha;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx+Math.cos(na)*nl, cy+Math.sin(na)*nl);
          ctx.stroke();
        }
      }
      if (this.rand(b.id*23) > 0.4) {
        ctx.strokeStyle = INK.dan;
        ctx.lineWidth = 0.4;
        for (let n = 0; n < 4; n++) {
          const na = b.angle + (this.rand(b.id*25+n)-0.5)*1.4;
          ctx.globalAlpha = 0.3*leafAlpha;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx+Math.cos(na)*nlen*0.8, ly+Math.sin(na)*nlen*0.8);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawPlumBlossom(ctx, b, lx, ly, sway, leafAlpha) {
      const isRed = b.id === this.redBlossomId;
      const isBud = this.rand(b.id*17) < 0.25;
      const sz = 1.5 + this.rand(b.id*3)*1.0;
      const toneRoll = this.rand(b.id*21);
      let petalStyle;
      if (isRed) petalStyle = 'rouge';
      else if (toneRoll < 0.25) petalStyle = 'nong';
      else petalStyle = 'qing';
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(sway*0.2);
      if (isBud) {
        ctx.fillStyle = isRed ? INK.rouge : (petalStyle==='nong'?INK.nong:INK.dan);
        ctx.globalAlpha = (isRed?0.7:0.5)*leafAlpha;
        ctx.beginPath();
        ctx.arc(0, 0, sz*0.7, 0, Math.PI*2);
        ctx.fill();
      } else {
        const dist = sz*1.1;
        for (let p = 0; p < 5; p++) {
          const pa = (p/5)*Math.PI*2 - Math.PI/2;
          const px = Math.cos(pa)*dist, py = Math.sin(pa)*dist;
          if (petalStyle === 'rouge') {
            ctx.fillStyle = INK.rouge;
            ctx.globalAlpha = 0.65*leafAlpha;
            ctx.beginPath();
            ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
            ctx.fill();
          } else if (petalStyle === 'nong') {
            ctx.fillStyle = INK.nong;
            ctx.globalAlpha = 0.45*leafAlpha;
            ctx.beginPath();
            ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
            ctx.fill();
          } else {
            const roll = this.rand(b.id*20+p);
            if (roll < 0.6) {
              ctx.strokeStyle = INK.qing;
              ctx.globalAlpha = 0.4*leafAlpha;
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
              ctx.stroke();
            } else {
              ctx.fillStyle = INK.dan;
              ctx.globalAlpha = 0.3*leafAlpha;
              ctx.beginPath();
              ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }
        ctx.fillStyle = INK.jiao;
        ctx.globalAlpha = 0.7*leafAlpha;
        for (let s = 0; s < 5; s++) {
          const sa = (s/5)*Math.PI*2;
          ctx.beginPath();
          ctx.arc(Math.cos(sa)*sz*0.3, Math.sin(sa)*sz*0.3, 0.5, 0, Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    draw(ctx, wind, time, layer) {
      const sp = this.species;
      const visCount = Math.min(Math.floor(this.growth)+1, this.branches.length);
      const rgb = sp.rgb;
      const useShadow = layer.detail && sp.baseWidth >= 6 && sp.name !== '竹' && sp.name !== '兰';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 0; i < visCount; i++) {
        const b = this.branches[i];
        const partial = i === visCount-1 ? (this.growth - Math.floor(this.growth)) : 1;
        const pts = b.points;
        if (pts.length < 2) continue;
        const swayFactor = 1 - b.depth/sp.maxDepth;
        const effWind = wind.strength + wind.gust;
        const wave1 = Math.sin(time*0.001 + b.id*0.3 + this.seed*0.01);
        const wave2 = Math.sin(time*0.0027 + b.id*0.5 + this.seed*0.02)*0.5;
        const windAmp = sp.name === '柳' ? 7 : (sp.name === '兰' ? 5 : 4);
        const windX = (wave1+wave2)*effWind*windAmp*swayFactor*wind.direction;
        const windY = Math.cos(time*0.0013+b.id*0.2)*effWind*1.2*swayFactor;
        const droop = this.dying ? (1-this.fade)*6*(1-b.depth/sp.maxDepth) : 0;
        const depthFactor = b.depth / sp.maxDepth;
        const inkMix = Math.min(1, 0.25 + depthFactor*0.4 + layer.inkMix);
        const alpha = (0.65+(1-depthFactor)*0.35)*(1-layer.inkMix*0.3)*this.fade;
        const cr = Math.floor(rgb.r + (190-rgb.r)*inkMix);
        const cg = Math.floor(rgb.g + (180-rgb.g)*inkMix);
        const cb = Math.floor(rgb.b + (160-rgb.b)*inkMix);
        const strokeColor = 'rgba('+cr+','+cg+','+cb+','+alpha+')';
        if (useShadow && b.depth <= 2) {
          ctx.shadowColor = 'rgba(26,22,18,0.18)';
          ctx.shadowBlur = 4;
        } else {
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        }
        const dpts = [];
        const lim = Math.max(2, Math.ceil(pts.length*partial));
        for (let k = 0; k < lim; k++) {
          const wf = (1 - k/(pts.length-1))*swayFactor;
          dpts.push({
            x: pts[k].x + windX*wf,
            y: pts[k].y + (windY + droop)*wf
          });
        }
        if (sp.name === '竹' && b.kind === 'stalk') {
          this.drawBambooStalk(ctx, b, dpts, strokeColor, alpha, layer);
        } else if (sp.name === '松' && b.kind === 'branch') {
          this.drawPineBranch(ctx, b, dpts, strokeColor, alpha, layer, pts, partial);
        } else if (sp.name === '柳') {
          this.drawWillowBranch(ctx, b, dpts, strokeColor, alpha, layer, time, windX, windY, swayFactor, this.fade);
        } else if (sp.name === '兰' && b.kind === 'leaf') {
          this.drawOrchidLeaf(ctx, b, dpts, alpha);
        } else {
          this.drawGenericBranch(ctx, b, dpts, strokeColor, alpha, layer, sp, pts, partial);
        }
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        if (b.hasLeaf && partial >= 0.8 && layer.detailAlpha > 0.05
            && !(sp.name === '柳' && b.kind !== 'droop')) {
          const tip = dpts[dpts.length-1];
          const lx = tip.x, ly = tip.y;
          const sway = Math.sin(time*0.002+b.id+this.seed)*0.15;
          const leafAlpha = this.fade * layer.detailAlpha;
          if (sp.name === '松') {
            this.drawPineNeedles(ctx, b, lx, ly, sway, leafAlpha);
            if (b.depth <= 2 && dpts.length >= 5) {
              for (let mi = 2; mi < dpts.length-2; mi += 2) {
                if (this.rand(b.id*100+mi) > 0.45) continue;
                const mp = dpts[mi];
                this.drawPineNeedles(ctx, b, mp.x, mp.y, sway, leafAlpha*0.8, 0.65);
              }
            }
          } else if (sp.name === '竹') {
            // 竹叶沿侧枝错落生长，不只堆在梢头：梢头一组+枝中1-2组
            this.drawBambooLeaves(ctx, b, lx, ly, sway, leafAlpha, 1.0);
            if (b.depth <= 2 && dpts.length >= 5) {
              const midCount = b.depth===2 ? 1 : 2;
              for (let mi=0; mi<midCount; mi++){
                const t = 0.35 + mi*0.3;
                const idx = Math.max(1, Math.min(dpts.length-2, Math.round(t*(dpts.length-1))));
                const mp = dpts[idx];
                if (this.rand(b.id*100+idx) > 0.35) continue;
                this.drawBambooLeaves(ctx, b, mp.x, mp.y, sway, leafAlpha*0.8, 0.7);
              }
            }
          } else if (sp.name === '梅') {
            this.drawPlumBlossom(ctx, b, lx, ly, sway, leafAlpha);
            if (b.depth <= 3 && dpts.length >= 4) {
              let lastBx = lx, lastBy = ly;
              for (let mi = 1; mi < dpts.length-1; mi += 2) {
                if (this.rand(b.id*100+mi) > 0.35) continue;
                const mp = dpts[mi];
                const ddx = mp.x-lastBx, ddy = mp.y-lastBy;
                if (Math.sqrt(ddx*ddx+ddy*ddy) < 20) continue;
                this.drawPlumBlossom(ctx, b, mp.x, mp.y, sway, leafAlpha*0.85);
                lastBx = mp.x; lastBy = mp.y;
              }
            }
          }
        }
      }
      if (sp.name === '兰' && this.growth >= this.maxGrowth*0.8 && layer.detailAlpha > 0.1) {
        this.drawOrchidFlowers(ctx, time, this.fade*layer.detailAlpha);
      }
      ctx.globalAlpha = 1;
    }
    drawBambooStalk(ctx, b, dpts, strokeColor, alpha, layer) {
      ctx.strokeStyle = strokeColor;
      const pw = Math.max(0.6, b.width*0.5*layer.scale);
      ctx.lineWidth = pw;
      ctx.beginPath();
      ctx.moveTo(dpts[0].x, dpts[0].y);
      for (let k = 1; k < dpts.length; k++) ctx.lineTo(dpts[k].x, dpts[k].y);
      ctx.stroke();
      if (b.nodes && layer.detail) {
        ctx.strokeStyle = 'rgba(26,22,18,'+(0.5*alpha)+')';
        ctx.lineWidth = Math.max(1, pw*0.45);
        for (const ni of b.nodes) {
          if (ni >= dpts.length) continue;
          const p = dpts[ni];
          const prev = dpts[ni-1] || p, next = dpts[Math.min(ni+1,dpts.length-1)] || p;
          const dx = next.x-prev.x, dy = next.y-prev.y;
          const ln = Math.hypot(dx,dy)||1;
          const nx = -dy/ln, ny = dx/ln;
          const hw = pw*1.1;
          ctx.beginPath();
          ctx.moveTo(p.x-nx*hw, p.y-ny*hw);
          ctx.lineTo(p.x+nx*hw, p.y+ny*hw);
          ctx.stroke();
          ctx.lineWidth = Math.max(0.5, pw*0.2);
          ctx.globalAlpha = alpha*0.3;
          ctx.beginPath();
          ctx.moveTo(p.x-nx*hw*0.7-dx*0.04, p.y-ny*hw*0.7-dy*0.04);
          ctx.lineTo(p.x+nx*hw*0.7-dx*0.04, p.y+ny*hw*0.7-dy*0.04);
          ctx.stroke();
          ctx.globalAlpha = alpha;
          ctx.lineWidth = Math.max(1, pw*0.45);
        }
      }
      ctx.globalAlpha = 1;
    }
    drawPineBranch(ctx, b, dpts, strokeColor, alpha, layer, pts, partial) {
      const pw = Math.max(0.6, b.width*0.5*layer.scale);
      ctx.strokeStyle = strokeColor;
      ctx.lineCap = 'round';
      const total = dpts.length - 1;
      for (let k = 0; k < total; k++) {
        const t = k / total;
        const w = Math.max(0.4, pw * (1 - t*0.3));
        ctx.lineWidth = w;
        ctx.globalAlpha = alpha * (0.85 + (1-t)*0.15);
        ctx.beginPath();
        ctx.moveTo(dpts[k].x, dpts[k].y);
        ctx.lineTo(dpts[k+1].x, dpts[k+1].y);
        ctx.stroke();
        if (this.rand(b.id*7+k*13) < 0.15 && total > 2) {
          ctx.globalAlpha = alpha * (0.25 + this.rand(b.id*8+k*17)*0.35);
          ctx.lineWidth = w * 0.35;
          const mx = (dpts[k].x+dpts[k+1].x)/2;
          const my = (dpts[k].y+dpts[k+1].y)/2;
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(mx, my);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = alpha;
      if (b.width >= 4 && layer.detail && dpts.length >= 3) {
        ctx.strokeStyle = 'rgba(26,22,18,'+(0.35*alpha)+')';
        ctx.lineWidth = Math.max(0.6, pw*0.18);
        for (let k = 1; k < dpts.length-1; k++) {
          if (this.rand(b.id*50+k) > 0.4) continue;
          const p = dpts[k], prev = dpts[k-1], next = dpts[k+1];
          const dx = next.x-prev.x, dy = next.y-prev.y;
          const ln = Math.hypot(dx,dy)||1;
          const nx = -dy/ln, ny = dx/ln;
          const sz = pw*(0.5+this.rand(b.id*60+k)*0.5);
          ctx.beginPath();
          ctx.moveTo(p.x-nx*sz, p.y-ny*sz);
          ctx.quadraticCurveTo(p.x, p.y, p.x+nx*sz, p.y+ny*sz);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(26,22,18,'+(0.3*alpha)+')';
        for (let k = 0; k < dpts.length; k += 2) {
          if (this.rand(b.id*70+k) > 0.2) continue;
          const p = dpts[k];
          ctx.beginPath();
          ctx.arc(p.x+(this.rand(b.id*80+k)-0.5)*pw, p.y+(this.rand(b.id*90+k)-0.5)*pw,
                  0.6+this.rand(b.id*95+k)*1.2, 0, Math.PI*2);
          ctx.fill();
        }
      }
      if (b.depth <= 1 && partial >= 0.7 && dpts.length >= 3) {
        const startIdx = Math.max(1, Math.floor(dpts.length*0.7));
        if (startIdx < dpts.length-1) {
          ctx.save();
          ctx.shadowColor='transparent'; ctx.shadowBlur=0;
          ctx.globalAlpha = alpha*0.4;
          ctx.setLineDash([2+this.rand(b.id*7+41)*3, 2+this.rand(b.id*7+42)*4]);
          ctx.lineDashOffset = this.rand(b.id*7+43)*20;
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = pw*0.7;
          ctx.beginPath();
          ctx.moveTo(dpts[startIdx].x, dpts[startIdx].y);
          for (let j = startIdx+1; j < dpts.length; j++) ctx.lineTo(dpts[j].x, dpts[j].y);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawWillowBranch(ctx, b, dpts, strokeColor, alpha, layer, time, windX, windY, swayFactor, fade) {
      const pw = Math.max(0.5, b.width*0.5*layer.scale);
      if (b.kind === 'droop') {
        ctx.strokeStyle = strokeColor;
        ctx.lineCap = 'round';
        const total = dpts.length - 1;
        for (let k = 0; k < total; k++) {
          const t = k / total;
          const w = Math.max(0.3, pw * (1 - t*0.35));
          ctx.lineWidth = w;
          ctx.globalAlpha = alpha * (0.7 + (1-t)*0.3);
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(dpts[k+1].x, dpts[k+1].y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        if (layer.detail && dpts.length >= 4) {
          ctx.fillStyle = 'rgba(107,94,76,'+(0.5*fade)+')';
          for (let k = 2; k < dpts.length-1; k += 2) {
            if (this.rand(b.id*30+k) > 0.6) continue;
            const p = dpts[k];
            const lsz = 1.5 + this.rand(b.id*40+k)*1.0;
            const ox = (this.rand(b.id*50+k)-0.5)*3;
            const oy = (this.rand(b.id*60+k)-0.5)*2;
            ctx.globalAlpha = (0.35+this.rand(b.id*70+k)*0.3)*fade;
            ctx.beginPath();
            ctx.ellipse(p.x+ox, p.y+oy, lsz*0.6, lsz, 0, 0, Math.PI*2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = pw;
        ctx.beginPath();
        ctx.moveTo(dpts[0].x, dpts[0].y);
        if (dpts.length > 2) {
          for (let k = 1; k < dpts.length-1; k++) {
            const xc = (dpts[k].x+dpts[k+1].x)/2, yc = (dpts[k].y+dpts[k+1].y)/2;
            ctx.quadraticCurveTo(dpts[k].x, dpts[k].y, xc, yc);
          }
          ctx.lineTo(dpts[dpts.length-1].x, dpts[dpts.length-1].y);
        } else {
          ctx.lineTo(dpts[1].x, dpts[1].y);
        }
        ctx.stroke();
        if (b.width >= 3 && layer.detail) {
          ctx.strokeStyle = 'rgba(26,22,18,'+(0.25*alpha)+')';
          ctx.lineWidth = Math.max(0.4, pw*0.15);
          for (let k = 1; k < dpts.length-1; k++) {
            if (this.rand(b.id*80+k) > 0.5) continue;
            const p = dpts[k], prev = dpts[k-1], next = dpts[k+1];
            const dx = next.x-prev.x, dy = next.y-prev.y;
            const ln = Math.hypot(dx,dy)||1;
            const nx = -dy/ln, ny = dx/ln;
            const sz = pw*(0.4+this.rand(b.id*85+k)*0.4);
            ctx.beginPath();
            ctx.moveTo(p.x-nx*sz, p.y-ny*sz);
            ctx.quadraticCurveTo(p.x, p.y, p.x+nx*sz, p.y+ny*sz);
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }
    drawOrchidLeaf(ctx, b, dpts, alpha) {
      if (dpts.length < 2) return;
      // 老叶焦浓(nong)用浓stamp，中叶重墨(zhong)，嫩叶淡墨(dan)用干笔stamp带飞白
      const tone = b.leafTone || 'nong';
      let leafColor, useStamp, baseOpacity;
      if (tone === 'dan') {
        leafColor = INK.zhong; useStamp = stampDry; baseOpacity = 0.7;
      } else if (tone === 'nong') {
        leafColor = INK.jiao; useStamp = stamp; baseOpacity = 0.9;
      } else {
        leafColor = INK.nong; useStamp = stamp; baseOpacity = 0.8;
      }
      const maxW = b.width;
      // 沿叶弧铺贴stamp：钉头鼠尾压力曲线
      brushPath(ctx, dpts, useStamp, makeOrchidPressure(maxW), {
        opacity: baseOpacity * alpha, spacing: 0.18
      });
      // 叶根钉头点（焦墨，ellipse 5×3px 量级，按叶宽缩放）
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = leafColor;
      ctx.beginPath();
      ctx.ellipse(dpts[0].x, dpts[0].y,
        Math.max(2, maxW * 0.55), Math.max(1.5, maxW * 0.35), 0, 0, Math.PI * 2);
      ctx.fill();
      // 叶尖回锋点：1px 浓墨点
      const tip = dpts[dpts.length - 1];
      ctx.globalAlpha = alpha * 0.7;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawOrchidFlowers(ctx, time, alpha) {
      const leaves = this.branches.filter(function(b){ return b.kind === 'leaf'; });
      if (leaves.length < 2) return;
      leaves.sort(function(a,b){ return b.length - a.length; });
      const flowerCount = 2 + (this.rand(55) > 0.5 ? 1 : 0);
      for (let fi = 0; fi < flowerCount; fi++) {
        const leaf = leaves[fi % leaves.length];
        if (!leaf || leaf.points.length < 5) continue;
        const idx = Math.floor(leaf.points.length * (0.35 + this.rand(56+fi)*0.3));
        const p = leaf.points[idx];
        const sway = Math.sin(time*0.002+idx+fi)*0.08;
        const fsz = 2.5 + this.rand(57+fi)*1.0;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(sway);
        for (let pet = 0; pet < 5; pet++) {
          const pa = (pet/5)*Math.PI*2;
          ctx.fillStyle = fi === 0 ? INK.qing : INK.dan;

        const x = W * rx;
        const y = H * s.yRatio + (Math.random()-0.5)*30;
        plants.push(new Plant(x, y, s.si));
        createInkSplatter(x, y, species[s.si].color);
      }, i*400);
    });
  }, 500);
  rafId = requestAnimationFrame(loop);
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
