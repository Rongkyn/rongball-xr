<body>

<script>
(function() {
  'use strict';
  // 出画模式：?gallery=1 隐藏所有UI
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('gallery') === '1') {
    document.body.classList.add('gallery-mode');
  }
  // v12.0 P4-fix6: 骨架预检模式 ?skeleton=1——不做水墨渲染，画彩色几何线框+指标overlay
  const skeletonMode = urlParams.has('skeleton');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const sealCv = document.getElementById('sealCanvas');
  const sealCtx = sealCv.getContext('2d');
  let W, H;
  const dom = {
    plantCount: document.getElementById('plant-count'),
    timeDisplay: document.getElementById('time-display'),
    toast: document.getElementById('toast'),
    btnClear: document.getElementById('btn-clear'),
    btnUndo: document.getElementById('btn-undo'),
    btnWind: document.getElementById('btn-wind'),
    btnSave: document.getElementById('btn-save'),
    windIndicator: document.getElementById('wind-indicator'),
    windArrow: document.getElementById('wind-arrow'),
    windBars: [1,2,3,4,5].map(i => document.getElementById('wb'+i)),
    hint: document.getElementById('hint'),
  };
  const INK = {
    jiao:'#1a1612',
    nong:'#2e2820',
    zhong:'#443a30',
    dan:'#6b5e4c',
    qing:'#9a8d76',
    rouge:'#9a3a35',
    paper:'#e8dfc8',
  };

  // ─── Brush Engine (v4.0) · stamp铺贴毛笔触感 ───
  function createBrushStamp(size, opts) {
    opts = opts || {};
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var cx2 = c.getContext('2d');
    var elongation = opts.elongation !== undefined ? opts.elongation : 2.2;
    var feather = opts.feather !== undefined ? opts.feather : 0.35;
    var dryness = opts.dryness !== undefined ? opts.dryness : 0.3;
    var img = cx2.createImageData(size, size);
    var hx = size / 2, hy = size / 2;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dx = (x - hx) / hx;
        var dy = (y - hy) / hy * elongation;
        var d = Math.sqrt(dx * dx + dy * dy);
        var idx = (y * size + x) * 4;
        if (d < 1) {
          var col = opts.rgb || [26,22,18];
          var a = Math.pow(1 - d, 1.2) * 240;
          if (d > 0.2) {
            var seed = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            var r = seed - Math.floor(seed);
            if (r < dryness * (d - 0.2) * 1.5) a *= 0.15 + r * 0.3;
          }
          if (d > 1 - feather) a *= Math.pow((1 - d) / feather, 0.7);
          img.data[idx] = col[0];
          img.data[idx + 1] = col[1];
          img.data[idx + 2] = col[2];
          img.data[idx + 3] = Math.min(255, Math.max(0, a));
        }
      }
    }
    cx2.putImageData(img, 0, 0);
    return c;
  }

  function brushPath(ctx, pts, stamp, pressureFn, opts) {
    opts = opts || {};
    var opacity = opts.opacity !== undefined ? opts.opacity : 0.55;
    var spacing = opts.spacing !== undefined ? opts.spacing : 0.18;
    var jitter = opts.jitter || 0;
    var szMul = opts.szMul || 1.5;
    // v11.2-fix: 竿身铺贴随机序列，避免等距stamp形成可辨节律/实心柱
    var jr = (function(s){ s = (s*16807) % 2147483647; return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; }; })(opts.seed || 7);
    if (!pts || pts.length < 2) return;
    // 累计弧长，用于按弧长参数 t (0..1) 均匀采样压力
    var segLens = [];
    var total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dl = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(dl);
      total += dl;
    }
    if (total < 0.5) return;
    var acc = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p = pts[i], n = pts[i + 1];
      var dist = segLens[i];
      if (dist < 0.001) continue;
      var t0 = acc / total;
      var t1 = (acc + dist) / total;
      var pr0 = pressureFn(t0);
      var w0 = pr0.width;
      var step = Math.max(1, w0 * spacing);
      var sub = Math.ceil(dist / step);
      var angle = Math.atan2(n.y - p.y, n.x - p.x) + Math.PI / 2;
      var px = -Math.sin(angle), py = Math.cos(angle);
      for (var s = 0; s < sub; s++) {
        var f = (s + 0.25 + jr()*0.5) / sub;
        var x = p.x + (n.x - p.x) * f;
        var y = p.y + (n.y - p.y) * f;
        var t = t0 + (t1 - t0) * f;
        var pr = pressureFn(t);
        var w = pr.width;
        var a = pr.opacity * opacity * (0.78 + jr()*0.34);
        if (jitter > 0) {
          x += px * (jr()-0.5) * w * jitter;
          y += py * (jr()-0.5) * w * jitter;
        }
        if (w < 0.3) continue;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + (jr()-0.5) * 0.12 * jitter);
        ctx.globalAlpha = a;
        var sz = Math.max(3, w * szMul * (0.86 + jr()*0.30));
        ctx.drawImage(stamp, -sz / 2, -sz / 2, sz, sz);
        ctx.restore();
      }
      acc += dist;
    }
  }

  // ─── Brush Path with Feibai (v4.3) · 离屏刮白飞白 ───
  // 在offscreen canvas绘制笔触后，用destination-out刮出丝状留白
  function brushPathFeibai(mainCtx, pts, stampWet, stampDry, pressureFn, opts) {
    opts = opts || {};
    var opacity = opts.opacity !== undefined ? opts.opacity : 0.85;
    var feibai = opts.feibai || 0.6;
    var numStreaks = opts.streaks || 8;
    var dryStart = opts.dryStart || 0.42;
    var tremor = opts.tremor || 0;
    var seed = opts.seed || 42;
    if (!pts || pts.length < 2) return;
    var rng = (function(s) {
      return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    })(seed % 2147483647 || 1);

    // Bounding box
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < pts.length; i++) {
      minX = Math.min(minX, pts[i].x); maxX = Math.max(maxX, pts[i].x);
      minY = Math.min(minY, pts[i].y); maxY = Math.max(maxY, pts[i].y);
    }
    var pad = 15;
    var bw = maxX - minX + pad * 2, bh = maxY - minY + pad * 2;
    var bx = minX - pad, by = minY - pad;

    var offCanvas = document.createElement('canvas');
    offCanvas.width = Math.ceil(bw * dpr);
    offCanvas.height = Math.ceil(bh * dpr);
    var off = offCanvas.getContext('2d');
    off.setTransform(dpr, 0, 0, dpr, 0, 0);

    var segLens = [], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dl = Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
      segLens.push(dl); total += dl;
    }
    if (total < 0.5) return;

    // Pass 1: draw stroke
    var acc = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p = pts[i], n = pts[i+1], dist = segLens[i];
      if (dist < 0.001) continue;
      var t0 = acc / total, t1 = (acc + dist) / total;
      var angle = Math.atan2(n.y - p.y, n.x - p.x) + Math.PI / 2;
      var pr0 = pressureFn(t0);
      var step = Math.max(1, pr0.width * 0.16);
      var sub = Math.ceil(dist / step);
      for (var s = 0; s < sub; s++) {

          if (composeLayout && composeLayout[s] && isMain) skipRate = 0.0;
          // 矮竿中部保底：如果该区间分枝数不足4，强制不跳
          if (isShort && nodeT >= 0.40 && nodeT <= 0.65 && midBranchCount >= 4) skipRate = 0.20;
          if (isMain && ni >= nodes.length - 3) { /* 主竹顶部3节保底出叶，形成华盖 */ }
          else if (rand(s*70+ni*13) < skipRate) continue;
          if (isShort && nodeT >= 0.40 && nodeT <= 0.65) midBranchCount++;

          const np = pts[nodes[ni]];
          // v12.0 P2-fix: 左右交替，连续同侧概率从20%降到10%
          let side;
          if (lastSide === 0) {
            side = branchSide;
          } else if (rand(s*72+ni) < 0.10) {
            side = lastSide; // 连续同侧
          } else {
            side = -lastSide;
          }
          lastSide = side;

          const isTip = ni >= nodes.length - 2;

          // 三段枝长梯度
          // v12.0 P2-fix: 中部长枝(t<0.55)下限从120提到140，确保中段主枝横向展开
          // v12.0 P2-fix2: 矮竿中部(t<0.65)枝长60-110px（按要求），中部长枝(t<0.55)保底90px
          let bLen;
          if (isShort) {
            if (nodeT < 0.55) bLen = 80 + rand(s*80+ni) * 30;  // 80-110
            else if (nodeT < 0.75) bLen = 60 + rand(s*83+ni) * 40;  // 60-100
            else bLen = 30 + rand(s*86+ni) * 30;  // 30-60
          } else {
            if (nodeT < 0.55) bLen = 140 + rand(s*80+ni) * 40; // 140-180
            else if (nodeT < 0.75) bLen = 80 + rand(s*83+ni) * 50;  // 80-130
            else bLen = 30 + rand(s*86+ni) * 30;  // 30-60
          }
          // compose 模式按现有 Lmul 体系缩放，辅/远竿缩短
          bLen *= (isCompose ? Lmul * (isMain ? 0.75 : 0.55) : Lmul) * (isMain ? 1.0 : 0.85);
          // v12.0 P2-fix: 矮竿（far级/hMulOpt<0.70）中部长枝绝对值下限100px，防止右竿缩成60px小簇
          // v12.0 P2-fix2: 矮竿中部长枝(t<0.55)最短不低于90px（scale缩放后）
          if (isShort && nodeT < 0.55 && bLen < 90) bLen = 90 + rand(s*82+ni)*15;
          else if (!isMain && !isShort && nodeT < 0.55 && bLen < 100) bLen = 100 + rand(s*82+ni)*20;

          // 三段弧度：前1/3保持向上(35-55°)、中1/3弧向外展开(60-80°)、末1/3微下垂(80-100°)
          // 角度以相对竿 baseAngle 的侧偏表示（side*弧度）
          const aInit = side * (0.61 + rand(s*81+ni)*0.35);  // ~35-55°
          const aMid  = side * (1.05 + rand(s*84+ni)*0.35);  // ~60-80°
          const aEnd  = side * (1.40 + rand(s*87+ni)*0.35);  // ~80-100°

          const NSEG = 7; // 6-8 段，取 7
          const sl = bLen / NSEG;
          const twigPts = [{x:np.x, y:np.y}];
          let tcx = np.x, tcy = np.y, tang = baseAngle + aInit;
          for (let si2 = 0; si2 < NSEG; si2++) {
            const tseg = si2 / NSEG;       // 段起点 t
            const tnext = (si2+1) / NSEG;  // 段终点 t
            // 在三段弧度之间平滑插值
            let targetA;
            if (tnext <= 1/3) {
              const k = tnext / (1/3);
              targetA = aInit + (aMid - aInit) * k * 0.30; // 前1/3基本保持向上
            } else if (tnext <= 2/3) {
              const k = (tnext - 1/3) / (1/3);
              targetA = aInit + (aMid - aInit) * 0.30 + (aMid - (aInit + (aMid-aInit)*0.30)) * k;
            } else {
              const k = (tnext - 2/3) / (1/3);
              targetA = aMid + (aEnd - aMid) * k;
            }
            // 段内角度从当前 tang 平滑过渡到 targetA
            tang = baseAngle + targetA;
            tcx += Math.cos(tang) * sl;
            tcy += Math.sin(tang) * sl;
            twigPts.push({x:tcx, y:tcy});
          }
          const endAng = tang;
          const endPt = twigPts[twigPts.length-1];

          // 枝粗 / 老新分级（焦浓 vs 清淡）
          // 老枝 t<0.60 焦浓(depth<=2, 粗)，新枝清淡(depth=4, 细)；中段 depth=3
          let twigDepth, twigW;
          if (nodeT < 0.60) {
            twigDepth = 2;
            twigW = isMain ? 7.0 : 5.5;
          } else if (nodeT < 0.80) {
            twigDepth = 3;
            twigW = isMain ? 4.5 : 3.5;
          } else {
            twigDepth = 4;
            twigW = isMain ? 2.6 : 2.0;
          }
          this.branches.push({
            id:this.branches.length, kind:'twig', points:twigPts, angle:baseAngle+aInit,
            length:bLen, width:twigW, depth:twigDepth, children:[], hasLeaf:false,
            isBambooBranch: true,
            _composeRole: curRole,
          });

          // 雀爪：中部长枝(t<0.60)末端 78% 概率，1-2组细枝（v12.0 P3-fix4：概率60%→78%，subN 双根50%→65%）
          if (nodeT < 0.60 && rand(s*92+ni*7) < 0.78) {
            const subT = 0.60 + rand(s*94+ni)*0.20; // 0.60-0.80
            const subIdx = Math.max(1, Math.min(twigPts.length-2, Math.round(subT * (twigPts.length-1))));
            const subBase = twigPts[subIdx];
            const p0 = twigPts[Math.max(0,subIdx-1)];
            const p1 = twigPts[Math.min(twigPts.length-1,subIdx+1)];
            const subBaseAng = Math.atan2(p1.y-p0.y, p1.x-p0.x);
            const subN = (rand(s*93+ni*11) < 0.65) ? 2 : 1; // v12.0 P3-fix4: 双根雀爪 50%→65%
            for (let subi = 0; subi < subN; subi++) {
              const subSide = (subi === 0 ? 1 : -1) * (rand(s*95+ni+subi)<0.5?1:-1);
              const subAng = subBaseAng + subSide * (0.35 + rand(s*96+ni+subi)*0.25);
              const subLen = 15 + rand(s*97+ni+subi)*15; // 15-30px
              const subDroop = 0.04 + rand(s*98+ni+subi)*0.06;
              const subPts = [{x:subBase.x, y:subBase.y}];
              let scx = subBase.x, scy = subBase.y, sang = subAng;
              const SUBSEG = 5;
              for (let sj = 0; sj < SUBSEG; sj++) {
                sang += subDroop * 0.6;
                scx += Math.cos(sang) * subLen/SUBSEG;
                scy += Math.sin(sang) * subLen/SUBSEG;
                subPts.push({x:scx, y:scy});
              }
              this.branches.push({
                id:this.branches.length, kind:'twig', points:subPts, angle:subAng,
                length:subLen, width:twigW*0.55, depth:3, children:[], hasLeaf:false,
                isBambooBranch: true,
                _composeRole: curRole,
              });
              // 雀爪端叶簇（每根雀爪末端一个叶簇）
              const subEnd = subPts[subPts.length-1];
              this._addBambooLeafCluster(this.branches, s, ni, subEnd.x, subEnd.y, sang,
                false, isMain, Lmul, nodeT, rand, 'sub', subLen, isCompose);
            }
          }

          // 主枝端叶簇（每根主枝一个）——P2 只保留这一处 + 雀爪端
          this._addBambooLeafCluster(this.branches, s, ni, endPt.x, endPt.y, endAng,
            isTip, isMain, Lmul, nodeT, rand, 'main', bLen, isCompose, curRole);
        }
        // v12.0 P2: 删除底部贴根双枝叶簇、贴竿短枝叶簇、75%中叶、30%中叶、梢头独立小叶
        // 叶子只在主枝端和雀爪端——下部光竿彻底无叶

        // v12.0 P3: 梢头小叶——雀爪1-2簇，字法(ren/ge)，2-3叶，远/小叶32-48
        const tipP = pts[pts.length-1];
        for (let ti = 0; ti < 2; ti++) {
          const tangAng = baseAngle + (ti-0.5)*0.35 + (rand(s*200+ti)-0.5)*0.15;
          const tipGroup = rand(s*201+ti) < 0.5 ? 'ren' : 'ge';
          this.branches.push({
            id:this.branches.length, kind:'twig', points:[tipP,{x:tipP.x,y:tipP.y}],
            angle:tangAng, length:1, width:1.0, depth:4, children:[], hasLeaf:true,
            leafAngle:tangAng, leafGroup: tipGroup,
            leafTone: isMain ? 'nong' : 'zhong',
            leafLenMin: 36, leafLenMax: 52,
            leafCount: tipGroup === 'ren' ? [2,2] : [3,3],
            forkSpread:0.85, isTop:true, clusterType:'sub',
            _zorder: 2, _composeRole: curRole,
          });
        }
      }
    }

    _addBambooLeafCluster(branches, seed, nodeIdx, x, y, angle, isTip, isMain, Lmul, upFactor, rand, clusterType, bLen, isCompose_global, composeRole) {
      // v12.0 P3: 宋画字法叶簇——人30%/个50%/介20%；每小枝末端仅1个字（2-5叶）
      const s = seed;
      const ni = nodeIdx;
      const bl = bLen || 60;
      // 字法随机分布：人(ren,2-3叶)25% / 个(ge,3-4叶)50% / 介(jie,4-6叶)25%
      // v12.0 P3-fix4: 加密叶量——人字30%概率3叶，个字40%概率4叶，介字主枝长枝6叶/雀爪5叶
      const r = rand(s*100+ni*7+(clusterType==='sub'?99:0));
      let groupType, lcMin, lcMax;
      if (r < 0.25) { groupType='ren'; lcMin=2; lcMax=3; }
      else if (r < 0.75) { groupType='ge'; lcMin=3; lcMax=4; }
      else {
        groupType='jie';
        lcMin=4;
        lcMax = (clusterType==='main' && bl > 100) ? 6 : 5;
      }
      // 尺寸系数：主枝大、雀爪小；长枝额外放大；v12.0 P3-fix4: 上密下疏——竹冠顶部放大12%、下部缩小15%
      let _densityMul = 1.0;
      if (upFactor >= 0.7) _densityMul = 1.12;
      else if (upFactor < 0.4) _densityMul = 0.85;
      const sizeMul = (clusterType === 'main' ? 1.0 : 0.85) * Math.min(1.10, 0.88 + bl/180) * _densityMul;
      const forkSpread = 0.80 + rand(s*120+ni*5)*0.12;
      // 墨色——按竿高 upFactor（nodeT）分级，与竿相呼应
      let leafTone;
      if (upFactor < 0.30) leafTone = rand(s*110+ni) < 0.30 ? 'nong' : (rand(s*110+ni+1) < 0.70 ? 'zhong' : 'dan');
      else if (upFactor < 0.60) leafTone = rand(s*111+ni) < 0.25 ? 'nong' : (rand(s*111+ni+1) < 0.75 ? 'zhong' : 'dan');
      else leafTone = rand(s*112+ni) < 0.20 ? 'nong' : (rand(s*112+ni+1) < 0.75 ? 'zhong' : 'dan');
      const lScale = (isMain ? 1.0 : 0.92) * sizeMul;
      // v12.0 P3: 叶长 40-70px（compose）；主枝48-70、雀爪40-58
      const baseLen = clusterType === 'main' ? 48 : 40;
      const maxLen  = clusterType === 'main' ? 70 : 58;
      branches.push({
        id:branches.length, kind:'twig', points:[{x,y},{x,y}],
        angle:angle, length:1, width:1.0, depth:4, children:[], hasLeaf:true,
        leafAngle:angle, leafGroup:groupType,
        leafTone:leafTone,
        leafLenMin: Math.round(baseLen*lScale),
        leafLenMax: Math.round(maxLen*lScale),
        leafCount:[lcMin,lcMax],
        forkSpread:forkSpread,
        isTop:isTip,
        clusterType: clusterType || 'sub',
        _zorder: leafTone === 'dan' ? 0 : (leafTone === 'zhong' ? 1 : 2),
      });
    }

    calcTwig(x, y, angle, len, segs, seedOff) {
      const pts = [{x,y}];
      let cx=x, cy=y, ca=angle;
      const sp = this.species;
      for (let i = 0; i < segs; i++) {
        ca += sp.curve*(0.5+this.rand(seedOff+i)*0.5);
        const sl = len/segs;
        cx += Math.cos(ca)*sl; cy += Math.sin(ca)*sl;
        pts.push({x:cx,y:cy});
      }
      return pts;
    }
    buildWillow() {
      const trunkH = 20 + this.rand(1)*10;
      const trunkW = 8 + this.rand(2)*2;
      const trunkPts = [{x:this.x, y:this.y}];
      let cx=this.x, cy=this.y, ca=-Math.PI/2 + (this.rand(3)-0.5)*0.1;
      for (let i=0;i<3;i++){
        cx += Math.cos(ca)*trunkH/3;
        cy += Math.sin(ca)*trunkH/3;
        ca += (this.rand(4+i)-0.5)*0.03;
        trunkPts.push({x:cx,y:cy});
      }
      this.branches.push({
        id:this.branches.length, kind:'stalk', points:trunkPts,
        angle:ca, length:trunkH, width:trunkW, depth:0,
        children:[], hasLeaf:false,
      });
      const cascadeCount = 3 + (this.rand(5)>0.5?1:0);
      for (let f=0; f<cascadeCount; f++){
        const side = f - (cascadeCount-1)/2;
        const startAngle = -Math.PI/2 + side*0.5 + (this.rand(f*7)-0.5)*0.2;
        const archUp = 30 + this.rand(f*9)*20;
        const archDown = 45 + this.rand(f*11)*40;
        const cw = 3 + this.rand(f*13)*2;
        const cpts = [{x:cx,y:cy}];
        let bx=cx, by=cy, ba=startAngle;
        for (let i=0;i<5;i++){
          const t=i/5;
          ba = startAngle + t*0.35*side + (this.rand(f*20+i)-0.5)*0.04;
          bx += Math.cos(ba)*archUp/5;
          by += Math.sin(ba)*archUp/5;
          cpts.push({x:bx,y:by});
        }
        for (let i=0;i<7;i++){
          const targetA = Math.PI/2 + side*0.15;
          ba = ba + (targetA-ba)*0.22 + (this.rand(f*30+i)-0.5)*0.04;
          bx += Math.cos(ba)*archDown/7;
          by += Math.sin(ba)*archDown/7;
          cpts.push({x:bx,y:by});
        }
        this.branches.push({
          id:this.branches.length, kind:'cascade', points:cpts, angle:ba,
          length:archUp+archDown, width:cw, depth:1, children:[], hasLeaf:false,
        });
        for (let k=1;k<cpts.length;k++){
          const node = cpts[k];
          const isNearCrown = k < 4;
          const droopLen = isNearCrown ? (60+this.rand(f*50+k)*30) : (90+this.rand(f*60+k)*50);
          const dpts = [{x:node.x, y:node.y}];
          let dx=node.x, dy=node.y;
          let da = Math.PI/2 + (this.rand(f*70+k)-0.5)*0.18;
          for (let i=0;i<8;i++){
            da += (this.rand(f*80+k+i)-0.5)*0.035;
            dx += Math.cos(da)*droopLen/8;
            dy += Math.sin(da)*droopLen/8;
            dpts.push({x:dx,y:dy});
          }
          this.branches.push({
            id:this.branches.length, kind:'droop', points:dpts,
            angle:da, length:droopLen, width:0.8+this.rand(f*90+k)*0.7,
            depth:3, children:[], hasLeaf:true, leafAngle:da,
          });
        }
      }
    }
    buildOrchid() {
      // v6 宋画兰叶法：一笔定方向、二笔交凤眼、三笔破凤眼，添嫩叶抱根。
      // 悬臂梁模型v2 + 出射点宽幅错开(叶基分居根两侧以成交叉) + 7-9叶 + 种子驱动。
      const sp = this.species;
      const rand = (s)=>this.rand(s);
      const UP = -Math.PI/2;
      const lean = (rand(101)<0.5?-1:1) * (0.35+rand(102)*0.5);
      const n = 7 + Math.floor(rand(103)*3); // 7-9叶
      const tones = ['nong','nong','zhong','zhong','zhong','dan','dan','dan','dan'];
      const isCompose = typeof urlParams !== 'undefined' && urlParams.get('compose') === '1';
      // 叶基宽幅错开：叶基分居根两侧较远处，使叶在画面中段交叉成凤眼
      const baseSpread = isCompose ? 28 : 14;
      const baseOffset = (i)=>{
        if(i===0) return { x: this.x - (baseSpread+rand(200)*6), y: this.y - (2+rand(201)*4) };
        if(i===1) return { x: this.x + (baseSpread+rand(202)*6), y: this.y - (4+rand(203)*4) };
        if(i===2) return { x: this.x + (lean>0?-(baseSpread*0.6):baseSpread*0.6)+rand(204)*4, y: this.y - (6+rand(205)*5) };
        if(i===3) return { x: this.x + (lean>0?baseSpread*0.5:-baseSpread*0.5)+rand(206)*5, y: this.y - (10+rand(207)*5) };
        if(i===4) return { x: this.x + (lean>0?-baseSpread*0.4:baseSpread*0.4)+rand(208)*4, y: this.y - (12+rand(209)*5) };
        const side = i%2===0 ? -1 : 1;
        return { x: this.x + side*(4+rand(210+i)*6), y: this.y - (14+rand(211+i)*6+i*2) };
      };
      const cubicLeaf = (bx,by,ang,len,sag,flip)=>{
        // 悬臂梁模型v2：叶基角度ang决定初始方向，重力使角度向DOWN偏转（t²加速）
        // 不区分side——重力永远向下，叶子从初始方向逐渐弯向地面
        const N=40; const pts=[];
        let x=bx, y=by;
        const DOWN = Math.PI/2;
        // 从ang到DOWN的角差，取最短方向
        let droop = DOWN - ang;
        while(droop > Math.PI) droop -= Math.PI*2;
        while(droop < -Math.PI) droop += Math.PI*2;
        const bend = sag * 0.8;
        const twist = flip * 0.04;
        for(let i=0;i<=N;i++){
          const t=i/N;
          pts.push({x,y});
          if(i<N){
            const dt=1/N;
            // 角度从ang向DOWN偏转，t²加速
            const a = ang + droop * bend * t*t + Math.sin(t*Math.PI)*twist;
            x += Math.cos(a)*len*dt;
            y += Math.sin(a)*len*dt;
          }
        }
        return pts;
      };
      const addLeaf=(i,ang,len,w,sag)=>{
        const b=baseOffset(i);
        const flip=rand(300+i)<0.5?-1:1;
        const pts=cubicLeaf(b.x,b.y,ang,len,sag,flip);
        this.branches.push({
          id:i, kind:'leaf', points:pts, angle:ang, length:len,
          width:w, depth:0, children:[], hasLeaf:false,
          leafTone: tones[i] || 'dan',
        });
      };
      const BL=sp.baseLen, BW=sp.baseWidth;
      // compose(折枝)模式叶更长，弯度更大——披拂入画
      const L = isCompose ? 1.75 : 1.0;
      // 折枝模式：主叶初始更斜(向画面内)，sag更大(尖端弯垂)，形成大弧线
      const aSkew = isCompose ? 0.22 : 0.18;
      const aCross = isCompose ? -0.28 : -0.22;
      const aBreak = isCompose ? 0.65 : 0.55;
      const sMain = isCompose ? 0.38 : 0.22;
      const sCross = isCompose ? 0.48 : 0.30;
      const sBreak = isCompose ? 0.78 : 0.60;
      // 宋画兰叶法：
      // 第1笔(主叶)：从基出，向画面内斜上挺拔，尖端微垂
      // 第2笔(交凤眼)：向反方向斜上，与主叶在中段交叉成凤眼
      // 第3笔(破凤眼)：大幅斜出，明显弯垂——打破凤眼对称
      // 第4-5笔：中短辅叶
      // 第6+笔：嫩叶抱根
      addLeaf(0, UP + (lean>0?aSkew:-aSkew) + (rand(12)-0.5)*0.06,
              BL*L*(1.35+rand(13)*0.15), BW*(1.0+rand(14)*0.15), sMain+rand(15)*0.08);
      addLeaf(1, UP + (lean>0?aCross:-aCross) + (rand(22)-0.5)*0.06,
              BL*L*(1.20+rand(23)*0.10), BW*(0.88+rand(24)*0.12), sCross+rand(25)*0.08);
      addLeaf(2, UP + (lean>0?aBreak:-aBreak) + (rand(32)-0.5)*0.08,
              BL*L*(1.00+rand(33)*0.10), BW*(0.78+rand(34)*0.10), sBreak+rand(35)*0.12);
      addLeaf(3, UP + (lean>0?-(aBreak*0.7):aBreak*0.7) + (rand(36)-0.5)*0.12,
              BL*L*(0.85+rand(37)*0.12), BW*(0.68+rand(38)*0.10), 0.50+rand(39)*0.15);
      addLeaf(4, UP + lean*0.12 + (rand(42)-0.5)*0.15,
              BL*L*(0.70+rand(43)*0.15), BW*(0.58+rand(44)*0.10), 0.38+rand(45)*0.12);
      for(let i=5;i<n;i++){
        const r=rand(40+i); let ang;
        if(r<0.45){ ang=UP+lean*0.08+(rand(41+i)-0.5)*0.25; }
        else if(r<0.75){ ang=UP+(rand(42+i)<0.5?0.30:-0.30)+(rand(43+i)-0.5)*0.15; }
        else { ang=UP+(rand(44+i)<0.5?0.55:-0.55)+(rand(45+i)-0.5)*0.15; }
        const sag = r<0.45 ? 0.25+rand(48+i)*0.12 : 0.45+rand(48+i)*0.20;
        addLeaf(i, ang, BL*L*(0.38+rand(46+i)*0.32), BW*(0.42+rand(47+i)*0.22), sag);
      }
    }

        children: [],

        leafAngle: this.rand(offset+50) * Math.PI * 2,

      // 介(jie,4-6叶)：个+侧叶

      const lc = b.leafCount || [3, 3];

      for (let n = 0; n < strokes; n++) {

          const by2 = sy + Math.sin(na)*len*0.08;

        if (leafTone === 'nong') {
          leafRGB = rgbOf(INK.jiao); leafDry = 0.25; leafFeibai = 0.35; leafEdge = 0.22;
        } else if (leafTone === 'zhong') {
          leafRGB = rgbOf(INK.nong); leafDry = 0.35; leafFeibai = 0.48; leafEdge = 0.28;
        } else if (leafTone === 'qing') {
          leafRGB = rgbOf(INK.zhong); leafDry = 0.48; leafFeibai = 0.62; leafEdge = 0.35;
        } else {
          leafRGB = rgbOf(INK.nong); leafDry = 0.42; leafFeibai = 0.55; leafEdge = 0.32;
        }
        if (!hasFold) {
          brushStrokeV5(ctx, centerPath, {
            maxW: leafMaxW,
            opacity: a,
            rgb: leafRGB,
            dryness: leafDry,
            feibai: leafFeibai,
            tremor: 0.10,
            edgeJag: leafEdge,
            layers: 2,
            pressure: leafPressure,
            seed: b.id * 131 + n * 17 + 3
          });
        } else {
          // 折叶：前半段用原色，后半段用淡墨
          const foldIdx = Math.round(0.40 * N);
          const frontPath = centerPath.slice(0, foldIdx+1);
          const backPath = centerPath.slice(foldIdx);
          // 前半
          brushStrokeV5(ctx, frontPath, {
            maxW: leafMaxW,
            opacity: a,
            rgb: leafRGB,
            dryness: leafDry,
            feibai: leafFeibai,
            tremor: 0.10,
            edgeJag: leafEdge,
            layers: 2,
            pressure: leafPressure,
            seed: b.id * 131 + n * 17 + 3
          });
          // 后半（淡墨/清墨叶背）
          const backRGB = rgbOf(INK.dan);
          brushStrokeV5(ctx, backPath, {
            maxW: leafMaxW * 0.95,
            opacity: aBack,
            rgb: backRGB,
            dryness: 0.50,
            feibai: 0.65,
            tremor: 0.12,
            edgeJag: 0.50,
            layers: 2,
            pressure: leafPressure,
            seed: b.id * 131 + n * 17 + 99
          });
        }

        // 焦墨叶尖出锋线（主笔+浓墨，仅非折叶）
        if (len > 40 && leafTone === 'nong' && n === 0 && !doFold) {
          ctx.globalAlpha = a * 0.45;
          ctx.strokeStyle = INK.jiao;
          ctx.lineWidth = Math.max(0.4, maxHalf*0.08);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(ex - Math.cos(a2)*maxHalf*0.3, ey - Math.sin(a2)*maxHalf*0.3);
          const kickBend = (this.rand(b.id+n*82)-0.5) * maxHalf*0.4;
          const kickAng = a2;
          ctx.quadraticCurveTo(
            ex + Math.cos(kickAng)*maxHalf*0.3 - Math.sin(kickAng)*kickBend,
            ey + Math.sin(kickAng)*maxHalf*0.3 + Math.cos(kickAng)*kickBend,
            ex + Math.cos(kickAng)*maxHalf*0.9,
            ey + Math.sin(kickAng)*maxHalf*0.9);
          ctx.stroke();
        }

        // v12.1: 中脉/飞白/折痕已由 brushStrokeV5 内部处理，不再叠加旧的 post-fill 效果
        // 保留焦墨叶尖出锋线（在笔触之上叠一笔更细的浓墨，增强笔锋感）
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    drawPineNeedles(ctx, b, lx, ly, sway, leafAlpha, scaleMul) {
      const sm = scaleMul || 1;
      const clusters = 1 + Math.floor(this.rand(b.id*3)*2);
      let nlen = 20;
      for (let c = 0; c < clusters; c++) {
        const cx = lx + (this.rand(b.id+c*7)-0.5)*5;
        const cy = ly + (this.rand(b.id+c*9)-0.5)*5;
        const count = 10 + Math.floor(this.rand(b.id+c*11)*5);
        nlen = (18 + this.rand(b.id+c*13)*8) * sm;
        const spread = 0.9 + this.rand(b.id+c*17)*0.3;
        const baseDir = b.angle + (c-0.5)*0.3;
        // 每束针随机60%浓(nong) 40%焦(jiao)
        const needleColor = this.rand(b.id+c*19) < 0.6 ? INK.nong : INK.jiao;
        ctx.strokeStyle = needleColor;
        ctx.lineCap = 'round';
        ctx.lineWidth = 0.5;
        for (let n = 0; n < count; n++) {
          const t = count === 1 ? 0.5 : n/(count-1);
          const na = baseDir - spread/2 + t*spread + (this.rand(b.id+c*20+n)-0.5)*0.08;
          const nl = nlen*(0.75+this.rand(b.id+c*30+n)*0.35);
          ctx.globalAlpha = (0.55+this.rand(b.id+c*40+n)*0.3)*leafAlpha;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx+Math.cos(na)*nl, cy+Math.sin(na)*nl);
          ctx.stroke();
        }
      }
      if (this.rand(b.id*23) > 0.4) {
        ctx.strokeStyle = INK.dan;
        ctx.lineWidth = 0.4;
        for (let n = 0; n < 4; n++) {
          const na = b.angle + (this.rand(b.id*25+n)-0.5)*1.4;
          ctx.globalAlpha = 0.3*leafAlpha;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx+Math.cos(na)*nlen*0.8, ly+Math.sin(na)*nlen*0.8);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawPlumBlossom(ctx, b, lx, ly, sway, leafAlpha) {
      const isRed = b.id === this.redBlossomId;
      const isBud = this.rand(b.id*17) < 0.25;
      const sz = 1.5 + this.rand(b.id*3)*1.0;
      const toneRoll = this.rand(b.id*21);
      let petalStyle;
      if (isRed) petalStyle = 'rouge';
      else if (toneRoll < 0.25) petalStyle = 'nong';
      else petalStyle = 'qing';
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(sway*0.2);
      if (isBud) {
        ctx.fillStyle = isRed ? INK.rouge : (petalStyle==='nong'?INK.nong:INK.dan);
        ctx.globalAlpha = (isRed?0.7:0.5)*leafAlpha;
        ctx.beginPath();
        ctx.arc(0, 0, sz*0.7, 0, Math.PI*2);
        ctx.fill();
      } else {
        const dist = sz*1.1;
        for (let p = 0; p < 5; p++) {
          const pa = (p/5)*Math.PI*2 - Math.PI/2;
          const px = Math.cos(pa)*dist, py = Math.sin(pa)*dist;
          if (petalStyle === 'rouge') {
            ctx.fillStyle = INK.rouge;
            ctx.globalAlpha = 0.65*leafAlpha;
            ctx.beginPath();
            ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
            ctx.fill();
          } else if (petalStyle === 'nong') {
            ctx.fillStyle = INK.nong;
            ctx.globalAlpha = 0.45*leafAlpha;
            ctx.beginPath();
            ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
            ctx.fill();
          } else {
            const roll = this.rand(b.id*20+p);
            if (roll < 0.6) {
              ctx.strokeStyle = INK.qing;
              ctx.globalAlpha = 0.4*leafAlpha;
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
              ctx.stroke();
            } else {
              ctx.fillStyle = INK.dan;
              ctx.globalAlpha = 0.3*leafAlpha;
              ctx.beginPath();
              ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }
        ctx.fillStyle = INK.jiao;
        ctx.globalAlpha = 0.7*leafAlpha;
        for (let s = 0; s < 5; s++) {
          const sa = (s/5)*Math.PI*2;
          ctx.beginPath();
          ctx.arc(Math.cos(sa)*sz*0.3, Math.sin(sa)*sz*0.3, 0.5, 0, Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    draw(ctx, wind, time, layer) {
      const sp = this.species;
      // v12.0 P4: compose 三竹藏露——远竹→辅竹→主竹（主竹最后画，覆盖在最前）
      // 仅当存在 _composeRole 标记时排序，非compose路径完全保持原序
      let orderedBranches;
      let anyRole = false;
      for (let _bi = 0; _bi < this.branches.length; _bi++) {
        if (this.branches[_bi]._composeRole) { anyRole = true; break; }
      }
      if (anyRole) {
        const roleRank = { 'far': 0, 'sub': 1, 'main': 2 };
        // stable sort：同 role 内保持原 id 顺序
        orderedBranches = this.branches.slice().sort(function(a, b){
          const ra = a._composeRole ? roleRank[a._composeRole] : 1;
          const rb = b._composeRole ? roleRank[b._composeRole] : 1;
          if (ra !== rb) return ra - rb;
          return (a.id || 0) - (b.id || 0);
        });
      } else {
        orderedBranches = this.branches;
      }
      const visCount = Math.min(Math.floor(this.growth)+1, orderedBranches.length);
      const rgb = sp.rgb;
      const useShadow = layer.detail && sp.baseWidth >= 6 && sp.name !== '竹' && sp.name !== '兰';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 0; i < visCount; i++) {
        const b = orderedBranches[i];
        const partial = i === visCount-1 ? (this.growth - Math.floor(this.growth)) : 1;
        const pts = b.points;
        if (pts.length < 2) continue;
        const swayFactor = 1 - b.depth/sp.maxDepth;
        const effWind = wind.strength + wind.gust;
        const wave1 = Math.sin(time*0.001 + b.id*0.3 + this.seed*0.01);
        const wave2 = Math.sin(time*0.0027 + b.id*0.5 + this.seed*0.02)*0.5;
        const windAmp = sp.name === '柳' ? 7 : (sp.name === '兰' ? 5 : 4);
        const windX = (wave1+wave2)*effWind*windAmp*swayFactor*wind.direction;
        const windY = Math.cos(time*0.0013+b.id*0.2)*effWind*1.2*swayFactor;
        const droop = this.dying ? (1-this.fade)*6*(1-b.depth/sp.maxDepth) : 0;
        const depthFactor = b.depth / sp.maxDepth;
        const inkMix = Math.min(1, 0.25 + depthFactor*0.4 + layer.inkMix);
        const alpha = (0.65+(1-depthFactor)*0.35)*(1-layer.inkMix*0.3)*this.fade;
        const cr = Math.floor(rgb.r + (190-rgb.r)*inkMix);
        const cg = Math.floor(rgb.g + (180-rgb.g)*inkMix);
        const cb = Math.floor(rgb.b + (160-rgb.b)*inkMix);
        const strokeColor = 'rgba('+cr+','+cg+','+cb+','+alpha+')';
        if (useShadow && b.depth <= 2) {
          ctx.shadowColor = 'rgba(26,22,18,0.18)';
          ctx.shadowBlur = 4;
        } else {
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        }
        const dpts = [];
        const lim = Math.max(2, Math.ceil(pts.length*partial));
        for (let k = 0; k < lim; k++) {
          const wf = (1 - k/(pts.length-1))*swayFactor;
          dpts.push({
            x: pts[k].x + windX*wf,
            y: pts[k].y + (windY + droop)*wf
          });
        }
        if (sp.name === '竹' && b.kind === 'stalk') {
          this.drawBambooStalk(ctx, b, dpts, strokeColor, alpha, layer);
        } else if (sp.name === '竹' && b.kind === 'twig') {
          this.drawBambooTwig(ctx, b, dpts, alpha, layer);
        } else if (sp.name === '松' && b.kind === 'branch') {
          this.drawPineBranch(ctx, b, dpts, strokeColor, alpha, layer, pts, partial);
        } else if (sp.name === '柳') {
          this.drawWillowBranch(ctx, b, dpts, strokeColor, alpha, layer, time, windX, windY, swayFactor, this.fade);
        } else if (sp.name === '兰' && b.kind === 'leaf') {
          this.drawOrchidLeaf(ctx, b, dpts, alpha);
        } else {
          this.drawGenericBranch(ctx, b, dpts, strokeColor, alpha, layer, sp, pts, partial);
        }
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        if (b.hasLeaf && partial >= 0.8 && layer.detailAlpha > 0.05
            && !(sp.name === '柳' && b.kind !== 'droop')) {
          const tip = dpts[dpts.length-1];
          const lx = tip.x, ly = tip.y;
          const sway = Math.sin(time*0.002+b.id+this.seed)*0.15;
          const leafAlpha = this.fade * layer.detailAlpha;
          if (sp.name === '松') {
            this.drawPineNeedles(ctx, b, lx, ly, sway, leafAlpha);
            if (b.depth <= 2 && dpts.length >= 5) {
              for (let mi = 2; mi < dpts.length-2; mi += 2) {
                if (this.rand(b.id*100+mi) > 0.45) continue;
                const mp = dpts[mi];
                this.drawPineNeedles(ctx, b, mp.x, mp.y, sway, leafAlpha*0.8, 0.65);
              }
            }
          } else if (sp.name === '竹') {
            // v5.7: 叶只从短枝枝端生出（短枝本身藏于叶中）
            this.drawBambooLeaves(ctx, b, lx, ly, sway, leafAlpha, 1.0);
          } else if (sp.name === '梅') {
            this.drawPlumBlossom(ctx, b, lx, ly, sway, leafAlpha);
            if (b.depth <= 3 && dpts.length >= 4) {
              let lastBx = lx, lastBy = ly;
              for (let mi = 1; mi < dpts.length-1; mi += 2) {
                if (this.rand(b.id*100+mi) > 0.35) continue;
                const mp = dpts[mi];
                const ddx = mp.x-lastBx, ddy = mp.y-lastBy;
                if (Math.sqrt(ddx*ddx+ddy*ddy) < 20) continue;
                this.drawPlumBlossom(ctx, b, mp.x, mp.y, sway, leafAlpha*0.85);
                lastBx = mp.x; lastBy = mp.y;
              }
            }
          }
        }
      }
      if (sp.name === '兰' && this.growth >= this.maxGrowth*0.8 && layer.detailAlpha > 0.1) {
        this.drawOrchidFlowers(ctx, time, this.fade*layer.detailAlpha);
      }
      ctx.globalAlpha = 1;
    }
    drawBambooTwig(ctx, b, dpts, alpha, layer) {
      // v11.2: brushPath铺贴笔道 + v11.1三段宽度曲线/老新枝分化/加强钉头/鼠尾延伸
      if (dpts.length < 2) return;
      ctx.save();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      const sc = layer.scale || 1;
      const baseW = Math.max(1.5, (b.width || 3.0) * sc);
      const isOld = b.depth <= 2;
      const isMid = b.depth === 3;
      const twigColor = isOld ? INK.jiao : (isMid ? INK.nong : INK.zhong);
      const twigAlpha = isOld ? 0.92 : (isMid ? 0.84 : 0.76);
      const tremorAmt = isOld ? 0.18 : (isMid ? 0.08 : 0);
      const sr = (i, off) => { const x = Math.sin((b.id*13.7 + i*7.3 + off*3.1))*43758.5453; return x - Math.floor(x); };
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // fine插值细分给brushPath
      const fine = [];
      for (let k = 0; k < dpts.length-1; k++) {
        const a = dpts[k], c = dpts[k+1];
        const sub = 4;
        for (let s = 0; s < sub; s++) {
          const t = s/sub;
          fine.push({x:a.x+(c.x-a.x)*t, y:a.y+(c.y-a.y)*t});
        }
      }
      fine.push(dpts[dpts.length-1]);

      // 三段宽度曲线：钉头粗→中段收→鼠尾急细
      const twigPressure = (maxW) => (t) => {
        let w;
        if (t < 0.10) w = maxW * (1.0 - 0.08*(t/0.10));
        else if (t < 0.50) w = maxW * (0.92 - 0.30*((t-0.10)/0.40));
        else w = maxW * 0.62 * Math.pow(1-(t-0.50)/0.50, 2.5);
        return { width: Math.max(0.25, w), opacity: 0.90 - t*0.20 };
      };

      // 选择对应墨色stamp
      let wetS, dryS;
      if (isOld) { wetS = stamp; dryS = stampDry; }
      else if (isMid) { wetS = stampNong; dryS = stampNongDry; }
      else { wetS = stampZhong; dryS = stampZhongDry; }

      // 老枝用brushPathFeibai（顿挫+飞白），中/新枝用brushPath
      if (isOld) {
        brushPathFeibai(ctx, fine, wetS, dryS, twigPressure(baseW), {
          opacity: twigAlpha * alpha, feibai: 0.45, streaks: 4,
          dryStart: 0.50, tremor: tremorAmt, seed: b.id
        });
      } else {
        brushPath(ctx, fine, wetS, twigPressure(baseW), {
          opacity: twigAlpha * alpha, spacing: 0.16
        });
      }
      ctx.restore();

      // v12.0 P2-fix: 钉头起笔——缩到0.6倍、浓墨（非死黑）、alpha 0.60；挫笔缩到0.25 alpha 0.30
      ctx.save();
      ctx.globalAlpha = alpha * 0.60;
      ctx.fillStyle = INK.nong;
      const nailR = baseW * 0.6;
      const p0 = dpts[0], p1 = dpts[Math.min(1, dpts.length-1)];
      const ang0 = Math.atan2(p1.y-p0.y, p1.x-p0.x);
      ctx.beginPath();
      ctx.ellipse(p0.x, p0.y, nailR*1.0, nailR*0.68, ang0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = alpha * 0.30;
      ctx.beginPath();
      ctx.ellipse(p0.x - Math.cos(ang0)*nailR*0.25, p0.y - Math.sin(ang0)*nailR*0.25,
                  nailR*0.25, nailR*0.18, ang0+0.3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      // 鼠尾收笔——延伸锋微弯
      if (dpts.length >= 3) {
        const tailP0 = dpts[dpts.length-2];
        const tailP1 = dpts[dpts.length-1];
        const tailAng = Math.atan2(tailP1.y-tailP0.y, tailP1.x-tailP0.x);
        const tailLen = Math.hypot(tailP1.x-tailP0.x, tailP1.y-tailP0.y);
        const ext = tailLen * (0.8 + sr(0,5)*0.2);
        ctx.save();
        ctx.strokeStyle = twigColor;
        ctx.globalAlpha = alpha * (isOld ? 0.40 : 0.30);
        ctx.lineWidth = Math.max(0.2, baseW*0.06);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tailP1.x, tailP1.y);
        const bendAmt = (sr(0,6)-0.5) * 3;
        ctx.quadraticCurveTo(
          tailP1.x + Math.cos(tailAng)*ext*0.5 - Math.sin(tailAng)*bendAmt,
          tailP1.y + Math.sin(tailAng)*ext*0.5 + Math.cos(tailAng)*bendAmt,
          tailP1.x + Math.cos(tailAng)*ext,
          tailP1.y + Math.sin(tailAng)*ext);
        ctx.stroke();
        ctx.restore();
      }

      // v12.0 P2-fix: 节墨点——半径从0.35缩到0.15，alpha从0.60降到0.25，概率从55%降到35%（65%跳过）
      if (isOld && dpts.length > 3) {
        for (let k = 1; k < dpts.length-1; k += 2) {
          if (this.rand(b.id*60+k) > 0.35) continue;
          ctx.save();
          ctx.globalAlpha = alpha * 0.25;
          ctx.fillStyle = INK.jiao;
          ctx.beginPath();
          ctx.arc(dpts[k].x, dpts[k].y, baseW * 0.15 + 0.3, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawBambooStalk(ctx, b, dpts, strokeColor, alpha, layer) {
      // v11.2: 回归brushPath三段墨色铺贴（焦→浓→重），保留v11.1粗细分档/微欹/鹊爪变形
      if (dpts.length < 2) return;
      ctx.save();
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
      const grade = b.stalkGrade || (b.isMain ? 'main' : 'sub');
      const gradeMul = grade === 'main' ? 1.0 : (grade === 'sub' ? 0.78 : 0.60);
      const gradeAlpha = grade === 'main' ? 1.0 : (grade === 'sub' ? 0.85 : 0.68);
      // v12.0 P2-fix2: 根基加宽——下限3.0→4.0，整体×1.15（约15-20%），pw0仅影响竿身
      const pw0 = Math.max(4.0, b.width * layer.scale * gradeMul) * 1.15;
      const a0 = alpha * gradeAlpha;
      const sr = (i, off) => { const x = Math.sin((b.id*13.7 + i*7.3 + off*3.1))*43758.5453; return x - Math.floor(x); };
      // v12.0 P2-fix2: 矮竿锥度幂指数1.2，普通竿1.5
      const isShort = !!b.isShort;
      const tipPow = isShort ? 1.2 : 1.5;

      // 宽度包络：根粗梢急收（v11.1）
      // v12.0 P2-fix2: 锥度曲线调缓——根:梢≈12:1，但光竿段(t=0-0.5)只从1.0收到0.65，视觉壮实
      // t=0→0.5: 1.0→0.65；t=0.5→0.85: 0.65→0.35；t=0.85→1.0: 0.35→0.08（幂1.5/1.2）
      const widthAt = (t) => {
        let taper;
        if (t < 0.50) {
          taper = 1.0 - 0.70 * t;                       // 1.0 → 0.65
        } else if (t < 0.85) {
          taper = 0.65 - 0.857 * ((t - 0.50) / 0.35);  // 0.65 → 0.35
        } else {
          taper = 0.35 * Math.pow(1 - (t - 0.85) / 0.15, tipPow); // 0.35 → 0
        }
        // local肉感：t<0.5 保持1.0（不再压细中段），t>0.5 再轻微收杀
        let local;
        if (t < 0.05) local = 0.92 + 0.08*(t/0.05);
        else if (t < 0.50) local = 1.0;                                  // 中段不压
        else if (t < 0.85) local = 1.0 - 0.10*((t-0.50)/0.35);          // 1.0 → 0.90
        else local = 0.90 * Math.pow(1-(t-0.85)/0.15, 1.0);
        return pw0 * Math.max(0.06, taper) * local;
      };

      // fine插值细分
      const fine = [];
      for (let k = 0; k < dpts.length-1; k++) {
        const a = dpts[k], c = dpts[k+1];
        const sub = 6;
        for (let s = 0; s < sub; s++) {
          const t = s/sub;
          fine.push({x:a.x+(c.x-a.x)*t, y:a.y+(c.y-a.y)*t});
        }
      }
      fine.push(dpts[dpts.length-1]);

      // 压感：直接基于widthAt根粗梢细包络，叠加起笔藏锋/收笔出锋微变化
      const makeSegPressure = (gt0, gt1) => (t) => {
        const gt = gt0 + (gt1 - gt0) * t;
        let w = widthAt(gt);
        if (t < 0.08) w *= (0.80 + 0.20*(t/0.08));
        return { width: Math.max(0.5, w), opacity: 0.95 - t*0.10 };
      };

      ctx.globalAlpha = a0;
      // 三段墨色：根焦墨→中浓墨→梢重墨（v9.9核心）
      // v11.2: 直接brushPath铺贴（非feibai离屏），opacity提高避免雾化
      const segs = [
        {t0:0,    t1:1/3,  wet:stalkStamp,      dry:stalkDry,      feibai:0.35},
        {t0:1/3,  t1:2/3,  wet:stalkStampNong,  dry:stalkNongDry,  feibai:0.30},
        {t0:2/3,  t1:1,    wet:stalkStampZhong, dry:stalkZhongDry, feibai:0.25},
      ];
      for (const seg of segs) {
        const i0 = Math.floor(seg.t0*(fine.length-1));
        const i1 = Math.ceil(seg.t1*(fine.length-1));
        const segPts = fine.slice(i0, i1+1);
        if (segPts.length < 2) continue;
        // 主笔道：湿笔饱满骨架
        brushPath(ctx, segPts, seg.wet, makeSegPressure(seg.t0, seg.t1), {
          opacity: 0.48, spacing: 0.24, szMul: 1.30, jitter: 0.18, seed: b.id*3 + Math.floor(seg.t0*9)
        });
        // 干笔第二层：稀疏颗粒+飞白露丝，打破实心柱
        brushPath(ctx, segPts, seg.dry, makeSegPressure(seg.t0, seg.t1), {
          opacity: 0.30, spacing: 0.30, szMul: 1.18, jitter: 0.40, seed: b.id*5 + 17 + Math.floor(seg.t0*11)
        });
        // 飞白：destination-out刮丝（clip到本段区域）
        if (layer.detail && pw0 > 5) {
          ctx.save();
          ctx.beginPath();
          for (let ci = 0; ci < segPts.length; ci++) {
            const cp = segPts[ci];
            const cp0 = segPts[Math.max(0,ci-1)];
            const cp1 = segPts[Math.min(segPts.length-1,ci+1)];
            const ddx = cp1.x-cp0.x, ddy = cp1.y-cp0.y;
            const ddl = Math.hypot(ddx,ddy)||1;
            const cnx = -ddy/ddl, cny = ddx/ddl;
            const ct = seg.t0 + (seg.t1 - seg.t0) * (ci / (segPts.length - 1));
            const cw = widthAt(ct) * 1.3;
            if (ci === 0) ctx.moveTo(cp.x + cnx*cw, cp.y + cny*cw);
            else ctx.lineTo(cp.x + cnx*cw, cp.y + cny*cw);
          }
          for (let ci = segPts.length - 1; ci >= 0; ci--) {
            const cp = segPts[ci];
            const cp0 = segPts[Math.max(0,ci-1)];
            const cp1 = segPts[Math.min(segPts.length-1,ci+1)];
            const ddx = cp1.x-cp0.x, ddy = cp1.y-cp0.y;
            const ddl = Math.hypot(ddx,ddy)||1;
            const cnx = -ddy/ddl, cny = ddx/ddl;
            const ct = seg.t0 + (seg.t1 - seg.t0) * (ci / (segPts.length - 1));
            const cw = widthAt(ct) * 1.3;
            ctx.lineTo(cp.x - cnx*cw, cp.y - cny*cw);
          }
          ctx.closePath();
          ctx.clip();
          ctx.globalCompositeOperation = 'destination-out';
          const nFb = 5 + Math.floor(sr(Math.floor(seg.t0*10), 50)*3);
          for (let fi = 0; fi < nFb; fi++) {
            const fbT = 0.08 + fi * 0.14 + sr(fi, 51)*0.10;
            const fbStart = Math.max(0, Math.floor(fbT * (segPts.length-1)));
            const fbLen = Math.max(4, Math.floor(segPts.length * (0.18 + sr(fi,52)*0.22)));
            const fbEnd = Math.min(segPts.length-1, fbStart + fbLen);
            ctx.globalAlpha = 0.16 + sr(fi,53)*0.22;
            ctx.strokeStyle = '#000';
            ctx.lineCap = 'round';
            ctx.lineWidth = 0.5 + sr(fi,54)*1.2;
            ctx.setLineDash([2 + sr(fi,55)*4, 1.5 + sr(fi,56)*2.5]);
            ctx.beginPath();
            for (let j = fbStart; j <= fbEnd; j++) {
              const pp = segPts[j];
              const pt = seg.t0 + (seg.t1 - seg.t0) * (j / (segPts.length - 1));
              const pw = widthAt(pt);
              const wob = (sr(j, fi+57)-0.5) * pw * 0.25;
              // 沿法线偏移
              const pp0 = segPts[Math.max(0,j-1)];
              const pp1 = segPts[Math.min(segPts.length-1,j+1)];
              const ddx = pp1.x-pp0.x, ddy = pp1.y-pp0.y;
              const ddl = Math.hypot(ddx,ddy)||1;
              const nx2 = -ddy/ddl, ny2 = ddx/ddl;
              const px = pp.x + nx2*wob, py = pp.y + ny2*wob;
              if (j === fbStart) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          }
          ctx.setLineDash([]);
          ctx.restore();
        }
      }
      ctx.restore();

      // 竹节鹊爪——保留v11.1随机变形
      if (b.nodes && layer.detail) {
        ctx.save();
        for (const ni of b.nodes) {
          if (ni <= 0 || ni >= dpts.length-1) continue;
          // v12.0 P4-fix7: 底部3节不画节环，避免粗竿基部环距过密堆叠成"弹簧/漩涡"感
          if (ni <= 3) continue;
          const p = dpts[ni];
          const prev = dpts[ni-1], next = dpts[ni+1];
          const dx = next.x-prev.x, dy = next.y-prev.y;
          const ln = Math.hypot(dx,dy)||1;
          const ux = dx/ln, uy = dy/ln;
          const nx = -uy, ny = ux;
          const tpos = ni/(dpts.length-1);
          const nodeW = widthAt(tpos);
          // v12.0 P2-fix2: 节环宽窄 ±15%、浓淡 0.50-0.85、弧度每节不同、位置±1px
          const widthVar = 0.85 + sr(ni,40)*0.30;          // 0.85-1.15
          const alphaVar = 0.50 + sr(ni,41)*0.35;          // 0.50-0.85
          const arcH = 0.35 + sr(ni,42)*0.50;              // 下弧 0.35-0.85 倍 nodeW
          const arcHUp = 0.25 + sr(ni,43)*0.40;            // 上弧 0.25-0.65
          const posJit = (sr(ni,44)-0.5)*2;                // ±1px 沿竿
          const normJit = (sr(ni,45)-0.5)*1.2;             // ±0.6px 垂直竿
          const hw = nodeW * 0.95 * widthVar;
          // 节中心：位置微偏移
          const cx = p.x + ux*posJit + nx*normJit;
          const cy = p.y + uy*posJit + ny*normJit;
          const clawVar = sr(ni,30);
          const angleVar = 0.80 + clawVar*0.40;
          const thickVar = 0.75 + sr(ni,31)*0.50;
          const forkVar = sr(ni,32) < 0.3 ? 2 : 1;
          const arcVar = 0.7 + sr(ni,33)*0.6;
          ctx.lineCap = 'round';
          // v12.0 P1: 去 destination-out（会擦掉竿身铺贴），改为 source-over 两道墨弧
          // 下环——浓墨托底，弧顶向 +u（沿竿梢方向）凸起，形成"承上"的杯状弧
          ctx.strokeStyle = 'rgba(26,22,18,'+alphaVar+')';
          ctx.lineWidth = Math.max(2.0, nodeW*0.20*thickVar*widthVar);
          ctx.globalAlpha = a0;
          ctx.beginPath();
          ctx.moveTo(cx - nx*hw*0.98 + ux*nodeW*0.05, cy - ny*hw*0.98 + uy*nodeW*0.05);
          ctx.quadraticCurveTo(
            cx + ux*nodeW*arcH, cy + uy*nodeW*arcH,
            cx + nx*hw*0.98 + ux*nodeW*0.05, cy + ny*hw*0.98 + uy*nodeW*0.05);
          ctx.stroke();
          // 上环——重墨，位于下环上方（沿 -u 方向 nodeW*0.25），弧顶向 -u（反根方向）凸
          const upOff = nodeW * 0.22;
          ctx.strokeStyle = 'rgba(44,36,28,'+(alphaVar*0.85)+')';
          ctx.lineWidth = Math.max(1.5, nodeW*0.14*thickVar*widthVar);
          ctx.globalAlpha = a0*0.92;
          ctx.beginPath();
          ctx.moveTo(cx - nx*hw*0.92 - ux*upOff - ux*nodeW*0.02,
                     cy - ny*hw*0.92 - uy*upOff - uy*nodeW*0.02);
          ctx.quadraticCurveTo(
            cx - ux*(upOff + nodeW*arcHUp), cy - uy*(upOff + nodeW*arcHUp),
            cx + nx*hw*0.92 - ux*upOff - ux*nodeW*0.02,
            cy + ny*hw*0.92 - uy*upOff - uy*nodeW*0.02);
          ctx.stroke();
          // 鹊爪短线——降为 alpha 0.50
          ctx.strokeStyle = 'rgba(26,22,18,'+(0.50*a0)+')';
          ctx.lineWidth = Math.max(1.0, nodeW*0.12*thickVar);
          ctx.globalAlpha = a0*0.55;
          for (const side of [-1, 1]) {
            const clawAng = angleVar * side;
            ctx.beginPath();
            ctx.moveTo(p.x + nx*hw*0.78*clawAng + ux*nodeW*0.12, p.y + ny*hw*0.78*clawAng + uy*nodeW*0.12);
            ctx.quadraticCurveTo(
              p.x + nx*hw*0.96*clawAng*arcVar - ux*nodeW*0.12,
              p.y + ny*hw*0.96*clawAng*arcVar - uy*nodeW*0.12,
              p.x + nx*hw*1.05*clawAng - ux*nodeW*0.50,
              p.y + ny*hw*1.05*clawAng - uy*nodeW*0.50);
            ctx.stroke();
            if (forkVar > 1) {
              ctx.globalAlpha = a0*0.45;
              ctx.lineWidth = Math.max(0.8, nodeW*0.08*thickVar);
              ctx.beginPath();
              ctx.moveTo(p.x + nx*hw*0.85*clawAng, p.y + ny*hw*0.85*clawAng);
              ctx.quadraticCurveTo(
                p.x + nx*hw*1.0*clawAng*arcVar - ux*nodeW*0.20,
                p.y + ny*hw*1.0*clawAng*arcVar - uy*nodeW*0.20,
                p.x + nx*hw*1.15*clawAng - ux*nodeW*0.35,
                p.y + ny*hw*1.15*clawAng - uy*nodeW*0.35);
              ctx.stroke();
              ctx.globalAlpha = a0*0.68;
            }
          }
        }
        ctx.restore();
      }
      // v12.0 P4-fix9: 竿基收笔——按竿相分级：主竹焦墨钝笔+苔点；辅竹淡收；远竹虚入不见根
      if (b.kind === 'stalk') {
        const bp = dpts[0];
        const bn = dpts[Math.min(2, dpts.length-1)];
        const bdx = bn.x - bp.x, bdy = bn.y - bp.y;
        const bln = Math.hypot(bdx,bdy)||1;
        const bux = bdx/bln, buy = bdy/bln;
        const bnx = -buy, bny = bux;
        const grade = b.stalkGrade || (b.isMain ? 'main' : 'sub');
        const rootW = pw0 * 0.95;
        ctx.save();
        if (grade === 'far') {
          // 远竹：根虚入纸面——渐隐短线+1个淡苔点，远不见根
          ctx.strokeStyle = 'rgba(60,52,42,0.35)';
          ctx.lineWidth = Math.max(0.6, pw0*0.5);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(bp.x, bp.y);
          ctx.lineTo(bp.x - bux*6, bp.y - buy*6);
          ctx.stroke();
          ctx.fillStyle = 'rgba(60,52,42,0.30)';
          ctx.beginPath();
          ctx.ellipse(bp.x - bux*5 + bnx*2, bp.y - buy*5 + bny*2,
                      rootW*0.55, rootW*0.22, Math.atan2(bny,bnx), 0, Math.PI*2);
          ctx.fill();
        } else {
          // 主/辅竹：横切钝笔（焦墨，非正椭圆，长短轴随机形变去戳印感）
          const ellipseA = rootW * (1.0 + (grade==='main'?0.15:0.05) + (sr(0,81)-0.5)*0.3);
          const ellipseB = rootW * (0.32 + (sr(0,82)-0.5)*0.10);
          ctx.fillStyle = grade==='main' ? 'rgba(20,16,12,0.88)' : 'rgba(40,34,26,0.78)';
          ctx.beginPath();
          ctx.ellipse(bp.x + bux*2, bp.y + buy*2, ellipseA, ellipseB,
                      Math.atan2(bny, bnx), 0, Math.PI*2);
          ctx.fill();
          // 苔点：主竹3-5个（一大+数小，焦墨错落），辅竹2-3个（重墨）
          const dotN = grade==='main' ? (3 + Math.floor(sr(0,90)*3)) : (2 + Math.floor(sr(0,90)*2));
          for (let di = 0; di < dotN; di++) {
            const side = di % 2 === 0 ? -1 : 1;
            const isBig = grade==='main' && di === 0;
            const distBase = isBig ? 0.9 : (0.5 + sr(di,91)*0.7);
            const dx = bnx * side * rootW * distBase;
            const dy = bny * side * rootW * distBase + buy * rootW * (0.3 + sr(di,92)*0.7);
            const dr = rootW * (isBig ? 0.32 : (0.16 + sr(di,93)*0.18));
            const alpha = grade==='main'
              ? (isBig ? 0.70 : 0.35 + sr(di,94)*0.35)
              : 0.30 + sr(di,94)*0.25;
            ctx.fillStyle = 'rgba(26,22,18,'+alpha+')';
            ctx.beginPath();
            ctx.ellipse(bp.x+dx, bp.y+dy, dr*1.3, dr*0.75,
                        Math.atan2(bny,bnx)+side*0.3, 0, Math.PI*2);
            ctx.fill();
          }
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    drawPineBranch(ctx, b, dpts, strokeColor, alpha, layer, pts, partial) {
      const pw = Math.max(0.6, b.width*0.5*layer.scale);
      ctx.strokeStyle = strokeColor;
      ctx.lineCap = 'round';
      const total = dpts.length - 1;
      for (let k = 0; k < total; k++) {
        const t = k / total;
        const w = Math.max(0.4, pw * (1 - t*0.3));
        ctx.lineWidth = w;
        ctx.globalAlpha = alpha * (0.85 + (1-t)*0.15);
        ctx.beginPath();
        ctx.moveTo(dpts[k].x, dpts[k].y);
        ctx.lineTo(dpts[k+1].x, dpts[k+1].y);
        ctx.stroke();
        if (this.rand(b.id*7+k*13) < 0.15 && total > 2) {
          ctx.globalAlpha = alpha * (0.25 + this.rand(b.id*8+k*17)*0.35);
          ctx.lineWidth = w * 0.35;
          const mx = (dpts[k].x+dpts[k+1].x)/2;
          const my = (dpts[k].y+dpts[k+1].y)/2;
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(mx, my);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = alpha;
      if (b.width >= 4 && layer.detail && dpts.length >= 3) {
        ctx.strokeStyle = 'rgba(26,22,18,'+(0.35*alpha)+')';
        ctx.lineWidth = Math.max(0.6, pw*0.18);
        for (let k = 1; k < dpts.length-1; k++) {
          if (this.rand(b.id*50+k) > 0.4) continue;
          const p = dpts[k], prev = dpts[k-1], next = dpts[k+1];
          const dx = next.x-prev.x, dy = next.y-prev.y;
          const ln = Math.hypot(dx,dy)||1;
          const nx = -dy/ln, ny = dx/ln;
          const sz = pw*(0.5+this.rand(b.id*60+k)*0.5);
          ctx.beginPath();
          ctx.moveTo(p.x-nx*sz, p.y-ny*sz);
          ctx.quadraticCurveTo(p.x, p.y, p.x+nx*sz, p.y+ny*sz);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(26,22,18,'+(0.3*alpha)+')';
        for (let k = 0; k < dpts.length; k += 2) {
          if (this.rand(b.id*70+k) > 0.2) continue;
          const p = dpts[k];
          ctx.beginPath();
          ctx.arc(p.x+(this.rand(b.id*80+k)-0.5)*pw, p.y+(this.rand(b.id*90+k)-0.5)*pw,
                  0.6+this.rand(b.id*95+k)*1.2, 0, Math.PI*2);
          ctx.fill();
        }
      }
      if (b.depth <= 1 && partial >= 0.7 && dpts.length >= 3) {
        const startIdx = Math.max(1, Math.floor(dpts.length*0.7));
        if (startIdx < dpts.length-1) {
          ctx.save();
          ctx.shadowColor='transparent'; ctx.shadowBlur=0;
          ctx.globalAlpha = alpha*0.4;
          ctx.setLineDash([2+this.rand(b.id*7+41)*3, 2+this.rand(b.id*7+42)*4]);
          ctx.lineDashOffset = this.rand(b.id*7+43)*20;
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = pw*0.7;
          ctx.beginPath();
          ctx.moveTo(dpts[startIdx].x, dpts[startIdx].y);
          for (let j = startIdx+1; j < dpts.length; j++) ctx.lineTo(dpts[j].x, dpts[j].y);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawWillowBranch(ctx, b, dpts, strokeColor, alpha, layer, time, windX, windY, swayFactor, fade) {
      const pw = Math.max(0.5, b.width*0.5*layer.scale);
      if (b.kind === 'droop') {
        ctx.strokeStyle = strokeColor;
        ctx.lineCap = 'round';
        const total = dpts.length - 1;
        for (let k = 0; k < total; k++) {
          const t = k / total;
          const w = Math.max(0.3, pw * (1 - t*0.35));
          ctx.lineWidth = w;
          ctx.globalAlpha = alpha * (0.7 + (1-t)*0.3);
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(dpts[k+1].x, dpts[k+1].y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        if (layer.detail && dpts.length >= 4) {
          ctx.fillStyle = 'rgba(107,94,76,'+(0.5*fade)+')';
          for (let k = 2; k < dpts.length-1; k += 2) {
            if (this.rand(b.id*30+k) > 0.6) continue;
            const p = dpts[k];
            const lsz = 1.5 + this.rand(b.id*40+k)*1.0;
            const ox = (this.rand(b.id*50+k)-0.5)*3;
            const oy = (this.rand(b.id*60+k)-0.5)*2;
            ctx.globalAlpha = (0.35+this.rand(b.id*70+k)*0.3)*fade;
            ctx.beginPath();
            ctx.ellipse(p.x+ox, p.y+oy, lsz*0.6, lsz, 0, 0, Math.PI*2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = pw;
        ctx.beginPath();
        ctx.moveTo(dpts[0].x, dpts[0].y);
        if (dpts.length > 2) {
          for (let k = 1; k < dpts.length-1; k++) {
            const xc = (dpts[k].x+dpts[k+1].x)/2, yc = (dpts[k].y+dpts[k+1].y)/2;
            ctx.quadraticCurveTo(dpts[k].x, dpts[k].y, xc, yc);
          }
          ctx.lineTo(dpts[dpts.length-1].x, dpts[dpts.length-1].y);
        } else {
          ctx.lineTo(dpts[1].x, dpts[1].y);
        }
        ctx.stroke();
        if (b.width >= 3 && layer.detail) {
          ctx.strokeStyle = 'rgba(26,22,18,'+(0.25*alpha)+')';
          ctx.lineWidth = Math.max(0.4, pw*0.15);
          for (let k = 1; k < dpts.length-1; k++) {
            if (this.rand(b.id*80+k) > 0.5) continue;
            const p = dpts[k], prev = dpts[k-1], next = dpts[k+1];
            const dx = next.x-prev.x, dy = next.y-prev.y;
            const ln = Math.hypot(dx,dy)||1;
            const nx = -dy/ln, ny = dx/ln;
            const sz = pw*(0.4+this.rand(b.id*85+k)*0.4);
            ctx.beginPath();
            ctx.moveTo(p.x-nx*sz, p.y-ny*sz);
            ctx.quadraticCurveTo(p.x, p.y, p.x+nx*sz, p.y+ny*sz);
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }
    drawOrchidLeaf(ctx, b, dpts, alpha) {
      if (dpts.length < 2) return;
      // v12.1 spike: 使用 brushStrokeV5 真正的毛笔笔触
      let tone = b.leafTone || 'nong';
      const _leafIdx = (b.id || 0) % 9;
      if (_leafIdx >= 5 && tone === 'nong' && this.rand(b.id*7) < 0.75) tone = 'dan';
      // v12.1正式版：兰用清墨淡润，与竹焦浓拉开2个墨阶（竹刚兰柔）
      let leafColor, baseOpacity, dryness, feibaiAmt, edgeJag;
      if (tone === 'dan') {
        leafColor = INK.dan; baseOpacity = 0.72;
        dryness = 0.60; feibaiAmt = 0.80; edgeJag = 0.55; // 嫩叶/淡墨更干更毛
      } else if (tone === 'nong') {
        leafColor = INK.zhong; baseOpacity = 0.82;
        dryness = 0.42; feibaiAmt = 0.55; edgeJag = 0.40; // 主叶用zhong而非jiao，与竹区分
      } else {
        leafColor = INK.zhong; baseOpacity = 0.78;
        dryness = 0.50; feibaiAmt = 0.68; edgeJag = 0.48;
      }
      // v12.1: 兰叶宽度——细劲飘举，提按是细微呼吸而非肿胀（spike的1.8x过粗，回调至1.15x）
      const maxW = b.width * 1.15;
      // 对路径做一次平滑插值（dpts 是折线风动后的点，需增加采样密度）
      brushStrokeV5(ctx, dpts, {
        maxW: maxW,
        opacity: baseOpacity * alpha,
        color: leafColor,

    drawOrchidFlowers(ctx, time, alpha) {

            else profile = 1.0 - (st-0.6)/0.4*0.6;

            ctx.globalAlpha = petalAlpha * (0.4 + 0.6*profile);

        ctx.lineWidth = w;

          const my = (dpts[k].y+dpts[k+1].y)/2;
          ctx.beginPath();

          ctx.globalAlpha = alpha*0.4;
          ctx.setLineDash([2+this.rand(b.id*7+41)*3, 2+this.rand(b.id*7+42)*4]);
          ctx.lineDashOffset = this.rand(b.id*7+43)*20;
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = pw*0.7;
          ctx.beginPath();
          ctx.moveTo(dpts[startIdx].x, dpts[startIdx].y);
          for (let j = startIdx+1; j < dpts.length; j++) ctx.lineTo(dpts[j].x, dpts[j].y);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }
  }
  const wind = {
    strength: 0.15, targetStrength: 0.15, direction: 1,

  let windDomAccum = 0;
  function updateWind(dt, now) {
    if (Math.random() < 0.003) {
      wind.targetStrength = 0.08 + Math.random()*0.17;
      wind.direction = Math.random() > 0.5 ? 1 : -1;
    }
    if (Math.random() < 0.0015 && now - wind.gustStart > 5000) {
      wind.gustStrength = 0.15 + Math.random()*0.2;
      wind.gustStart = now;
    }
    wind.strength += (wind.targetStrength - wind.strength) * dt * 0.5;
    const gustAge = (now - wind.gustStart) / 1000;
    wind.gust = wind.gustStrength * Math.exp(-gustAge * 1.5);
    windDomAccum += dt * 1000;
    if (windDomAccum >= 200) {
      windDomAccum = 0;
      const wb = wind.strength + wind.gust * 0.3;
      const heights = [10,16,22,16,10];
      for (let i = 0; i < 5; i++) {
        const bar = dom.windBars[i];
        if (!bar) continue;
        bar.style.height = (heights[i] + wb*14*(i%2===0?1.3:0.8))+'px';
        bar.style.background = wb > 0.35 ? '#8a7c62' : '#9a8d76';
      }
      dom.windArrow.textContent = wind.direction > 0 ? '→' : '←';
      dom.windArrow.style.transform = wind.direction > 0 ? 'translateX(2px)' : 'translateX(-2px)';
      dom.windIndicator.style.transform = 'translateY(-50%) skewX(' + (wind.direction * -8) + 'deg)';
    }
  }
  function randomizeWind() {

  function drawGround(ctx) {
    const grad = ctx.createLinearGradient(0, groundY-40, 0, H);
    grad.addColorStop(0, 'rgba(140,125,95,0)');
    grad.addColorStop(0.3, 'rgba(140,125,95,0.08)');
    grad.addColorStop(1, 'rgba(120,105,80,0.16)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY-40, W, H-groundY+40);
    ctx.strokeStyle = 'rgba(80,68,50,0.22)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const y = groundY + Math.sin(x*0.02)*3 + Math.sin(x*0.005)*5;

    }
    ctx.stroke();
  }
  function drawMountains(ctx) {
    // Paint from back to front. Each layer fades its bottom into the paper
    // colour so layers blend without horizontal seam lines.
    drawMountainLayer(ctx, 0, groundY-90, 55, INK.paper, 0.55);
    drawMountainLayer(ctx, 1, groundY-40, 60, '#c8bda3', 0.6);
    drawMountainLayer(ctx, 2, groundY+30, 50, '#9a8c70', 0.7);
  }
  function drawMountainLayer(ctx, layer, baseY, amp, color, maxAlpha) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, baseY - amp);
    for (let x = 0; x <= W; x += 6) {
      const y = baseY
        - Math.sin(x*0.0028+layer*2.3)*(amp*0.7)
        - Math.sin(x*0.007+layer*1.1)*(amp*0.35)
        - Math.sin(x*0.015+layer*4)*amp*0.12
        - getMountainNoise(x, layer);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, baseY-amp, 0, baseY+amp*3);
    grad.addColorStop(0, color);
    grad.addColorStop(0.55, color);
    grad.addColorStop(1, INK.paper);
    ctx.fillStyle = grad;
    ctx.globalAlpha = maxAlpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // plantSpecies: 高层Command，展开为原子Command序列
  bus.register('plantSpecies', {

      if (typeof p.si !== 'number' || p.si < 0 || p.si >= species.length) return 'invalid si';

    },
    expand: function(p, ctx) {

      if (p.si === 4) {
        // 兰花：通过buildOrchidData生成原子Command
        var sp = species[p.si];

        for (var i = 0; i < data.leaves.length; i++) {

              angle: leaf.angle,
              length: leaf.length,
              seed: data.seed,
              opts: opts
            }
          });
        }

        for (var j = 0; j < data.flowers.length; j++) {
          var fl = data.flowers[j];

            type: 'addFlower',

              x: fl.x, y: fl.y,
              size: fl.size,
              isMain: fl.isMain,
              plantX: x, plantY: y, si: p.si,
              seed: data.seed,
              opts: opts
            }
          });
        }
      } else {
        // 非兰花：用一个addStem原子Command，内部创建Plant（保留旧构建路径）
        subs.push({
          type: 'addStem',
          params: {
            plantX: x, plantY: y, si: p.si,
            legacyPlant: true,
            seed: opts.seed,
            opts: opts
          }
        });
      }
      return subs;
    }
  });

  // addStem: 原子Command — 添加枝干/兰叶
  bus.register('addStem', {
    validate: function(p) {
      if (p.legacyPlant) {
        if (typeof p.plantX !== 'number' || typeof p.plantY !== 'number') return 'plantX,plantY required';
        if (typeof p.si !== 'number') return 'si required';
      } else {
        if (!Array.isArray(p.points) || p.points.length < 2) return 'points array required';
        if (typeof p.thickness !== 'number') return 'thickness required';
      }
      return null;
    },
    execute: function(p, ctx) {
      if (p.legacyPlant || p.si !== 4) {
        // 非兰花路径：创建完整Plant（保留旧构建）
        // v12.0 P3-fix: 传递完整 opts（heightMul/lean/stalkCount 等构图参数），而非仅 seed/instant
        var plantOpts = {};
        if (p.opts) {
          for (var k in p.opts) if (Object.prototype.hasOwnProperty.call(p.opts, k)) plantOpts[k] = p.opts[k];
        }
        if (p.seed !== undefined) plantOpts.seed = p.seed;
        if (p.opts) {
          if (p.opts.animate === false || p.opts.instant) plantOpts.instant = true;
        }
        // compose模式默认instant
        var isCompose = typeof urlParams !== 'undefined' && urlParams.get('compose') === '1';
        if (isCompose && p.opts && p.opts.animate !== true) plantOpts.instant = true;

        var np = new Plant(p.plantX, p.plantY, p.si, plantOpts);
        // 检查密度和上限（与plantAt一致）
        var nearby = 0;
        for (var i = 0; i < plants.length; i++) {
          if (plants[i].dying) continue;
          var dx = plants[i].x - p.plantX, dy = plants[i].y - p.plantY;
          if (dx*dx + dy*dy < 10000) nearby++;
        }
        if (nearby > 3) {
          return { success: false, error: 'Too dense' };
        }
        var aliveCount = 0;
        for (var j = 0; j < plants.length; j++) if (!plants[j].dying) aliveCount++;
        if (aliveCount >= MAX_PLANTS) {
          var oldest = null;
          for (var k = 0; k < plants.length; k++) {
            if (plants[k].dying) continue;
            if (!oldest || plants[k].age > oldest.age) oldest = plants[k];
          }
          if (oldest) { oldest.dying = true; createInkSplatter(oldest.x, oldest.y, oldest.species.color); }
        }
        plants.push(np);
        plantHistory.push(np);
        registerPlant(np);
        createInkSplatter(p.plantX, p.plantY, species[p.si].color);
        if (!hasPlanted) {
          hasPlanted = true;
          if (dom.hint) { dom.hint.style.opacity = '0'; setTimeout(function(){ dom.hint.style.display='none'; }, 600); }
        }
        return { undoData: { plantId: np._pid, isNew: true } };
      }

      // 兰花路径：addStem创建或追加到Plant
      // 查找同位置的兰花Plant（由同一组Command创建）
      var targetPlant = null;
      for (var pi = plants.length - 1; pi >= 0; pi--) {
        var pp = plants[pi];
        if (pp.species.name === '兰' && !pp.dying &&
            Math.abs(pp.x - p.plantX) < 2 && Math.abs(pp.y - p.plantY) < 2 &&
            pp._cmdBuilding) {
          targetPlant = pp;
          break;
        }
      }
      if (!targetPlant) {
        // 创建新Plant壳
        var plantOpts2 = { seed: p.seed, instant: true, _cmdBuilding: true };
        var isCompose2 = typeof urlParams !== 'undefined' && urlParams.get('compose') === '1';
        if (isCompose2 && p.opts && p.opts.animate !== true) plantOpts2.instant = true;
        else if (p.opts && (p.opts.animate === false || p.opts.instant)) plantOpts2.instant = true;
        targetPlant = new Plant(p.plantX, p.plantY, p.si, plantOpts2);
        targetPlant._cmdBuilding = true;
        targetPlant.branches = [];
        targetPlant._cmdFlowers = [];
        // 密度检查
        var nearby2 = 0;
        for (var ni = 0; ni < plants.length; ni++) {
          if (plants[ni].dying) continue;
          var ndx = plants[ni].x - p.plantX, ndy = plants[ni].y - p.plantY;
          if (ndx*ndx + ndy*ndy < 10000) nearby2++;
        }
        if (nearby2 > 3) return { success: false, error: 'Too dense' };
        var ac = 0;
        for (var aj = 0; aj < plants.length; aj++) if (!plants[aj].dying) ac++;
        if (ac >= MAX_PLANTS) {
          var old2 = null;
          for (var ak = 0; ak < plants.length; ak++) {
            if (plants[ak].dying) continue;
            if (!old2 || plants[ak].age > old2.age) old2 = plants[ak];
          }
          if (old2) { old2.dying = true; createInkSplatter(old2.x, old2.y, old2.species.color); }
        }
        plants.push(targetPlant);
        plantHistory.push(targetPlant);
        registerPlant(targetPlant);
        createInkSplatter(p.plantX, p.plantY, species[p.si].color);
        if (!hasPlanted) {
          hasPlanted = true;
          if (dom.hint) { dom.hint.style.opacity = '0'; setTimeout(function(){ dom.hint.style.display='none'; }, 600); }
        }
      }
      // 追加branch
      var branch = {
        id: p.branchId !== undefined ? p.branchId : targetPlant.branches.length,
        kind: p.kind || 'leaf',
        points: p.points,
        angle: p.angle || 0,
        length: p.length || 0,
        width: p.thickness,
        depth: 0,
        children: [],
        hasLeaf: false,
        leafTone: p.inkTone || 'nong'
      };
      targetPlant.branches.push(branch);
      targetPlant.maxGrowth = targetPlant.branches.length;
      if (targetPlant.growth < targetPlant.maxGrowth) targetPlant.growth = targetPlant.maxGrowth;
      // 最后一个addStem后由addFlower负责标记_cmdBuilding=false
      return { undoData: { plantId: targetPlant._pid, branchIndex: targetPlant.branches.length - 1, isNewPlant: targetPlant.branches.length === 1 } };
    },
    undo: function(undoData) {
      var p = getPlant(undoData.plantId);
      if (!p) return;
      // v5.0: 兰花由复合Command创建，undo时整株移除（不逐叶删）
      if (p._cmdFlowers !== undefined && p.species.name === '兰' && undoData.compositeRoot) {
        p.dying = true;
        createInkSplatter(p.x, p.y, p.species.color);
        var hi = plantHistory.indexOf(p);

        p.branches.splice(undoData.branchIndex, 1);

        // 移除整个Plant
        p.dying = true;
        createInkSplatter(p.x, p.y, p.species.color);
