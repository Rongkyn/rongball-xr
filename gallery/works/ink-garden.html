<!DOCTYPE html><!-- 墨园 v5.2 · Command Bus · 人-Agent统一通道 · 竹子笔意打磨（竿力/叶丰/节劲/墨韵） --><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>墨园 · Ink Garden</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root {

<body>
<canvas id="scene"></canvas>
<canvas id="sealCanvas"></canvas>

<button id="galleryBtn" title="绒球画集">集</button>

<div id="galleryModal">

    </div>

      <div class="gm-grid" id="gmGrid"></div>
    </div>
  </div>
</div>

<div id="titleBlock">
  <h1>墨园</h1>
  <div class="en">INK&nbsp;&nbsp;GARDEN</div>
</div>

<div id="stats">
  <div>草木 <span class="count" id="plant-count">0</span></div>
  <div class="time" id="time-display"></div>
</div>

<div id="toast"></div>

<div id="wind-indicator" title="点击调风">
  <div id="wind-arrow">→</div>
  <div class="wind-bar" id="wb1" style="height:12px"></div>
  <div class="wind-bar" id="wb2" style="height:18px"></div>
  <div class="wind-bar" id="wb3" style="height:24px"></div>
  <div class="wind-bar" id="wb4" style="height:18px"></div>
  <div class="wind-bar" id="wb5" style="height:12px"></div>
  <div id="wind-label">风</div>
</div>

  <div id="plantBar">
    <button class="pbtn active" data-plant="0" data-label="竹"><span>竹</span></button>

    <button class="pbtn" data-plant="2" data-label="柳"><span>柳</span></button>
    <button class="pbtn" data-plant="3" data-label="梅"><span>梅</span></button>
    <button class="pbtn" data-plant="4" data-label="兰"><span>兰</span></button>
    <button class="pbtn" data-plant="5" data-label="枯枝"><span>枯</span></button>
    <button class="pbtn" data-plant="random" data-label="随"><span>随</span></button>

    <button class="pbtn icon-btn" id="btn-undo" title="撤销" data-label="撤"><span>撤</span></button>
    <button class="pbtn icon-btn" id="btn-clear" title="清园" data-label="清"><span>清</span></button>
    <button class="pbtn icon-btn" id="btn-wind" title="调风" data-label="风"><span>风</span></button>
    <button class="pbtn icon-btn" id="btn-save" title="留影" data-label="影"><span>影</span></button>
  </div>
  <div id="barFade"></div>
</div>

<script>
(function() {
  'use strict';
  // 出画模式：?gallery=1 隐藏所有UI
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('gallery') === '1') {
    document.body.classList.add('gallery-mode');
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const sealCv = document.getElementById('sealCanvas');
  const sealCtx = sealCv.getContext('2d');
  let W, H;
  const dom = {
    plantCount: document.getElementById('plant-count'),
    timeDisplay: document.getElementById('time-display'),
    toast: document.getElementById('toast'),
    btnClear: document.getElementById('btn-clear'),
    btnUndo: document.getElementById('btn-undo'),
    btnWind: document.getElementById('btn-wind'),
    btnSave: document.getElementById('btn-save'),
    windIndicator: document.getElementById('wind-indicator'),
    windArrow: document.getElementById('wind-arrow'),
    windBars: [1,2,3,4,5].map(i => document.getElementById('wb'+i)),
    hint: document.getElementById('hint'),
  };
  const INK = {
    jiao:'#1a1612',
    nong:'#2e2820',
    zhong:'#443a30',
    dan:'#6b5e4c',
    qing:'#9a8d76',
    rouge:'#9a3a35',
    paper:'#e8dfc8',
  };

  // ─── Brush Engine (v4.0) · stamp铺贴毛笔触感 ───
  function createBrushStamp(size, opts) {
    opts = opts || {};
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var cx2 = c.getContext('2d');
    var elongation = opts.elongation !== undefined ? opts.elongation : 2.2;
    var feather = opts.feather !== undefined ? opts.feather : 0.35;
    var dryness = opts.dryness !== undefined ? opts.dryness : 0.3;
    var img = cx2.createImageData(size, size);
    var hx = size / 2, hy = size / 2;
    for (var y = 0; y < size; y++) {
      for (var x = 0; x < size; x++) {
        var dx = (x - hx) / hx;
        var dy = (y - hy) / hy * elongation;
        var d = Math.sqrt(dx * dx + dy * dy);
        var idx = (y * size + x) * 4;
        if (d < 1) {
          var a = Math.pow(1 - d, 1.2) * 240;
          if (d > 0.2) {
            var seed = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            var r = seed - Math.floor(seed);
            if (r < dryness * (d - 0.2) * 1.5) a *= 0.15 + r * 0.3;
          }
          if (d > 1 - feather) a *= Math.pow((1 - d) / feather, 0.7);
          img.data[idx] = 26;
          img.data[idx + 1] = 22;
          img.data[idx + 2] = 18;
          img.data[idx + 3] = Math.min(255, Math.max(0, a));
        }
      }
    }
    cx2.putImageData(img, 0, 0);
    return c;
  }

  function brushPath(ctx, pts, stamp, pressureFn, opts) {
    opts = opts || {};
    var opacity = opts.opacity !== undefined ? opts.opacity : 0.55;
    var spacing = opts.spacing !== undefined ? opts.spacing : 0.18;
    if (!pts || pts.length < 2) return;
    // 累计弧长，用于按弧长参数 t (0..1) 均匀采样压力
    var segLens = [];
    var total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dl = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(dl);
      total += dl;
    }
    if (total < 0.5) return;
    var acc = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p = pts[i], n = pts[i + 1];
      var dist = segLens[i];
      if (dist < 0.001) continue;
      var t0 = acc / total;
      var t1 = (acc + dist) / total;
      var pr0 = pressureFn(t0);
      var w0 = pr0.width;
      var step = Math.max(1, w0 * spacing);
      var sub = Math.ceil(dist / step);
      var angle = Math.atan2(n.y - p.y, n.x - p.x) + Math.PI / 2;
      for (var s = 0; s < sub; s++) {
        var f = s / sub;
        var x = p.x + (n.x - p.x) * f;
        var y = p.y + (n.y - p.y) * f;
        var t = t0 + (t1 - t0) * f;
        var pr = pressureFn(t);
        var w = pr.width;
        var a = pr.opacity * opacity;
        if (w < 0.3) continue;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = a;
        var sz = Math.max(3, w * 1.5);
        ctx.drawImage(stamp, -sz / 2, -sz / 2, sz, sz);
        ctx.restore();
      }
      acc += dist;
    }
  }

  // ─── Brush Path with Feibai (v4.3) · 离屏刮白飞白 ───
  // 在offscreen canvas绘制笔触后，用destination-out刮出丝状留白
  function brushPathFeibai(mainCtx, pts, stampWet, stampDry, pressureFn, opts) {
    opts = opts || {};
    var opacity = opts.opacity !== undefined ? opts.opacity : 0.85;
    var feibai = opts.feibai || 0.6;
    var numStreaks = opts.streaks || 8;
    var dryStart = opts.dryStart || 0.42;
    var tremor = opts.tremor || 0;
    var seed = opts.seed || 42;
    if (!pts || pts.length < 2) return;
    var rng = (function(s) {
      return function() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    })(seed % 2147483647 || 1);

    // Bounding box
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < pts.length; i++) {
      minX = Math.min(minX, pts[i].x); maxX = Math.max(maxX, pts[i].x);
      minY = Math.min(minY, pts[i].y); maxY = Math.max(maxY, pts[i].y);
    }
    var pad = 15;
    var bw = maxX - minX + pad * 2, bh = maxY - minY + pad * 2;
    var bx = minX - pad, by = minY - pad;

    var offCanvas = document.createElement('canvas');
    offCanvas.width = Math.ceil(bw * dpr);
    offCanvas.height = Math.ceil(bh * dpr);
    var off = offCanvas.getContext('2d');
    off.setTransform(dpr, 0, 0, dpr, 0, 0);

    var segLens = [], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dl = Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
      segLens.push(dl); total += dl;
    }
    if (total < 0.5) return;

    // Pass 1: draw stroke
    var acc = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p = pts[i], n = pts[i+1], dist = segLens[i];
      if (dist < 0.001) continue;
      var t0 = acc / total, t1 = (acc + dist) / total;
      var angle = Math.atan2(n.y - p.y, n.x - p.x) + Math.PI / 2;
      var pr0 = pressureFn(t0);
      var step = Math.max(1, pr0.width * 0.16);
      var sub = Math.ceil(dist / step);
      for (var s = 0; s < sub; s++) {
        var f = s / sub, t = t0 + (t1 - t0) * f, pr = pressureFn(t);
        var w = pr.width, a = pr.opacity * opacity;
        var dryFactor = t < dryStart ? 0 : Math.min(1, (t - dryStart) / (1 - dryStart));
        var useStamp = dryFactor > 0.4 ? stampDry : stampWet;
        a *= (1 - dryFactor * 0.15);
        var tx = 0, ty = 0;
        if (tremor > 0) {
          var px = -Math.sin(angle - Math.PI/2), py = Math.cos(angle - Math.PI/2);
          tx = px * (rng() - 0.5) * tremor * 1.0;
          ty = py * (rng() - 0.5) * tremor * 1.0;
        }
        if (w < 0.3) continue;
        off.save();
        off.translate(p.x - bx + (n.x - p.x) * f + tx, p.y - by + (n.y - p.y) * f + ty);
        off.rotate(angle);
        off.globalAlpha = a;
        var sz = Math.max(3, w * 1.5);
        off.drawImage(useStamp, -sz/2, -sz/2, sz, sz);
        off.restore();
      }

          const t = count === 1 ? 0.5 : n/(count-1);
          const na = baseDir - spread/2 + t*spread + (this.rand(b.id+c*20+n)-0.5)*0.08;
          const nl = nlen*(0.75+this.rand(b.id+c*30+n)*0.35);
          ctx.globalAlpha = (0.55+this.rand(b.id+c*40+n)*0.3)*leafAlpha;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx+Math.cos(na)*nl, cy+Math.sin(na)*nl);
          ctx.stroke();
        }
      }
      if (this.rand(b.id*23) > 0.4) {
        ctx.strokeStyle = INK.dan;
        ctx.lineWidth = 0.4;
        for (let n = 0; n < 4; n++) {
          const na = b.angle + (this.rand(b.id*25+n)-0.5)*1.4;
          ctx.globalAlpha = 0.3*leafAlpha;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx+Math.cos(na)*nlen*0.8, ly+Math.sin(na)*nlen*0.8);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawPlumBlossom(ctx, b, lx, ly, sway, leafAlpha) {
      const isRed = b.id === this.redBlossomId;
      const isBud = this.rand(b.id*17) < 0.25;
      const sz = 1.5 + this.rand(b.id*3)*1.0;
      const toneRoll = this.rand(b.id*21);
      let petalStyle;
      if (isRed) petalStyle = 'rouge';
      else if (toneRoll < 0.25) petalStyle = 'nong';
      else petalStyle = 'qing';
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(sway*0.2);
      if (isBud) {
        ctx.fillStyle = isRed ? INK.rouge : (petalStyle==='nong'?INK.nong:INK.dan);
        ctx.globalAlpha = (isRed?0.7:0.5)*leafAlpha;
        ctx.beginPath();
        ctx.arc(0, 0, sz*0.7, 0, Math.PI*2);
        ctx.fill();
      } else {
        const dist = sz*1.1;
        for (let p = 0; p < 5; p++) {
          const pa = (p/5)*Math.PI*2 - Math.PI/2;
          const px = Math.cos(pa)*dist, py = Math.sin(pa)*dist;
          if (petalStyle === 'rouge') {
            ctx.fillStyle = INK.rouge;
            ctx.globalAlpha = 0.65*leafAlpha;
            ctx.beginPath();
            ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
            ctx.fill();
          } else if (petalStyle === 'nong') {
            ctx.fillStyle = INK.nong;
            ctx.globalAlpha = 0.45*leafAlpha;
            ctx.beginPath();
            ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
            ctx.fill();
          } else {
            const roll = this.rand(b.id*20+p);
            if (roll < 0.6) {
              ctx.strokeStyle = INK.qing;
              ctx.globalAlpha = 0.4*leafAlpha;
              ctx.lineWidth = 0.5;
              ctx.beginPath();
              ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
              ctx.stroke();
            } else {
              ctx.fillStyle = INK.dan;
              ctx.globalAlpha = 0.3*leafAlpha;
              ctx.beginPath();
              ctx.arc(px, py, sz*0.75, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }
        ctx.fillStyle = INK.jiao;
        ctx.globalAlpha = 0.7*leafAlpha;
        for (let s = 0; s < 5; s++) {
          const sa = (s/5)*Math.PI*2;
          ctx.beginPath();
          ctx.arc(Math.cos(sa)*sz*0.3, Math.sin(sa)*sz*0.3, 0.5, 0, Math.PI*2);
          ctx.fill();
        }
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    draw(ctx, wind, time, layer) {
      const sp = this.species;
      const visCount = Math.min(Math.floor(this.growth)+1, this.branches.length);
      const rgb = sp.rgb;
      const useShadow = layer.detail && sp.baseWidth >= 6 && sp.name !== '竹' && sp.name !== '兰';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 0; i < visCount; i++) {
        const b = this.branches[i];
        const partial = i === visCount-1 ? (this.growth - Math.floor(this.growth)) : 1;
        const pts = b.points;
        if (pts.length < 2) continue;
        const swayFactor = 1 - b.depth/sp.maxDepth;
        const effWind = wind.strength + wind.gust;
        const wave1 = Math.sin(time*0.001 + b.id*0.3 + this.seed*0.01);
        const wave2 = Math.sin(time*0.0027 + b.id*0.5 + this.seed*0.02)*0.5;
        const windAmp = sp.name === '柳' ? 7 : (sp.name === '兰' ? 5 : 4);
        const windX = (wave1+wave2)*effWind*windAmp*swayFactor*wind.direction;
        const windY = Math.cos(time*0.0013+b.id*0.2)*effWind*1.2*swayFactor;
        const droop = this.dying ? (1-this.fade)*6*(1-b.depth/sp.maxDepth) : 0;
        const depthFactor = b.depth / sp.maxDepth;
        const inkMix = Math.min(1, 0.25 + depthFactor*0.4 + layer.inkMix);
        const alpha = (0.65+(1-depthFactor)*0.35)*(1-layer.inkMix*0.3)*this.fade;
        const cr = Math.floor(rgb.r + (190-rgb.r)*inkMix);
        const cg = Math.floor(rgb.g + (180-rgb.g)*inkMix);
        const cb = Math.floor(rgb.b + (160-rgb.b)*inkMix);
        const strokeColor = 'rgba('+cr+','+cg+','+cb+','+alpha+')';
        if (useShadow && b.depth <= 2) {
          ctx.shadowColor = 'rgba(26,22,18,0.18)';
          ctx.shadowBlur = 4;
        } else {
          ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        }
        const dpts = [];
        const lim = Math.max(2, Math.ceil(pts.length*partial));
        for (let k = 0; k < lim; k++) {
          const wf = (1 - k/(pts.length-1))*swayFactor;
          dpts.push({
            x: pts[k].x + windX*wf,
            y: pts[k].y + (windY + droop)*wf
          });
        }
        if (sp.name === '竹' && b.kind === 'stalk') {
          this.drawBambooStalk(ctx, b, dpts, strokeColor, alpha, layer);
        } else if (sp.name === '松' && b.kind === 'branch') {
          this.drawPineBranch(ctx, b, dpts, strokeColor, alpha, layer, pts, partial);
        } else if (sp.name === '柳') {
          this.drawWillowBranch(ctx, b, dpts, strokeColor, alpha, layer, time, windX, windY, swayFactor, this.fade);
        } else if (sp.name === '兰' && b.kind === 'leaf') {
          this.drawOrchidLeaf(ctx, b, dpts, alpha);
        } else {
          this.drawGenericBranch(ctx, b, dpts, strokeColor, alpha, layer, sp, pts, partial);
        }
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        if (b.hasLeaf && partial >= 0.8 && layer.detailAlpha > 0.05
            && !(sp.name === '柳' && b.kind !== 'droop')) {
          const tip = dpts[dpts.length-1];
          const lx = tip.x, ly = tip.y;
          const sway = Math.sin(time*0.002+b.id+this.seed)*0.15;
          const leafAlpha = this.fade * layer.detailAlpha;
          if (sp.name === '松') {
            this.drawPineNeedles(ctx, b, lx, ly, sway, leafAlpha);
            if (b.depth <= 2 && dpts.length >= 5) {
              for (let mi = 2; mi < dpts.length-2; mi += 2) {
                if (this.rand(b.id*100+mi) > 0.45) continue;
                const mp = dpts[mi];
                this.drawPineNeedles(ctx, b, mp.x, mp.y, sway, leafAlpha*0.8, 0.65);
              }
            }
          } else if (sp.name === '竹') {
            // 竹叶沿侧枝错落生长，不只堆在梢头：梢头一组+枝中1-2组
            this.drawBambooLeaves(ctx, b, lx, ly, sway, leafAlpha, 1.0);
            if (b.depth <= 2 && dpts.length >= 5) {
              const midCount = b.depth===2 ? 1 : 2;
              for (let mi=0; mi<midCount; mi++){
                const t = 0.35 + mi*0.3;
                const idx = Math.max(1, Math.min(dpts.length-2, Math.round(t*(dpts.length-1))));
                const mp = dpts[idx];
                if (this.rand(b.id*100+idx) > 0.35) continue;
                this.drawBambooLeaves(ctx, b, mp.x, mp.y, sway, leafAlpha*0.8, 0.7);
              }
            }
          } else if (sp.name === '梅') {
            this.drawPlumBlossom(ctx, b, lx, ly, sway, leafAlpha);
            if (b.depth <= 3 && dpts.length >= 4) {
              let lastBx = lx, lastBy = ly;
              for (let mi = 1; mi < dpts.length-1; mi += 2) {
                if (this.rand(b.id*100+mi) > 0.35) continue;
                const mp = dpts[mi];
                const ddx = mp.x-lastBx, ddy = mp.y-lastBy;
                if (Math.sqrt(ddx*ddx+ddy*ddy) < 20) continue;
                this.drawPlumBlossom(ctx, b, mp.x, mp.y, sway, leafAlpha*0.85);
                lastBx = mp.x; lastBy = mp.y;
              }
            }
          }
        }
      }
      if (sp.name === '兰' && this.growth >= this.maxGrowth*0.8 && layer.detailAlpha > 0.1) {
        this.drawOrchidFlowers(ctx, time, this.fade*layer.detailAlpha);
      }
      ctx.globalAlpha = 1;
    }
    drawBambooStalk(ctx, b, dpts, strokeColor, alpha, layer) {
      // v5.2 宋画竹竿（吴镇篆隶笔意）：根粗梢细压感笔道；鹊爪竹节焦墨顿挫、
      // 上环粗重弧、下环短横顿挫、两端爪笔可见；主竿浓墨、辅竿淡墨。
      if (dpts.length < 2) return;
      const pw0 = Math.max(1.0, b.width * layer.scale);
      // v5.2: 主竿浓墨（opacity 0.80），辅竿淡墨（opacity 0.55）
      const stalkTone = b.stalkTone || (b.isMain === false ? 'dan' : 'nong');
      const stalkOpacity = stalkTone === 'dan' ? 0.55 : 0.82;
      // 竿身：从根到梢有明显粗细变化（根粗梢细），用brushPath压感
      // 把段间点细分，使stamp铺贴更平滑
      const fine = [];
      for (let k = 0; k < dpts.length-1; k++) {
        const a = dpts[k], c = dpts[k+1];
        const sub = 8;
        for (let s = 0; s < sub; s++) {
          const t = s/sub;
          fine.push({x:a.x+(c.x-a.x)*t, y:a.y+(c.y-a.y)*t});
        }
      }
      fine.push(dpts[dpts.length-1]);
      // 压感：root→中段保持饱满→tip收细；起笔藏锋（略粗）
      const stalkPressure = (maxW) => (t) => {
        let w;
        if (t < 0.08) w = maxW * (0.88 + 0.12*(t/0.08));      // 起笔藏锋
        else if (t < 0.72) w = maxW * (1.0 - 0.16*((t-0.08)/0.64)); // 中段匀（略减）
        else w = maxW * (0.84 * (1 - (t-0.72)/0.28));         // 梢端收细
        return { width: Math.max(0.4, w), opacity: 0.95 };
      };
      ctx.save();
      ctx.globalAlpha = alpha;
      brushPath(ctx, fine, stamp, stalkPressure(pw0), { opacity: stalkOpacity, spacing: 0.12 });
      ctx.restore();
      // 竹节（鹊爪）：每个内部节点处一道焦墨粗环 + 上下两小笔顿挫，墨色明显加深
      if (b.nodes && layer.detail) {
        for (const ni of b.nodes) {
          if (ni <= 0 || ni >= dpts.length-1) continue;
          const p = dpts[ni];
          const prev = dpts[ni-1], next = dpts[ni+1];
          const dx = next.x-prev.x, dy = next.y-prev.y;
          const ln = Math.hypot(dx,dy)||1;
          const ux = dx/ln, uy = dy/ln;        // 沿竿方向
          const nx = -uy, ny = ux;             // 垂直竿方向
          // 节处竿宽（根粗梢细）
          const tpos = ni/(dpts.length-1);
          const nodeW = pw0 * (1.0 - 0.25*tpos);
          const hw = nodeW * 0.92;
          // v5.2: 节用焦墨(#1a1612)，明显比竿身深
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          // 上环（鹊爪上挑）：向上游方向微凸的短弧，粗重有隶意
          ctx.strokeStyle = 'rgba(20,16,12,'+(0.92*alpha)+')';
          ctx.lineWidth = Math.max(2.6, nodeW*0.20);
          ctx.beginPath();
          ctx.moveTo(p.x - nx*hw - ux*nodeW*0.22, p.y - ny*hw - uy*nodeW*0.22);
          ctx.quadraticCurveTo(
            p.x + ux*nodeW*0.16, p.y + uy*nodeW*0.16,
            p.x + nx*hw - ux*nodeW*0.06, p.y + ny*hw - uy*nodeW*0.06);
          ctx.stroke();
          // 下环（顿挫）：较直的一道短横，略短，有顿挫粗细
          ctx.strokeStyle = 'rgba(20,16,12,'+(0.80*alpha)+')';
          ctx.lineWidth = Math.max(1.8, nodeW*0.14);
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.moveTo(p.x - nx*hw*0.88 + ux*nodeW*0.12, p.y - ny*hw*0.88 + uy*nodeW*0.12);
          ctx.lineTo(p.x + nx*hw*0.88 + ux*nodeW*0.12, p.y + ny*hw*0.88 + uy*nodeW*0.12);
          ctx.stroke();
          // 鹊爪顿挫：两端向梢部挑出的两小笔，可见但不夸张
          ctx.strokeStyle = 'rgba(20,16,12,'+(0.70*alpha)+')';
          ctx.lineWidth = Math.max(1.4, nodeW*0.16);
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(p.x + nx*hw*0.78*side + ux*nodeW*0.10, p.y + ny*hw*0.78*side + uy*nodeW*0.10);
            ctx.quadraticCurveTo(
              p.x + nx*hw*0.92*side - ux*nodeW*0.12, p.y + ny*hw*0.92*side - uy*nodeW*0.12,
              p.x + nx*hw*0.98*side - ux*nodeW*0.40, p.y + ny*hw*0.98*side - uy*nodeW*0.40);
            ctx.stroke();
          }
          ctx.globalAlpha = alpha;
        }
      }
      ctx.globalAlpha = 1;
    }
    drawPineBranch(ctx, b, dpts, strokeColor, alpha, layer, pts, partial) {
      const pw = Math.max(0.6, b.width*0.5*layer.scale);
      ctx.strokeStyle = strokeColor;
      ctx.lineCap = 'round';
      const total = dpts.length - 1;
      for (let k = 0; k < total; k++) {
        const t = k / total;
        const w = Math.max(0.4, pw * (1 - t*0.3));
        ctx.lineWidth = w;
        ctx.globalAlpha = alpha * (0.85 + (1-t)*0.15);
        ctx.beginPath();
        ctx.moveTo(dpts[k].x, dpts[k].y);
        ctx.lineTo(dpts[k+1].x, dpts[k+1].y);
        ctx.stroke();
        if (this.rand(b.id*7+k*13) < 0.15 && total > 2) {
          ctx.globalAlpha = alpha * (0.25 + this.rand(b.id*8+k*17)*0.35);
          ctx.lineWidth = w * 0.35;
          const mx = (dpts[k].x+dpts[k+1].x)/2;
          const my = (dpts[k].y+dpts[k+1].y)/2;
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(mx, my);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = alpha;
      if (b.width >= 4 && layer.detail && dpts.length >= 3) {
        ctx.strokeStyle = 'rgba(26,22,18,'+(0.35*alpha)+')';
        ctx.lineWidth = Math.max(0.6, pw*0.18);
        for (let k = 1; k < dpts.length-1; k++) {
          if (this.rand(b.id*50+k) > 0.4) continue;
          const p = dpts[k], prev = dpts[k-1], next = dpts[k+1];
          const dx = next.x-prev.x, dy = next.y-prev.y;
          const ln = Math.hypot(dx,dy)||1;
          const nx = -dy/ln, ny = dx/ln;
          const sz = pw*(0.5+this.rand(b.id*60+k)*0.5);
          ctx.beginPath();
          ctx.moveTo(p.x-nx*sz, p.y-ny*sz);
          ctx.quadraticCurveTo(p.x, p.y, p.x+nx*sz, p.y+ny*sz);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(26,22,18,'+(0.3*alpha)+')';
        for (let k = 0; k < dpts.length; k += 2) {
          if (this.rand(b.id*70+k) > 0.2) continue;
          const p = dpts[k];
          ctx.beginPath();
          ctx.arc(p.x+(this.rand(b.id*80+k)-0.5)*pw, p.y+(this.rand(b.id*90+k)-0.5)*pw,
                  0.6+this.rand(b.id*95+k)*1.2, 0, Math.PI*2);
          ctx.fill();
        }
      }
      if (b.depth <= 1 && partial >= 0.7 && dpts.length >= 3) {
        const startIdx = Math.max(1, Math.floor(dpts.length*0.7));
        if (startIdx < dpts.length-1) {
          ctx.save();
          ctx.shadowColor='transparent'; ctx.shadowBlur=0;
          ctx.globalAlpha = alpha*0.4;
          ctx.setLineDash([2+this.rand(b.id*7+41)*3, 2+this.rand(b.id*7+42)*4]);
          ctx.lineDashOffset = this.rand(b.id*7+43)*20;
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = pw*0.7;
          ctx.beginPath();
          ctx.moveTo(dpts[startIdx].x, dpts[startIdx].y);
          for (let j = startIdx+1; j < dpts.length; j++) ctx.lineTo(dpts[j].x, dpts[j].y);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawWillowBranch(ctx, b, dpts, strokeColor, alpha, layer, time, windX, windY, swayFactor, fade) {
      const pw = Math.max(0.5, b.width*0.5*layer.scale);
      if (b.kind === 'droop') {
        ctx.strokeStyle = strokeColor;
        ctx.lineCap = 'round';
        const total = dpts.length - 1;
        for (let k = 0; k < total; k++) {
          const t = k / total;
          const w = Math.max(0.3, pw * (1 - t*0.35));
          ctx.lineWidth = w;
          ctx.globalAlpha = alpha * (0.7 + (1-t)*0.3);
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(dpts[k+1].x, dpts[k+1].y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        if (layer.detail && dpts.length >= 4) {
          ctx.fillStyle = 'rgba(107,94,76,'+(0.5*fade)+')';
          for (let k = 2; k < dpts.length-1; k += 2) {
            if (this.rand(b.id*30+k) > 0.6) continue;
            const p = dpts[k];
            const lsz = 1.5 + this.rand(b.id*40+k)*1.0;
            const ox = (this.rand(b.id*50+k)-0.5)*3;
            const oy = (this.rand(b.id*60+k)-0.5)*2;
            ctx.globalAlpha = (0.35+this.rand(b.id*70+k)*0.3)*fade;
            ctx.beginPath();
            ctx.ellipse(p.x+ox, p.y+oy, lsz*0.6, lsz, 0, 0, Math.PI*2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = pw;
        ctx.beginPath();
        ctx.moveTo(dpts[0].x, dpts[0].y);
        if (dpts.length > 2) {
          for (let k = 1; k < dpts.length-1; k++) {
            const xc = (dpts[k].x+dpts[k+1].x)/2, yc = (dpts[k].y+dpts[k+1].y)/2;
            ctx.quadraticCurveTo(dpts[k].x, dpts[k].y, xc, yc);
          }
          ctx.lineTo(dpts[dpts.length-1].x, dpts[dpts.length-1].y);
        } else {
          ctx.lineTo(dpts[1].x, dpts[1].y);
        }
        ctx.stroke();
        if (b.width >= 3 && layer.detail) {
          ctx.strokeStyle = 'rgba(26,22,18,'+(0.25*alpha)+')';
          ctx.lineWidth = Math.max(0.4, pw*0.15);
          for (let k = 1; k < dpts.length-1; k++) {
            if (this.rand(b.id*80+k) > 0.5) continue;
            const p = dpts[k], prev = dpts[k-1], next = dpts[k+1];
            const dx = next.x-prev.x, dy = next.y-prev.y;
            const ln = Math.hypot(dx,dy)||1;
            const nx = -dy/ln, ny = dx/ln;
            const sz = pw*(0.4+this.rand(b.id*85+k)*0.4);
            ctx.beginPath();
            ctx.moveTo(p.x-nx*sz, p.y-ny*sz);
            ctx.quadraticCurveTo(p.x, p.y, p.x+nx*sz, p.y+ny*sz);
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    }
    drawOrchidLeaf(ctx, b, dpts, alpha) {
      if (dpts.length < 2) return;
      // 老叶焦浓(nong)用浓stamp，中叶重墨(zhong)，嫩叶淡墨(dan)用干笔stamp带飞白
      const tone = b.leafTone || 'nong';
      let leafColor, useStamp, baseOpacity;
      let feibaiAmt = 0.55, dryStart = 0.42, streaks = 7;
      if (tone === 'dan') {
        leafColor = INK.zhong; useStamp = stampDry; baseOpacity = 0.7;
        feibaiAmt = 0.75; dryStart = 0.35; streaks = 9; // 嫩叶更干
      } else if (tone === 'nong') {
        leafColor = INK.jiao; useStamp = stamp; baseOpacity = 0.9;
        feibaiAmt = 0.4; dryStart = 0.50; streaks = 6; // 主叶较润
      } else {
        leafColor = INK.nong; useStamp = stamp; baseOpacity = 0.8;
        feibaiAmt = 0.55; dryStart = 0.45; streaks = 7;
      }
      const maxW = b.width;
      // 飞白笔触：离屏绘制+刮白
      brushPathFeibai(ctx, dpts, stamp, stampDry, makeOrchidPressure(maxW), {
        opacity: baseOpacity * alpha,
        feibai: feibaiAmt,
        streaks: streaks,
        dryStart: dryStart,
        tremor: 0.08,
        seed: (b.id || 1) * 31 + 7
      });
      // 叶根：用一笔短粗的入锋藏锋，而非机械圆点

    drawOrchidFlowers(ctx, time, alpha) {

      if (leaves.length < 2) return;
      // v5.0: 优先使用Command指定的花数据
      let flowerList;
      if (this._cmdFlowers && this._cmdFlowers.length > 0) {
        flowerList = this._cmdFlowers;
      } else {
        leaves.sort(function(a,b){ return b.length - a.length; });
        const flowerCount = 2 + (this.rand(55) > 0.4 ? 1 : 0) + (this.rand(59) > 0.7 ? 1 : 0);
        flowerList = [];
        for (let fi = 0; fi < flowerCount; fi++) {
          const leafIdx = fi < leaves.length ? fi : (fi % leaves.length);
          const leaf = leaves[leafIdx];
          if (!leaf || leaf.points.length < 5) continue;
          const idx = Math.floor(leaf.points.length * (0.28 + this.rand(56+fi)*0.25));
          const p = leaf.points[idx];
          const isMain = fi === 0;

          flowerList.push({ x: p.x, y: p.y, size: fsz, isMain: isMain });
        }
      }
      for (let fi = 0; fi < flowerList.length; fi++) {
        const fl = flowerList[fi];
        const p = { x: fl.x, y: fl.y };
        const sway = Math.sin(time*0.002+fi)*0.04;
        const isMain = fl.isMain !== false;
        const fsz = fl.size || (isMain ? 7.5 : 5.0);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(sway);
        const petalAngles = isMain
          ? [-Math.PI*0.10, Math.PI*0.42, -Math.PI*0.48, Math.PI*0.75, -Math.PI*0.78]
          : [0, Math.PI*0.45, -Math.PI*0.45, Math.PI*0.85, -Math.PI*0.85];
        for (let pet = 0; pet < 5; pet++) {
          const pa = petalAngles[pet] + (this.rand(60+pet+fi)-0.5)*0.08;
          const pLen = fsz * (pet < 3 ? 1.0 : 0.55);
          const pWid = fsz * (pet < 3 ? 0.45 : 0.35);
          const petalColor = isMain ? (pet < 3 ? INK.zhong : INK.dan) : (pet < 3 ? INK.dan : INK.qing);
          const petalAlpha = (isMain ? (pet < 3 ? 0.60 : 0.45) : (pet < 3 ? 0.50 : 0.38)) * alpha;
          ctx.save();

          ctx.rotate(pa);

          for (let si = 0; si <= segs; si++) {

            if (st < 0.2) profile = (st/0.2)*0.6;
            else if (st < 0.6) profile = 0.6 + 0.4*Math.sin((st-0.2)/0.4*Math.PI*0.5);
            else profile = 1.0 - (st-0.6)/0.4*0.6;
            const pw = pWid * profile;
            const px = pLen * st * 0.75;
            ctx.globalAlpha = petalAlpha * (0.4 + 0.6*profile);
            const psz = Math.max(2.5, pw*2.4);
            ctx.drawImage(stampSmall, px-psz/2, -psz/2, psz, psz);
          }
          ctx.restore();
        }
        ctx.fillStyle = INK.rouge;
        ctx.globalAlpha = 0.75*alpha;
        ctx.beginPath();

        ctx.fill();

    drawGenericBranch(ctx, b, dpts, strokeColor, alpha, layer, sp, pts, partial) {

      ctx.strokeStyle = strokeColor;
      ctx.lineCap = 'round';
      const total = dpts.length - 1;

        ctx.lineWidth = w;

          ctx.lineWidth = w * 0.35;
          const mx = (dpts[k].x+dpts[k+1].x)/2;
          const my = (dpts[k].y+dpts[k+1].y)/2;
          ctx.beginPath();
          ctx.moveTo(dpts[k].x, dpts[k].y);
          ctx.lineTo(mx, my);
          ctx.stroke();

      }
      ctx.globalAlpha = alpha;
      if (sp.name === '梅' && b.width >= 3 && layer.detail) {
        ctx.fillStyle = 'rgba(26,22,18,'+(0.4*alpha)+')';
        for (let k = 1; k < dpts.length-1; k += 2) {

          const p = dpts[k];
          ctx.beginPath();
          ctx.arc(p.x, p.y, 0.8+this.rand(b.id*65+k)*1.2, 0, Math.PI*2);
          ctx.fill();
        }
      }
      if (sp.name !== '竹' && b.depth <= 2 && partial >= 0.7 && dpts.length >= 3) {
        const startIdx = Math.max(1, Math.floor(dpts.length*0.65));
        if (startIdx < dpts.length-1) {
          ctx.save();
          ctx.shadowColor='transparent'; ctx.shadowBlur=0;
          ctx.globalAlpha = alpha*0.4;
          ctx.setLineDash([2+this.rand(b.id*7+41)*3, 2+this.rand(b.id*7+42)*4]);
          ctx.lineDashOffset = this.rand(b.id*7+43)*20;
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = pw*0.7;
          ctx.beginPath();
          ctx.moveTo(dpts[startIdx].x, dpts[startIdx].y);
          for (let j = startIdx+1; j < dpts.length; j++) ctx.lineTo(dpts[j].x, dpts[j].y);
          ctx.stroke();
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
    }
  }
  const wind = {
    strength: 0.15, targetStrength: 0.15, direction: 1,
    gust: 0, gustStart: 0, gustStrength: 0,
  };
  let windDomAccum = 0;
  function updateWind(dt, now) {
    if (Math.random() < 0.003) {
      wind.targetStrength = 0.08 + Math.random()*0.17;
      wind.direction = Math.random() > 0.5 ? 1 : -1;
    }
    if (Math.random() < 0.0015 && now - wind.gustStart > 5000) {
      wind.gustStrength = 0.15 + Math.random()*0.2;
      wind.gustStart = now;
    }
    wind.strength += (wind.targetStrength - wind.strength) * dt * 0.5;
    const gustAge = (now - wind.gustStart) / 1000;
    wind.gust = wind.gustStrength * Math.exp(-gustAge * 1.5);
    windDomAccum += dt * 1000;
    if (windDomAccum >= 200) {
      windDomAccum = 0;
      const wb = wind.strength + wind.gust * 0.3;
      const heights = [10,16,22,16,10];
      for (let i = 0; i < 5; i++) {
        const bar = dom.windBars[i];
        if (!bar) continue;
        bar.style.height = (heights[i] + wb*14*(i%2===0?1.3:0.8))+'px';
        bar.style.background = wb > 0.35 ? '#8a7c62' : '#9a8d76';
      }
      dom.windArrow.textContent = wind.direction > 0 ? '→' : '←';
      dom.windArrow.style.transform = wind.direction > 0 ? 'translateX(2px)' : 'translateX(-2px)';
      dom.windIndicator.style.transform = 'translateY(-50%) skewX(' + (wind.direction * -8) + 'deg)';
    }
  }
  function randomizeWind() {

  function drawGround(ctx) {
    const grad = ctx.createLinearGradient(0, groundY-40, 0, H);
    grad.addColorStop(0, 'rgba(140,125,95,0)');
    grad.addColorStop(0.3, 'rgba(140,125,95,0.08)');
    grad.addColorStop(1, 'rgba(120,105,80,0.16)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY-40, W, H-groundY+40);
    ctx.strokeStyle = 'rgba(80,68,50,0.22)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const y = groundY + Math.sin(x*0.02)*3 + Math.sin(x*0.005)*5;
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  function drawMountains(ctx) {
    // Paint from back to front. Each layer fades its bottom into the paper
    // colour so layers blend without horizontal seam lines.
    drawMountainLayer(ctx, 0, groundY-90, 55, INK.paper, 0.55);
    drawMountainLayer(ctx, 1, groundY-40, 60, '#c8bda3', 0.6);
    drawMountainLayer(ctx, 2, groundY+30, 50, '#9a8c70', 0.7);
  }
  function drawMountainLayer(ctx, layer, baseY, amp, color, maxAlpha) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, baseY - amp);
    for (let x = 0; x <= W; x += 6) {
      const y = baseY
        - Math.sin(x*0.0028+layer*2.3)*(amp*0.7)
        - Math.sin(x*0.007+layer*1.1)*(amp*0.35)
        - Math.sin(x*0.015+layer*4)*amp*0.12
        - getMountainNoise(x, layer);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, baseY-amp, 0, baseY+amp*3);
    grad.addColorStop(0, color);
    grad.addColorStop(0.55, color);
    grad.addColorStop(1, INK.paper);
    ctx.fillStyle = grad;
    ctx.globalAlpha = maxAlpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // plantSpecies: 高层Command，展开为原子Command序列
  bus.register('plantSpecies', {

    expand: function(p, ctx) {

      if (p.si === 4) {

              seed: data.seed,
              opts: opts
            }
          });
        }
      } else {
        // 非兰花：用一个addStem原子Command，内部创建Plant（保留旧构建路径）
        subs.push({
          type: 'addStem',
          params: {
            plantX: x, plantY: y, si: p.si,
            legacyPlant: true,
            seed: opts.seed,
            opts: opts
          }
        });
      }

    }
  });

  // addStem: 原子Command — 添加枝干/兰叶
  bus.register('addStem', {
    validate: function(p) {
      if (p.legacyPlant) {
        if (typeof p.plantX !== 'number' || typeof p.plantY !== 'number') return 'plantX,plantY required';
        if (typeof p.si !== 'number') return 'si required';
      } else {
        if (!Array.isArray(p.points) || p.points.length < 2) return 'points array required';
        if (typeof p.thickness !== 'number') return 'thickness required';
      }
      return null;
    },
    execute: function(p, ctx) {
      if (p.legacyPlant || p.si !== 4) {
        // 非兰花路径：创建完整Plant（保留旧构建）
        var plantOpts = {};
        if (p.seed !== undefined) plantOpts.seed = p.seed;
        if (p.opts) {
          if (p.opts.animate === false || p.opts.instant) plantOpts.instant = true;
        }
        // compose模式默认instant
        var isCompose = typeof urlParams !== 'undefined' && urlParams.get('compose') === '1';
        if (isCompose && p.opts && p.opts.animate !== true) plantOpts.instant = true;

        var np = new Plant(p.plantX, p.plantY, p.si, plantOpts);
        // 检查密度和上限（与plantAt一致）
        var nearby = 0;
        for (var i = 0; i < plants.length; i++) {
          if (plants[i].dying) continue;
          var dx = plants[i].x - p.plantX, dy = plants[i].y - p.plantY;
          if (dx*dx + dy*dy < 10000) nearby++;
        }
        if (nearby > 3) {
          return { success: false, error: 'Too dense' };
        }
        var aliveCount = 0;
        for (var j = 0; j < plants.length; j++) if (!plants[j].dying) aliveCount++;
        if (aliveCount >= MAX_PLANTS) {
          var oldest = null;
          for (var k = 0; k < plants.length; k++) {
            if (plants[k].dying) continue;
            if (!oldest || plants[k].age > oldest.age) oldest = plants[k];
          }
          if (oldest) { oldest.dying = true; createInkSplatter(oldest.x, oldest.y, oldest.species.color); }
        }
        plants.push(np);
        plantHistory.push(np);
        registerPlant(np);
        createInkSplatter(p.plantX, p.plantY, species[p.si].color);
        if (!hasPlanted) {
          hasPlanted = true;
          if (dom.hint) { dom.hint.style.opacity = '0'; setTimeout(function(){ dom.hint.style.display='none'; }, 600); }
        }
        return { undoData: { plantId: np._pid, isNew: true } };
      }

      // 兰花路径：addStem创建或追加到Plant
      // 查找同位置的兰花Plant（由同一组Command创建）
      var targetPlant = null;
      for (var pi = plants.length - 1; pi >= 0; pi--) {
        var pp = plants[pi];
        if (pp.species.name === '兰' && !pp.dying &&
            Math.abs(pp.x - p.plantX) < 2 && Math.abs(pp.y - p.plantY) < 2 &&
            pp._cmdBuilding) {
          targetPlant = pp;
          break;
        }
      }
      if (!targetPlant) {
        // 创建新Plant壳
        var plantOpts2 = { seed: p.seed, instant: true, _cmdBuilding: true };
        var isCompose2 = typeof urlParams !== 'undefined' && urlParams.get('compose') === '1';
        if (isCompose2 && p.opts && p.opts.animate !== true) plantOpts2.instant = true;
        else if (p.opts && (p.opts.animate === false || p.opts.instant)) plantOpts2.instant = true;
        targetPlant = new Plant(p.plantX, p.plantY, p.si, plantOpts2);
        targetPlant._cmdBuilding = true;
        targetPlant.branches = [];
        targetPlant._cmdFlowers = [];
        // 密度检查
        var nearby2 = 0;
        for (var ni = 0; ni < plants.length; ni++) {
          if (plants[ni].dying) continue;
          var ndx = plants[ni].x - p.plantX, ndy = plants[ni].y - p.plantY;
          if (ndx*ndx + ndy*ndy < 10000) nearby2++;
        }
        if (nearby2 > 3) return { success: false, error: 'Too dense' };
        var ac = 0;
        for (var aj = 0; aj < plants.length; aj++) if (!plants[aj].dying) ac++;
        if (ac >= MAX_PLANTS) {
          var old2 = null;
          for (var ak = 0; ak < plants.length; ak++) {
            if (plants[ak].dying) continue;
            if (!old2 || plants[ak].age > old2.age) old2 = plants[ak];
          }
          if (old2) { old2.dying = true; createInkSplatter(old2.x, old2.y, old2.species.color); }
        }
        plants.push(targetPlant);
        plantHistory.push(targetPlant);
        registerPlant(targetPlant);
        createInkSplatter(p.plantX, p.plantY, species[p.si].color);
        if (!hasPlanted) {
          hasPlanted = true;
          if (dom.hint) { dom.hint.style.opacity = '0'; setTimeout(function(){ dom.hint.style.display='none'; }, 600); }
        }
      }
      // 追加branch
      var branch = {
        id: p.branchId !== undefined ? p.branchId : targetPlant.branches.length,
        kind: p.kind || 'leaf',
        points: p.points,
        angle: p.angle || 0,
        length: p.length || 0,
        width: p.thickness,
        depth: 0,
        children: [],
        hasLeaf: false,
        leafTone: p.inkTone || 'nong'
      };
      targetPlant.branches.push(branch);
      targetPlant.maxGrowth = targetPlant.branches.length;
      if (targetPlant.growth < targetPlant.maxGrowth) targetPlant.growth = targetPlant.maxGrowth;
      // 最后一个addStem后由addFlower负责标记_cmdBuilding=false
      return { undoData: { plantId: targetPlant._pid, branchIndex: targetPlant.branches.length - 1, isNewPlant: targetPlant.branches.length === 1 } };
    },
    undo: function(undoData) {
      var p = getPlant(undoData.plantId);
      if (!p) return;
      // v5.0: 兰花由复合Command创建，undo时整株移除（不逐叶删）
      if (p._cmdFlowers !== undefined && p.species.name === '兰' && undoData.compositeRoot) {
        p.dying = true;
        createInkSplatter(p.x, p.y, p.species.color);
        var hi = plantHistory.indexOf(p);
        if (hi >= 0) plantHistory.splice(hi, 1);

        p.branches.splice(undoData.branchIndex, 1);

    }
  });

  // addLeaf: 原子Command — 添加一片叶子（addStem的语义别名，兰叶专用）
  bus.register('addLeaf', {
    validate: function(p) {
      if (typeof p.baseX !== 'number' || typeof p.baseY !== 'number') return 'baseX,baseY required';
      if (typeof p.angle !== 'number') return 'angle required';
      if (typeof p.length !== 'number') return 'length required';
      return null;
    },
    execute: function(p, ctx) {
      // 用悬臂梁模型生成叶子路径
      var N = 40;
      var pts = [];
      var cx = p.baseX, cy = p.baseY;
      var DOWN = Math.PI/2;
      var droop = DOWN - p.angle;
      while (droop > Math.PI) droop -= Math.PI*2;
      while (droop < -Math.PI) droop += Math.PI*2;
      var sag = p.curve !== undefined ? p.curve : 0.38;
      var bend = sag * 0.8;
      var flip = p.flip || 1;
      var twist = flip * 0.04;
      for (var i = 0; i <= N; i++) {
        var t = i/N;
        pts.push({x:cx, y:cy});
        if (i < N) {
          var dt = 1/N;
          var a = p.angle + droop*bend*t*t + Math.sin(t*Math.PI)*twist;
          cx += Math.cos(a)*p.length*dt;
          cy += Math.sin(a)*p.length*dt;
        }
      }
      // 转发为addStem
      return bus._handlers['addStem'].execute({
        points: pts,
        thickness: p.thickness || 6,
        inkTone: p.inkTone || 'nong',
        plantX: p.plantX !== undefined ? p.plantX : p.baseX,
        plantY: p.plantY !== undefined ? p.plantY : p.baseY,
        si: 4,
        kind: 'leaf',
        seed: p.seed
      }, ctx);
    },
    undo: function(undoData) {
      bus._handlers['addStem'].undo(undoData);
    }
  });

      if (!targetPlant._cmdFlowers) targetPlant._cmdFlowers = [];
      var flower = {
        x: p.x, y: p.y, size: p.size,
        isMain: p.isMain !== false,
        petals: p.petals || 5,
        angle: p.angle || 0
      };
      targetPlant._cmdFlowers.push(flower);
      // 标记构建完成
      targetPlant._cmdBuilding = false;
      return { undoData: { plantId: targetPlant._pid, flowerIndex: targetPlant._cmdFlowers.length - 1 } };
    },
    undo: function(undoData) {
      var p = getPlant(undoData.plantId);
      if (p && undoData.flowerIndex >= 0) {
        var fls = p._cmdFlowers;
        if (fls && fls.length > undoData.flowerIndex) {
          fls.splice(undoData.flowerIndex, 1);
        }
      }
    }
  });

  // setWind: 设置风
  bus.register('setWind', {
    validate: function(p) {
      if (p.strength !== undefined && (typeof p.strength !== 'number' || p.strength < 0 || p.strength > 1))
        return 'strength must be 0-1';
      if (p.direction !== undefined && p.direction !== 1 && p.direction !== -1)
        return 'direction must be 1 or -1';
      return null;
    },
    execute: function(p, ctx) {
      var prev = {
        strength: wind.strength,
        targetStrength: wind.targetStrength,
        direction: wind.direction,
        gustStrength: wind.gustStrength,
        gustStart: wind.gustStart
      };
      if (p.strength !== undefined) { wind.strength = p.strength; wind.targetStrength = p.strength; }
      if (p.gust !== undefined) { wind.gustStrength = p.gust; wind.gustStart = performance.now(); }
      if (p.direction !== undefined) wind.direction = p.direction;
      return { undoData: prev };
    },
    undo: function(undoData) {
      wind.strength = undoData.strength;
      wind.targetStrength = undoData.targetStrength;
      wind.direction = undoData.direction;
      wind.gustStrength = undoData.gustStrength;
      wind.gustStart = undoData.gustStart;
    }
  });

  // clear: 清空画布
  bus.register('clear', {
    validate: function() { return null; },
    execute: function(p, ctx) {
      var snapshot = [];
      for (var i = 0; i < plants.length; i++) {
        var pp = plants[i];
        if (!pp.dying) {
          if (!pp._pid) registerPlant(pp);
          snapshot.push({ plantId: pp._pid, dying: pp.dying, fade: pp.fade });
        }
        pp.dying = true;
      }
      var prevLeaves = fallingLeaves.slice();
      fallingLeaves.length = 0;
      plantHistory.length = 0;
      showToast('园已清');
      return { undoData: { snapshot: snapshot, prevLeaves: prevLeaves } };
    },
    undo: function(undoData) {
      for (var i = 0; i < undoData.snapshot.length; i++) {
        var s = undoData.snapshot[i];
        var p = getPlant(s.plantId);
        if (p) {
          p.dying = s.dying;
          p.fade = s.fade;
          if (plants.indexOf(p) === -1) plants.push(p);
        }
      }
      for (var j = 0; j < undoData.prevLeaves.length; j++) {
        fallingLeaves.push(undoData.prevLeaves[j]);
      }
    }
  });

  function createInkSplatter(x, y, color) {
    const c = color || INK.zhong;
    for (let i = 0; i < 8; i++) {
      const angle = Math.random()*Math.PI*2;
      const speed = 0.5+Math.random()*2;
      particles.push({
        x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-0.5,
        life:1, size:1+Math.random()*3, color:c, splatter:true
      });
    }
    particles.push({x,y,vx:0,vy:0,life:1,size:2,color:c,ripple:true});
  }
  const REMOVE_DIST = 40;
  function findNearestPlant(x, y, maxDist) {
    let best = null, bestDist = maxDist;
    for (let i = 0; i < plants.length; i++) {
      const p = plants[i];
      if (p.dying) continue;
      const dx = p.x-x, dy = p.y-y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < bestDist) { bestDist = d; best = p; }
    }
    return best;
  }
  function removePlantAt(x, y) {
    const p = findNearestPlant(x, y, REMOVE_DIST);
    if (p) {
      p.dying = true;
      createInkSplatter(p.x, p.y, p.species.color);
      if (navigator.vibrate) { try{navigator.vibrate(20)}catch(e){} }
    }
  }
  function clearGarden() {
    bus.dispatch({ type: 'clear', params: {}, actor: 'human' });
  }
  function undoLastPlant() {
    // v5.0: 经Command Bus undo
    const r = bus.undo();
    if (r.success) {
      if (navigator.vibrate) { try{navigator.vibrate(15)}catch(e){} }
      showToast('已撤');
    } else {
      showToast('无可撤');
    }
  }
  let toastTimer = null;
  function showToast(msg) {
    dom.toast.textContent = msg;
    dom.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ dom.toast.classList.remove('show'); }, 2500);
  }
  const shichenNames = ['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];
  function getShichen() {
    const h = new Date().getHours();
    return shichenNames[Math.floor(((h + 1) % 24) / 2)];
  }
  let lastTime = performance.now();
  let rafId = null;
  let lastShichen = -1, lastCount = -1;
  const pressRing = { active:false, x:0, y:0, start:0, triggered:false };
  const PRESS_DURATION = 500;
  function loop(now) {
    const dt = Math.min((now - lastTime)/1000, 0.05);
    lastTime = now;
    updateWind(dt, now);
    if (paperCanvas && paperW === W && paperH === H) {
      ctx.drawImage(paperCanvas, 0, 0, W, H);
    } else {
      ctx.fillStyle = INK.paper;
      ctx.fillRect(0, 0, W, H);
    }
    // 折枝模式：不画远山和地面，纯宣纸留白
    if (urlParams.get('compose') !== '1') {
      drawMountains(ctx);
      drawGround(ctx);
    }
    for (let i = plants.length-1; i >= 0; i--) plants[i].update(dt, wind);
    const visiblePlants = [];
    for (let i = plants.length-1; i >= 0; i--) {
      const p = plants[i];
      if (p.fade <= 0) { plants.splice(i, 1); continue; }
      visiblePlants.push(p);
    }
    visiblePlants.sort(function(a, b) { return a.y - b.y; });
    for (const p of visiblePlants) {
      const layer = getDepthLayer(p.y);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(layer.scale, layer.scale);
      ctx.translate(-p.x, -p.y);
      p.draw(ctx, wind, now, layer);
      ctx.restore();
    }
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.02;
      p.life -= dt*1.5;
      if (p.ripple) p.size += dt*60;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      ctx.globalAlpha = p.life*0.6;
      if (p.ripple) {
        ctx.strokeStyle = p.color; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    for (let i = fallingLeaves.length-1; i >= 0; i--) {
      const l = fallingLeaves[i];
      l.sway += l.swaySpeed;
      l.vx += Math.sin(l.sway)*0.02 + (wind.strength + wind.gust)*0.01*wind.direction;
      l.vx *= 0.98;
      l.rotV += (Math.random()-0.5)*0.001;
      l.rotV *= 0.99;
      l.x += l.vx; l.y += l.vy; l.rot += l.rotV;
      l.life -= dt*0.15;
      if (l.y > H+20 || l.life <= 0 || l.x < -20 || l.x > W+20) {
        fallingLeaves.splice(i,1); continue;
      }
      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      const turn = Math.cos(l.sway*0.8);
      const sx = Math.max(0.15, Math.abs(turn));
      ctx.scale(sx, 1);
      ctx.globalAlpha = l.life*0.7*(0.5 + sx*0.5);
      ctx.fillStyle = l.color;
      ctx.beginPath();
      ctx.moveTo(0, -l.size);
      ctx.quadraticCurveTo(l.size*0.35, 0, 0, l.size);
      ctx.quadraticCurveTo(-l.size*0.35, 0, 0, -l.size);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0, W, H);
    if (pressRing.active) {
      const elapsed = now - pressRing.start;
      const progress = Math.min(elapsed / PRESS_DURATION, 1);
      if (progress >= 1 && !pressRing.triggered) {
        pressRing.triggered = true;
        removePlantAt(pressRing.x, pressRing.y);
      }
      ctx.save();
      ctx.strokeStyle = INK.zhong;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(pressRing.x, pressRing.y, 20, -Math.PI/2, -Math.PI/2 + progress*Math.PI*2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(68,58,48,0.3)';
      ctx.beginPath();
      ctx.arc(pressRing.x, pressRing.y, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    if (plants.length !== lastCount) {
      lastCount = plants.length;
      dom.plantCount.textContent = lastCount;
    }
    const sc = getShichen();
    if (sc !== lastShichen) {
      lastShichen = sc;
      dom.timeDisplay.textContent = sc;
    }
    rafId = requestAnimationFrame(loop);
  }
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const oldGroundY = groundY;
    groundY = H * 0.82;
    if (oldGroundY !== undefined && oldGroundY !== groundY) {
      const dy = groundY - oldGroundY;
      for (const p of plants) {
        p.y += dy;
        for (const b of p.branches) for (const pt of b.points) pt.y += dy;
      }
      for (const pt of particles) pt.y += dy;
      for (const l of fallingLeaves) l.y += dy;
    }
    buildVignette();
    if (firstResize) {
      createPaperTexture();
      firstResize = false;
    } else {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        createPaperTexture();
        buildVignette();
      }, 200);
    }
  }
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      pressRing.active = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      lastTime = performance.now();
      if (!rafId) rafId = requestAnimationFrame(loop);
    }
  });
  let selectedPlant = 0;
  function resolvePlantIndex() {
    return selectedPlant === 'random' ? Math.floor(Math.random()*species.length) : selectedPlant;
  }
  function plantAt(x, y) {
    y = Math.max(10, Math.min(H-10, y));
    x = Math.max(10, Math.min(W-10, x));
    const si = resolvePlantIndex();
    // v5.0: 经Command Bus
    const r = bus.dispatch({
      type: 'plantSpecies',
      params: { x: x, y: y, si: si, options: {} },
      actor: 'human'
    });
    if (!r.success && r.error === 'Too dense') {
      showToast('此处已密');
    }
  }
  function saveSnapshot() {
    try {
      const sealRect = sealCv.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      ctx.drawImage(sealCv,
        sealRect.left - canvasRect.left, sealRect.top - canvasRect.top,
        sealRect.width, sealRect.height);
      const link = document.createElement('a');
      const d = new Date();
      const ts = d.getFullYear()
        + String(d.getMonth()+1).padStart(2,'0')
        + String(d.getDate()).padStart(2,'0') + '-'
        + String(d.getHours()).padStart(2,'0')
        + String(d.getMinutes()).padStart(2,'0')
        + String(d.getSeconds()).padStart(2,'0');
      link.download = 'ink-garden-' + ts + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch(e) { showToast('留影失败'); }
  }
  canvas.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    plantAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    removePlantAt(e.clientX, e.clientY);
  });
  let touchMoved = false, touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (e.changedTouches.length === 0) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchMoved = false;
    pressRing.active = true;
    pressRing.x = t.clientX; pressRing.y = t.clientY;
    pressRing.start = performance.now();
    pressRing.triggered = false;
  }, {passive:false});
  canvas.addEventListener('touchmove', function(e) {
    if (e.changedTouches.length === 0) return;
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX-touchStartX)>10 || Math.abs(t.clientY-touchStartY)>10) {
      touchMoved = true; pressRing.active = false;
    }
  }, {passive:false});
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    const wasLong = pressRing.triggered;
    pressRing.active = false;
    if (!touchMoved && !wasLong && e.changedTouches.length > 0) {
      plantAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    }
  }, {passive:false});
  canvas.addEventListener('touchcancel', function() {
    pressRing.active = false; touchMoved = false;
  });
  document.querySelectorAll('.pbtn[data-plant]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.pbtn[data-plant]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      const v = btn.dataset.plant;
      selectedPlant = v === 'random' ? 'random' : parseInt(v, 10);
    });
  });
  let clearArmed = false, clearArmedTimer = null;
  dom.btnClear.addEventListener('click', function() {
    const span = dom.btnClear.querySelector('span');
    if (!clearArmed) {
      clearArmed = true;
      dom.btnClear.classList.add('armed');
      span.textContent = '确';
      clearArmedTimer = setTimeout(function() {
        clearArmed = false;
        dom.btnClear.classList.remove('armed');
        span.textContent = '清';
      }, 3000);
    } else {
      clearTimeout(clearArmedTimer);
      clearArmed = false;
      dom.btnClear.classList.remove('armed');
      span.textContent = '清';
      clearGarden();
    }
  });
  dom.btnUndo.addEventListener('click', undoLastPlant);
  dom.btnWind.addEventListener('click', randomizeWind);
  dom.windIndicator.addEventListener('click', randomizeWind);
  dom.btnSave.addEventListener('click', saveSnapshot);
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault();
      undoLastPlant();
    }
  });
  function drawSeal() {
    const c = sealCtx, s = 64;
    c.clearRect(0, 0, s, s);
    c.fillStyle = INK.rouge;
    c.fillRect(6, 6, s-12, s-12);
    c.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 50; i++) {
      c.fillStyle = 'rgba(0,0,0,'+(0.08+Math.random()*0.28)+')';
      c.beginPath();
      c.arc(8+Math.random()*(s-16), 8+Math.random()*(s-16), Math.random()*2.8+0.4, 0, Math.PI*2);
      c.fill();
    }
    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.fillRect(0,0,s,4); c.fillRect(0,s-4,s,4);
    c.fillRect(0,0,4,s); c.fillRect(s-4,0,4,s);
    c.globalCompositeOperation = 'source-over';
    c.strokeStyle = 'rgba(255,240,225,0.35)';
    c.lineWidth = 1.5;
    c.strokeRect(9, 9, s-18, s-18);
    c.fillStyle = '#f0e8d6';
    c.font = 'bold 22px "Ma Shan Zheng","Songti SC","STSong",serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('墨', s/2, s*0.32);
    c.fillText('园', s/2, s*0.68);
  }
  sealCv.width = Math.round(64 * dpr);
  sealCv.height = Math.round(64 * dpr);
  sealCv.style.width = '64px'; sealCv.style.height = '64px';
  sealCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  resize();
  drawSeal();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function(){ drawSeal(); });
  }
  dom.hint.classList.add('breathe');
  setTimeout(function(){
    dom.hint.classList.remove('breathe');
    if (!hasPlanted) dom.hint.style.opacity = '0.25';
  }, 4200);
  setTimeout(function() {
    if (urlParams.get('compose') === '1') {
      // v5.0: 出画创作模式 — 统一Command Bus入口
      hasPlanted = true;
      dom.hint.style.display = 'none';
      return;
    }
    const starters = [
      { x:0.72, yRatio:0.52, si:1 },  // 松（右上）
      { x:0.42, yRatio:0.68, si:0 },  // 竹（中）
      { x:0.12, yRatio:0.78, si:4 },  // 兰（左下）
    ];
    starters.forEach(function(s, i) {
      setTimeout(function() {
        const rx = s.x + (Math.random()-0.5)*0.1;
        const x = W * rx;
        const y = H * s.yRatio + (Math.random()-0.5)*30;
        bus.dispatch({
          type: 'plantSpecies',
          params: { x: x, y: y, si: s.si, options: {} },
          actor: 'system'
        });
      }, i*400);
    });
  }, 500);

  // ═══════════════════════════════════════════════════════════════
  // v5.0: 全局Compose API — 人和Agent统一通过Command Bus
  // ═══════════════════════════════════════════════════════════════
  window.__inkDispatch = function(command) {
    if (!command.actor) command.actor = 'agent';
    if (!command.timestamp) command.timestamp = Date.now();
    return bus.dispatch(command);
  };
  window.__inkPlant = function(x, y, si, opts) {
    if (si !== undefined) selectedPlant = si;
    return bus.dispatch({
      type: 'plantSpecies',
      params: { x: x, y: y, si: si, options: opts || {} },
      actor: 'agent'
    });
  };
  window.__inkClear = function() {
    return bus.dispatch({ type: 'clear', params: {}, actor: 'agent' });
  };
  window.__inkSetWind = function(s) {
    return bus.dispatch({
      type: 'setWind',
      params: { strength: s.strength, gust: s.gust, direction: s.direction },
      actor: 'agent'
    });
  };
  window.__inkUndo = function() { return bus.undo(); };
  window.__inkRedo = function() { return bus.redo(); };
  window.__inkGetHistory = function() { return bus.getHistory(); };
  window.__inkLoadHistory = function(history) { return bus.loadHistory(history); };
  window.__inkGetEventLog = function() { return bus.getEventLog(); };
  window.__inkCanUndo = function() { return bus.canUndo(); };
  window.__inkCanRedo = function() { return bus.canRedo(); };
  // Debug accessors (for testing/inspection)
  window.__inkDebug = function() {
    return {
      plants: plants.map(function(p) {
        return { alive: !p.dying, dying: p.dying, species: p.species.name, branches: p.branches.length,
          flowers: p._cmdFlowers ? p._cmdFlowers.length : 0,
          angles: p.species.name === '兰' ? p.branches.map(function(b){return Math.round(b.angle*100)/100;}) : [] };
      }),
      wind: { strength: wind.strength, direction: wind.direction },
      canUndo: bus.canUndo(), canRedo: bus.canRedo(),
      undoStack: bus._undoStack.length, redoStack: bus._redoStack.length,
      stackTop: bus._undoStack.length > 0 ? {
        type: bus._undoStack[bus._undoStack.length-1].type,
        composite: bus._undoStack[bus._undoStack.length-1].composite,
        subLen: (bus._undoStack[bus._undoStack.length-1].subEntries||[]).length,
        subs: (bus._undoStack[bus._undoStack.length-1].subEntries||[]).map(function(e){
          return { type: e.type, cr: !!(e.undoData && e.undoData.compositeRoot), bi: e.undoData ? e.undoData.branchIndex : null };
        })
      } : null
    };
  };

  rafId = requestAnimationFrame(loop);
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
})();
</script>

<script>
// 画集：展示用墨园作出的作品
(function(){
  // 作品清单（同一目录下）
  const WORKS = [
    {
      file: '幽兰.png',
      title: '幽兰',
      date: '2026.08.14',
      desc: '折枝兰草七至九叶，长叶交叉成凤眼，三花着生叶间，花心一点胭脂。九轮迭代方得。'
    },
    {
      file: '三友图-盘虬.png',
      title: '三友图·盘虬',
      date: '2026.08.14',
      desc: '松、竹、梅共处一纸。墨园的第一幅作品，亦是此后画房流程的起点。'
    }
  ];

  const btn = document.getElementById('galleryBtn');
  const modal = document.getElementById('galleryModal');
  const grid = document.getElementById('gmGrid');
  const closeBtn = modal.querySelector('.gm-close');

  // 画廊模式(?gallery=1)下隐藏画集入口
  if (new URLSearchParams(location.search).get('gallery') === '1') {
    btn.style.display = 'none';
  }

  function render(){
    grid.innerHTML = WORKS.map(function(w){
      return ''
        + '<a class="gm-card" href="' + w.file + '" target="_blank" rel="noopener">'
        +   '<img src="' + w.file + '" alt="' + w.title + '" loading="lazy">'
        +   '<div class="meta">'
        +     '<div class="t"><h3>' + w.title + '</h3><span class="date">' + w.date + '</span></div>'
        +     '<p class="desc">' + w.desc + '</p>'
        +   '</div>'
        + '</a>';
    }).join('');
  }

  function open(e){
    if(e) e.stopPropagation();
    render();
    modal.classList.add('open');
  }
  function close(){ modal.classList.remove('open'); }

  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  modal.addEventListener('click', function(e){
    if (e.target === modal) close();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') close();
  });
})();
</script>
