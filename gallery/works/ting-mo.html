<body>
<header>
  <h1>听墨</h1>
  <div class="sub">TING MO · 墨洇有声</div>
</header>
<div class="frame">
  <canvas id="paper"></canvas>
  <canvas id="ink"></canvas>
  <div class="seal" id="seal">绒<br>球</div>
</div>
<footer>
  <div>点落一团墨 · 拖扫行笔 · 双击清纸</div>
  <div><span id="state">研墨…</span> · <span id="snd">声·待启</span> · <span id="clear" title="清除纸面重新研墨">研墨清纸</span></div>
</footer>

<script src="lib/audio-lib.js"></script>
<script>
'use strict';
/* ================= 听墨 · 墨洇有声版 =================
   基底：墨洇 v10（纯扩散+毛细四场模型，物理/渲染零改动）
   增量：声音层——模拟过程声化（sonification）
   研墨(清纸刮擦) → 落墨(软噗) → 行笔(摩擦颗粒) → 洇散(锋线耳语) → 墨定(低铃)
========================================================= */
const N = 320;                 // 模拟网格
const STEPS = 8;               // 每帧模拟步
const D_W = 0.38;              // 水扩散率
const EVAP = 2.8e-5;           // 水蒸发/吸附衰减
const D_P = 0.40;              // 水中色素最大扩散率
const MOB_LO = 0.008, MOB_HI = 0.09;   // 色素迁移水量门槛区间
const ADS = 0.0032;            // 基础吸附率
const ADS_FRONT = 0.100;       // 湿锋吸附加成(水痕线)
const ADS_DRY = 0.05;          // 水干急速挂墨
const W_DRY = 0.012;
const ADVEC = 0.5;             // 色素随水流平流(咖啡环机制→水痕线)
const ADVEC_W = 0.45;          // 平流水量闸门：只在薄水(蒸发前沿)发力
const TONE_K = 2.7;            // 色调 Beer-Lambert
const FIB_ADS = 1.1;           // 纤维调制吸附强度
const FIB_DW = 0.16;           // 纤维调制水扩散(轻微·纯扩散稳定)

const W = new Float32Array(N*N);
const P = new Float32Array(N*N);
const S = new Float32Array(N*N);
const F = new Float32Array(N*N);
const F2 = new Float32Array(N*N);  // 高频帘纹丝（毛茬源）
const LB = new Float32Array(N*N);   // 扩散缓冲

/* ---------- 纸纤维场：值噪声3octave + 横向帘纹 ---------- */
function hash2(x,y){
  let h = (x*374761393 + y*668265263) | 0;
  h = (h ^ (h>>>13)) | 0; h = Math.imul(h,1274126177);
  return ((h ^ (h>>>16))>>>0) / 4294967295;
}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
(function buildFiber(){
  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const n = 0.55*vnoise(x*0.028, y*0.085)
              + 0.30*vnoise(x*0.07,  y*0.21)
              + 0.15*vnoise(x*0.16,  y*0.45);
      F[y*N+x] = Math.min(1, Math.max(0, n));
      const n2 = 0.62*vnoise(x*0.075, y*0.19) + 0.38*vnoise(x*0.16, y*0.50);
      const f2 = Math.min(1, Math.max(0, (n2-0.30)*2.0));
      F2[y*N+x] = f2;
    }
  }
})();

/* ---------- 扩散内核：9点 Laplacian(orth .2 / diag .05) ---------- */
function lap9(src,dst){
  for(let y=1;y<N-1;y++){
    const r=y*N, ru=r-N, rd=r+N;
    for(let x=1;x<N-1;x++){
      const i=r+x;
      dst[i] = 0.2*(src[i-1]+src[i+1]+src[ru+x]+src[rd+x])
             + 0.05*(src[ru+x-1]+src[ru+x+1]+src[rd+x-1]+src[rd+x+1])
             - src[i];
    }
  }
}

/* ---------- 锋线活动度（声音层唯一输入：每帧累计 tide） ---------- */
let frontAcc = 0;

/* ---------- 单步模拟 ---------- */
let totalWater = 0;
function step(){
  lap9(W,LB);
  let tw=0;
  for(let i=N+1;i<N*N-N-1;i++){
    const fw = 1 + FIB_DW*(F[i]-0.5) + 0.90*(F2[i]-0.5);
    let w = W[i] + D_W*LB[i]*fw;
    w *= (1-EVAP*(0.55+0.9*F2[i]));
    if(w<1e-5) w=0;
    W[i]=w; tw+=w;
  }
  totalWater = tw;

  lap9(P,LB);
  for(let y=1;y<N-1;y++){
    const r=y*N;
    for(let x=1;x<N-1;x++){
      const i=r+x;
      const w = W[i];
      let p = P[i];
      let m = (w-MOB_LO)/(MOB_HI-MOB_LO);
      if(m<0)m=0; else if(m>1)m=1;
      if(m>0 && p>0){
        p += D_P*m*(0.75+0.5*F2[i])*LB[i];
        if(p<0)p=0;
      }
      const g = Math.abs(W[i+1]-W[i-1]) + Math.abs(W[i+N]-W[i-N]);
      let tide = g*32; if(tide>1)tide=1;
      const dwt=(w-0.05)/0.055; tide *= Math.max(0, 1-dwt*dwt);
      frontAcc += tide;                       // 声音层：锋线活动度累计
      let rate = ADS*(0.55+FIB_ADS*F[i])*(0.82+0.36*F2[i]) + ADS_FRONT*tide;
      if(w<W_DRY) rate += ADS_DRY;
      let dep = p*rate;
      if(dep>p)dep=p;
      if(dep>0){ S[i]+=dep; p-=dep; }
      P[i]=p;
    }
  }

  for(let y=1;y<N-1;y++){
    const r=y*N;
    for(let x=1;x<N-1;x++){
      const i=r+x;
      let j=i+1, dW=W[i]-W[j];
      let gate=(ADVEC_W-0.5*(W[i]+W[j]))*2.2; if(gate<0)gate=0; else if(gate>1)gate=1;
      if(gate>0){
        if(dW>0){ let a=P[i]*ADVEC*dW*gate; const cap=P[i]*0.25; if(a>cap)a=cap; if(a>0){P[i]-=a;P[j]+=a;} }
        else    { let a=P[j]*ADVEC*(-dW)*gate; const cap=P[j]*0.25; if(a>cap)a=cap; if(a>0){P[j]-=a;P[i]+=a;} }
      }
      j=i+N; dW=W[i]-W[j];
      gate=(ADVEC_W-0.5*(W[i]+W[j]))*2.2; if(gate<0)gate=0; else if(gate>1)gate=1;
      if(gate>0){
        if(dW>0){ let a=P[i]*ADVEC*dW*gate; const cap=P[i]*0.25; if(a>cap)a=cap; if(a>0){P[i]-=a;P[j]+=a;} }
        else    { let a=P[j]*ADVEC*(-dW)*gate; const cap=P[j]*0.25; if(a>cap)a=cap; if(a>0){P[j]-=a;P[i]+=a;} }
      }
    }
  }
}

/* ---------- 落墨 ---------- */
function drop(gx,gy,rad,wAmt,pAmt){
  const x0=Math.max(1,Math.floor(gx-rad*2)), x1=Math.min(N-2,Math.ceil(gx+rad*2));
  const y0=Math.max(1,Math.floor(gy-rad*2)), y1=Math.min(N-2,Math.ceil(gy+rad*2));
  const r2=rad*rad;
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const dx=x-gx, dy=y-gy, d2=dx*dx+dy*dy;
      if(d2>r2*4)continue;
      const fall=Math.exp(-d2/(2*r2*0.36));
      const i=y*N+x;
      W[i]+=wAmt*fall;
      P[i]+=pAmt*0.70*fall;
      S[i]+=pAmt*0.30*fall;
    }
  }
}

/* ==================== 声音层 ====================
   设计纪律：
   - 全部音量克制，像从纸里透出（master 0.55）
   - 耳语只由锋线活动度驱动，起伏经 τ≈0.4s 平滑（慢于视觉事件）
   - 墨洇物理/渲染零改动；RongAudio 缺失时静默降级，画照常
================================================== */
const SND = { plops:0, grains:0, grinds:0, bells:0, whisper:0, ac:'none', on:true };
window.__snd = SND;

let AC = null, audioReady = false;
let whisperGain = null, whisperBP = null, whisperSrc = null;

function panOf(gx){ return Math.max(-0.7, Math.min(0.7, (gx/N)*1.4 - 0.7)); }

function initAudio(){
  if(audioReady || !window.RongAudio) return;
  RongAudio.init({ master: 0.55, wet: 0.38 });
  AC = RongAudio.ctx();
  SND.ac = AC.state;
  // 常驻耳语链：循环噪声 → bandpass → gain → out(居中)
  const sr = AC.sampleRate, len = sr * 2;
  const buf = AC.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  whisperSrc = AC.createBufferSource();
  whisperSrc.buffer = buf; whisperSrc.loop = true;
  whisperBP = AC.createBiquadFilter();
  whisperBP.type = 'bandpass'; whisperBP.frequency.value = 500; whisperBP.Q.value = 0.8;
  whisperGain = AC.createGain(); whisperGain.gain.value = 0;
  whisperSrc.connect(whisperBP); whisperBP.connect(whisperGain);
  connectOut(whisperGain, 0);
  whisperSrc.start();
  audioReady = true;
  sndEl.textContent = '声·开';
}

/* 共享总线出声口（audio-lib v1.1 out()，未升级前本地兜底） */
function connectOut(node, pan){
  if(RongAudio.out){ node.connect(RongAudio.out(pan)); return; }
  // 兜底：直连 ctx.destination（不应发生，lib v1.1 已带 out）
  node.connect(AC.destination);
}

/* 落墨软噗：sine 150→90Hz 俯冲 + 500Hz 噪声点，大小→音量/音高 */
function plop(gx, rad){
  if(!audioReady || !SND.on) return;
  const t0 = AC.currentTime;
  const size = Math.max(0, Math.min(1, (rad-5)/11));     // rad 6.5..16 → 0..1
  const peak = 0.16 + size*0.30;
  const f0 = 165 - size*25;                              // 大团更低沉
  const osc = AC.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(f0*0.58, t0+0.12);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.16);
  osc.connect(g); connectOut(g, panOf(gx));
  osc.start(t0); osc.stop(t0+0.2);
  // 纸面触点：短噪声 burst
  const nb = AC.createBuffer(1, AC.sampleRate*0.04, AC.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*(1-i/nd.length);
  const ns = AC.createBufferSource(); ns.buffer = nb;
  const nf = AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=520; nf.Q.value=1.1;
  const ng = AC.createGain(); ng.gain.value = peak*0.55;
  ns.connect(nf); nf.connect(ng); connectOut(ng, panOf(gx));
  ns.start(t0);
  SND.plops++;
}
function grain(gx, speed){
  if(!audioReady || !SND.on) return;
  const now = performance.now();
  if(now - lastGrain < 60) return;
  lastGrain = now;
  const t0 = AC.currentTime;
  const v = Math.max(0, Math.min(1, speed/2.6));
  const dur = 0.045 + v*0.04;
  const nb = AC.createBuffer(1, Math.floor(AC.sampleRate*dur), AC.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/nd.length);
  const ns = AC.createBufferSource(); ns.buffer = nb;
  const nf = AC.createBiquadFilter(); nf.type='bandpass';
  nf.frequency.value = 1300 + v*1300; nf.Q.value = 0.9;
  const ng = AC.createGain(); ng.gain.value = 0.05 + v*0.15;
  ns.connect(nf); nf.connect(ng); connectOut(ng, panOf(gx));
  ns.start(t0);
  SND.grains++;
}

/* 研墨刮擦：双击清纸时的转圈研磨声 ~0.95s */
function grind(){
  if(!audioReady || !SND.on) return;
  const t0 = AC.currentTime;
  // 拂纸"唰"：白噪声经高通+带通，频率快速上扫后回落，0.35s 干脆收尾
  const dur = 0.35;
  const nb = AC.createBuffer(1, Math.floor(AC.sampleRate*dur), AC.sampleRate);
  const nd = nb.getChannelData(0);
  for(let i=0;i<nd.length;i++){ const k=1-i/nd.length; nd[i]=(Math.random()*2-1)*k; }
  const ns = AC.createBufferSource(); ns.buffer = nb;
  const hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  const bp = AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.7;
  bp.frequency.setValueAtTime(1400, t0);
  bp.frequency.exponentialRampToValueAtTime(3200, t0+0.12);   // 上扫：拂过去
  bp.frequency.exponentialRampToValueAtTime(1800, t0+0.35);   // 回落收住
  const ng = AC.createGain();
  ng.gain.setValueAtTime(0.0001, t0);
  ng.gain.exponentialRampToValueAtTime(0.12, t0+0.02);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  ns.connect(hp); hp.connect(bp); bp.connect(ng); connectOut(ng, 0);
  ns.start(t0); ns.stop(t0+dur+0.02);
  SND.grinds++;
}

/* 墨定低铃：水尽时一声收印（复用 lib 加法铃资产） */
function driedBell(){
  if(!audioReady || !SND.on) return;
  RongAudio.strikeBell(196, 0.30, { pan: 0 });
  SND.bells++;
}

/* 耳语参数：每帧从锋线活动度平滑驱动 */
let actSm = 0;
function updateWhisper(actRaw){
  actSm = actSm*0.85 + actRaw*0.15;
  SND.whisper = Math.round(actSm*1000)/1000;
  if(!audioReady || !AC) return;
  const t = AC.currentTime;
  const target = SND.on ? actSm*0.05 : 0;
  whisperGain.gain.setTargetAtTime(target, t, 0.4);
  whisperBP.frequency.setTargetAtTime(420 + actSm*480, t, 0.5);
}

/* ---------- 渲染 ---------- */
const inkCv = document.getElementById('ink');
const ictx = inkCv.getContext('2d');
inkCv.width=N; inkCv.height=N;
const img = ictx.createImageData(N,N);
const px = img.data;

function render(){
  for(let i=0;i<N*N;i++){
    const s=S[i];
    const t = 1-Math.exp(-TONE_K*s);
    const w = W[i];
    let sheen = w>0.05 ? 0.05+0.05*Math.min(1,w*0.5) : 0;
    const o=i*4;
    if(t<0.004 && sheen<0.004){ px[o+3]=0; continue; }
    const tt=Math.sqrt(t);
    const rI=92+(20-92)*tt, gI=88+(18-88)*tt, bI=79+(16-79)*tt;
    const mixW = Math.min(1, t*5);
    const rS=116,gS=114,bS=106;
    const r= rS+(rI-rS)*mixW, g= gS+(gI-gS)*mixW, b= bS+(bI-bS)*mixW;
    const a = Math.max(t*246, sheen*255);
    px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=a>255?255:a;
  }
  ictx.putImageData(img,0,0);
}

/* ---------- 宣纸底（一次性） ---------- */
(function paper(){
  const cv=document.getElementById('paper');
  cv.width=704; cv.height=704;
  const c=cv.getContext('2d');
  c.fillStyle='#f3eee1'; c.fillRect(0,0,704,704);
  c.globalAlpha=0.05;
  for(let i=0;i<180;i++){
    const y=Math.random()*704;
    c.strokeStyle= i%3? '#d8d0ba' : '#e6dfcc';
    c.lineWidth=0.6+Math.random()*0.8;
    c.beginPath();
    c.moveTo(0,y);
    c.bezierCurveTo(200,y+ (Math.random()*6-3), 500,y+(Math.random()*6-3), 704,y+(Math.random()*4-2));
    c.stroke();
  }
  c.globalAlpha=0.06;
  for(let i=0;i<2600;i++){
    c.fillStyle = Math.random()<0.5?'#cfc6ad':'#e9e2cf';
    c.fillRect(Math.random()*704, Math.random()*704, 1+Math.random()*2.2, 0.7);
  }
  c.globalAlpha=1;
  const g=c.createRadialGradient(352,352,300,352,352,560);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(110,95,60,0.10)');
  c.fillStyle=g; c.fillRect(0,0,704,704);
})();

/* ---------- 主循环 ---------- */
const stateEl=document.getElementById('state');
const sealEl=document.getElementById('seal');
const sndEl=document.getElementById('snd');
let alive=true, idleFrames=0, dried=false;

function frame(){
  if(alive){
    frontAcc = 0;
    for(let k=0;k<STEPS;k++) step();
    SND.acc = frontAcc;                       // 标定探针：原始锋线累计
    updateWhisper(Math.min(1, frontAcc/24000));   // 标定：单滴3s≈0.48/16s≈0.72，两三滴留足余量
    if(totalWater<0.4){
      idleFrames++;
      if(idleFrames>90 && !dried){
        dried=true; alive=false;
        stateEl.textContent='水尽墨定';
        stateEl.style.color='#5c5244';
        sealEl.classList.add('done');
        driedBell();
      }
    } else {
      idleFrames=0;
      if(!dried){ stateEl.textContent='洇散中…'; stateEl.style.color='#8a8172'; }
    }
  }
  render();
  requestAnimationFrame(frame);
}

function revive(){
  if(!alive){ alive=true; }
  if(dried){ dried=false; sealEl.classList.remove('done'); }
  idleFrames=0;
}

/* ---------- 交互 ---------- */
function toGrid(e){
  const r=inkCv.getBoundingClientRect();
  return [ (e.clientX-r.left)/r.width*N, (e.clientY-r.top)/r.height*N ];
}
let drawing=false, lastP=null, lastT=0;
inkCv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  initAudio();
  if(AC && AC.state==='suspended' && SND.on) AC.resume();
  drawing=true; try{ inkCv.setPointerCapture(e.pointerId); }catch(_){}
  const [gx,gy]=toGrid(e);
  drop(gx,gy,14,3.6,1.6);
  plop(gx, 14);
  lastP=[gx,gy]; lastT=performance.now(); revive();
});
inkCv.addEventListener('pointermove', e=>{
  if(!drawing||!lastP)return;
  const [gx,gy]=toGrid(e);
  const dx=gx-lastP[0], dy=gy-lastP[1];
  const dist=Math.hypot(dx,dy);
  const now=performance.now();
  const dt=Math.max(1, now-lastT);
  const speed=dist/dt*16.7;           // 折算到每帧格数
  const n=Math.max(1,Math.floor(dist/2.2));
  for(let k=1;k<=n;k++){
    drop(lastP[0]+dx*k/n, lastP[1]+dy*k/n, 6.5, 2.0, 1.0);
  }
  if(dist>1.2) grain(gx, speed);
  lastP=[gx,gy]; lastT=now; revive();
});
addEventListener('pointerup', ()=>{ drawing=false; });
function clearPaper(){
  W.fill(0);P.fill(0);S.fill(0);
  grind();
  revive(); stateEl.textContent='研墨…';
}
inkCv.addEventListener('dblclick', clearPaper);
document.getElementById('clear').addEventListener('click', clearPaper);

/* ---------- 声音开关 ---------- */
sndEl.addEventListener('click', ()=>{
  SND.on = !SND.on;
  if(!audioReady){ SND.on=true; return; }
  sndEl.textContent = SND.on ? '声·开' : '声·关';
  if(AC){
    if(SND.on){ AC.resume(); }
    else { whisperGain.gain.setTargetAtTime(0, AC.currentTime, 0.1); AC.suspend(); }
  }
});

/* ---------- 开场一滴（静默：浏览器要求声音始于用户手势） ---------- */
setTimeout(()=>{ drop(N*0.5, N*0.45, 16, 4.5, 1.8); revive(); }, 700);
requestAnimationFrame(frame);
</script>
