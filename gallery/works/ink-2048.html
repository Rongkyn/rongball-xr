<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水墨2048 🧶</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f5f0e8;
    font-family: 'ZCOOL XiaoWei', serif;
    overflow: hidden;
    position: relative;
  }

  /* 宣纸纹理背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(180,160,130,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(160,140,110,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(170,150,120,0.05) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* 纸纤维纹理 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 2.8rem;
    color: #2c2c2c;
    letter-spacing: 0.15em;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #8a7e6e;
    letter-spacing: 0.3em;
    margin-bottom: 8px;
  }

  .score-board {
    display: flex;
    gap: 24px;
    margin-bottom: 8px;
  }

  .score-item {
    text-align: center;
  }

  .score-label {
    font-size: 0.75rem;
    color: #8a7e6e;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .score-value {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 1.8rem;
    color: #3a3a3a;
    line-height: 1.2;
  }

  .game-board {
    position: relative;
    width: 380px;
    height: 380px;
    background: rgba(200, 190, 170, 0.3);
    border-radius: 12px;
    padding: 10px;
    box-shadow:
      0 2px 20px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.3);
    border: 1px solid rgba(180,170,150,0.4);
  }

  .grid-bg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    height: 100%;
  }

  .cell-bg {
    background: rgba(190, 180, 160, 0.25);
    border-radius: 8px;
  }

  .tile-layer {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-family: 'Ma Shan Zheng', cursive;
    font-weight: 400;
    transition: top 0.15s ease, left 0.15s ease;
    z-index: 2;
  }

  .tile.merged {
    z-index: 3;
  }

  .tile.new {
    animation: tileAppear 0.25s ease-out;
  }

  .tile.merge-pop {
    animation: mergePop 0.3s ease-out;
  }

  @keyframes tileAppear {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes mergePop {
    0% { transform: scale(1); }
    30% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* 墨色方块配色 - 从淡墨到浓墨 */
  .tile-2    { background: rgba(220, 215, 205, 0.9); color: #6b6356; font-size: 2rem; }
  .tile-4    { background: rgba(205, 198, 185, 0.9); color: #5a5448; font-size: 2rem; }
  .tile-8    { background: rgba(180, 168, 148, 0.85); color: #4a4438; font-size: 2rem; }
  .tile-16   { background: rgba(160, 145, 120, 0.85); color: #f0ebe3; font-size: 1.9rem; }
  .tile-32   { background: rgba(135, 118, 95, 0.85); color: #f0ebe3; font-size: 1.9rem; }
  .tile-64   { background: rgba(110, 95, 75, 0.9); color: #f0ebe3; font-size: 1.9rem; }
  .tile-128  { background: rgba(85, 72, 55, 0.9); color: #f0ebe3; font-size: 1.6rem;
               box-shadow: 0 0 15px rgba(85,72,55,0.3); }
  .tile-256  { background: rgba(65, 55, 42, 0.92); color: #f0ebe3; font-size: 1.6rem;
               box-shadow: 0 0 20px rgba(65,55,42,0.35); }
  .tile-512  { background: rgba(50, 42, 32, 0.94); color: #f0ebe3; font-size: 1.6rem;
               box-shadow: 0 0 25px rgba(50,42,32,0.4); }
  .tile-1024 { background: rgba(35, 30, 22, 0.96); color: #f0ebe3; font-size: 1.3rem;
               box-shadow: 0 0 30px rgba(35,30,22,0.45); }
  .tile-2048 { background: rgba(20, 18, 14, 0.98); color: #f0ebe3; font-size: 1.3rem;
               box-shadow: 0 0 40px rgba(20,18,14,0.5), 0 0 60px rgba(20,18,14,0.2); }
  .tile-super { background: rgba(10, 8, 5, 0.99); color: #d4a853; font-size: 1.1rem;
                box-shadow: 0 0 50px rgba(10,8,5,0.5); }

  /* 水墨晕染效果层 */
  .ink-splash {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    animation: inkSpread 0.6s ease-out forwards;
  }

  @keyframes inkSpread {
    0% { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }

  button {
    font-family: 'ZCOOL XiaoWei', serif;
    padding: 8px 24px;
    border: 1px solid rgba(160,150,130,0.5);
    background: rgba(240,235,225,0.8);
    color: #4a4438;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }

  button:hover {
    background: rgba(220,215,200,0.9);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .hint {
    font-size: 0.75rem;
    color: #a09888;
    letter-spacing: 0.15em;
    margin-top: 4px;
  }

  /* 游戏结束遮罩 */
  .game-over-overlay {
    position: absolute;
    inset: 0;
    background: rgba(245, 240, 232, 0.85);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.5s ease;
    backdrop-filter: blur(2px);
  }

  .game-over-overlay h2 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 2.2rem;
    color: #3a3a3a;
    margin-bottom: 8px;
  }

  .game-over-overlay p {
    color: #6b6356;
    margin-bottom: 16px;
    font-size: 1rem;
  }

  .game-over-overlay.win h2 {
    color: #5a4a2a;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 装饰墨点 */
  .ink-dot {
    position: fixed;
    border-radius: 50%;
    background: rgba(60,50,40,0.04);
    pointer-events: none;
    z-index: 0;
  }

  /* 移动端适配 */
  @media (max-width: 420px) {
    .game-board { width: 340px; height: 340px; }
    h1 { font-size: 2.2rem; }
    .tile-2, .tile-4, .tile-8 { font-size: 1.7rem; }
    .tile-16, .tile-32, .tile-64 { font-size: 1.6rem; }
    .tile-128, .tile-256, .tile-512 { font-size: 1.3rem; }
    .tile-1024, .tile-2048 { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- 装饰墨点 -->
<div class="ink-dot" style="width:120px;height:120px;top:10%;left:5%;"></div>
<div class="ink-dot" style="width:80px;height:80px;top:70%;right:8%;"></div>
<div class="ink-dot" style="width:60px;height:60px;bottom:15%;left:15%;"></div>

<div class="container">
  <h1>水墨 2048</h1>
  <div class="subtitle">以墨为棋 · 以心为局</div>

  <div class="score-board">
    <div class="score-item">
      <div class="score-label">墨 韵</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">至 境</div>
      <div class="score-value" id="best">0</div>
    </div>
  </div>

  <div class="game-board" id="gameBoard">
    <div class="grid-bg">
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
    </div>
    <div class="tile-layer" id="tileLayer"></div>
  </div>

  <div class="controls">
    <button onclick="game.restart()">新局</button>
    <button onclick="game.undo()">悔棋</button>
  </div>
  <div class="hint">方向键 / 滑动操控</div>
</div>

<script>
class InkSplash {
  constructor(tileLayer) {
    this.tileLayer = tileLayer;
  }

  create(x, y, size, intensity) {
    const splash = document.createElement('div');
    splash.className = 'ink-splash';
    const s = size * (0.6 + Math.random() * 0.4);
    splash.style.width = s + 'px';
    splash.style.height = s + 'px';
    splash.style.left = (x - s/2) + 'px';
    splash.style.top = (y - s/2) + 'px';
    splash.style.background = `radial-gradient(circle, rgba(60,50,40,${0.15 * intensity}) 0%, transparent 70%)`;
    this.tileLayer.appendChild(splash);
    setTimeout(() => splash.remove(), 600);
  }
}

class Game2048 {
  constructor() {
    this.size = 4;
    this.tileLayer = document.getElementById('tileLayer');
    this.scoreEl = document.getElementById('score');
    this.bestEl = document.getElementById('best');
    this.board = document.getElementById('gameBoard');
    this.inkSplash = new InkSplash(this.tileLayer);

    this.cellSize = 0;
    this.gap = 8;
    this.calculateSizes();

    this.grid = [];
    this.score = 0;
    this.best = parseInt(localStorage.getItem('ink2048_best') || '0');
    this.bestEl.textContent = this.best;
    this.prevState = null;
    this.won = false;
    this.over = false;

    this.init();
    this.bindEvents();
  }

  calculateSizes() {
    const boardEl = this.board;
    const w = boardEl.offsetWidth - 20; // padding
    this.cellSize = (w - this.gap * (this.size - 1)) / this.size;
  }

  getPos(row, col) {
    return {
      top: row * (this.cellSize + this.gap),
      left: col * (this.cellSize + this.gap)
    };
  }

  init() {
    this.grid = Array.from({length: 4}, () => Array(4).fill(0));
    this.addRandom();
    this.addRandom();
    this.render();
  }

  restart() {
    this.score = 0;
    this.won = false;
    this.over = false;
    this.prevState = null;
    this.scoreEl.textContent = '0';
    const overlay = this.board.querySelector('.game-over-overlay');
    if (overlay) overlay.remove();
    this.grid = Array.from({length: 4}, () => Array(4).fill(0));
    this.addRandom();
    this.addRandom();
    this.render();
  }

  saveState() {
    this.prevState = {
      grid: this.grid.map(r => [...r]),
      score: this.score
    };
  }

  undo() {
    if (!this.prevState) return;
    this.grid = this.prevState.grid;
    this.score = this.prevState.score;
    this.scoreEl.textContent = this.score;
    this.won = false;
    this.over = false;
    const overlay = this.board.querySelector('.game-over-overlay');
    if (overlay) overlay.remove();
    this.prevState = null;
    this.render();
  }

  addRandom() {
    const empty = [];
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++)
        if (this.grid[r][c] === 0) empty.push({r, c});
    if (empty.length === 0) return false;
    const cell = empty[Math.floor(Math.random() * empty.length)];
    this.grid[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
    return cell;
  }

  move(direction) {
    if (this.over) return;
    this.saveState();

    let moved = false;
    let merges = [];
    const g = this.grid;

    const rotate = () => {
      const n = Array.from({length: 4}, () => Array(4).fill(0));
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          n[c][3-r] = g[r][c];
      for (let r = 0; r < 4; r++)
        for (let c = 0; c < 4; c++)
          g[r][c] = n[r][c];
    };

    // Rotate to always process as "left"
    const rotations = { left: 0, up: 1, right: 2, down: 3 };
    for (let i = 0; i < rotations[direction]; i++) rotate();

    // Process each row (move left)
    for (let r = 0; r < 4; r++) {
      let row = g[r].filter(v => v !== 0);
      let newRow = [];
      let i = 0;
      while (i < row.length) {
        if (i + 1 < row.length && row[i] === row[i+1]) {
          const merged = row[i] * 2;
          newRow.push(merged);
          merges.push({ r, c: newRow.length - 1, val: merged });
          this.score += merged;
          if (merged === 2048 && !this.won) this.won = true;
          i += 2;
        } else {
          newRow.push(row[i]);
          i++;
        }
      }
      while (newRow.length < 4) newRow.push(0);
      if (g[r].join(',') !== newRow.join(',')) moved = true;
      g[r] = newRow;
    }

    // Rotate back
    for (let i = 0; i < (4 - rotations[direction]) % 4; i++) rotate();

    if (moved) {
      const newCell = this.addRandom();
      this.scoreEl.textContent = this.score;
      if (this.score > this.best) {
        this.best = this.score;
        this.bestEl.textContent = this.best;
        localStorage.setItem('ink2048_best', this.best.toString());
      }
      this.render(newCell, merges);

      if (this.won) {
        setTimeout(() => this.showOverlay('悟道', '墨聚两千四十八', true), 400);
      } else if (this.isGameOver()) {
        this.over = true;
        setTimeout(() => this.showOverlay('局终', `墨韵 ${this.score}`, false), 400);
      }
    } else {
      this.prevState = null;
    }
  }

  isGameOver() {
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 4; c++) {
        if (this.grid[r][c] === 0) return false;
        if (c < 3 && this.grid[r][c] === this.grid[r][c+1]) return false;
        if (r < 3 && this.grid[r][c] === this.grid[r+1][c]) return false;
      }
    return true;
  }

  showOverlay(title, desc, isWin) {
    const existing = this.board.querySelector('.game-over-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'game-over-overlay' + (isWin ? ' win' : '');
    overlay.innerHTML = `
      <h2>${title}</h2>
      <p>${desc}</p>
      <button onclick="game.restart()">再弈一局</button>
    `;
    this.board.appendChild(overlay);
  }

  render(newCell = null, merges = []) {
    this.tileLayer.innerHTML = '';

    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const val = this.grid[r][c];
        if (val === 0) continue;

        const tile = document.createElement('div');
        const pos = this.getPos(r, c);
        const tileClass = val <= 2048 ? `tile-${val}` : 'tile-super';
        tile.className = `tile ${tileClass}`;

        // Check if this is a merged tile
        const isMerged = merges.some(m => m.r === r && m.c === c);
        const isNew = newCell && newCell.r === r && newCell.c === c;

        if (isMerged) tile.classList.add('merge-pop');
        if (isNew) tile.classList.add('new');

        tile.style.width = this.cellSize + 'px';
        tile.style.height = this.cellSize + 'px';
        tile.style.top = pos.top + 'px';
        tile.style.left = pos.left + 'px';
        tile.textContent = val;

        this.tileLayer.appendChild(tile);

        // Ink splash on merge
        if (isMerged) {
          const intensity = Math.min(val / 128, 1);
          this.inkSplash.create(
            pos.left + this.cellSize/2,
            pos.top + this.cellSize/2,
            this.cellSize * 0.8,
            intensity
          );
        }
      }
    }
  }

  bindEvents() {
    // Keyboard
    document.addEventListener('keydown', (e) => {
      const map = {
        ArrowLeft: 'left', ArrowRight: 'right',
        ArrowUp: 'up', ArrowDown: 'down',
        a: 'left', d: 'right', w: 'up', s: 'down'
      };
      if (map[e.key]) {
        e.preventDefault();
        this.move(map[e.key]);
      }
    });

    // Touch / swipe
    let startX, startY, tracking = false;
    const boardEl = this.board;

    boardEl.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    boardEl.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    boardEl.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      const absDx = Math.abs(dx), absDy = Math.abs(dy);
      if (Math.max(absDx, absDy) < 20) return;
      if (absDx > absDy) {
        this.move(dx > 0 ? 'right' : 'left');
      } else {
        this.move(dy > 0 ? 'down' : 'up');
      }
    });
  }
}

const game = new Game2048();
</script>
</body>
</html>
