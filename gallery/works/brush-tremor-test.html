<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>飞白笔触 v8 · Offscreen Erase</title>
<style>
:root { --paper:#e8dfc8; --ink:#1a1612; --seal:#9a3a35; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; background:var(--paper); font-family:"Noto Serif SC",serif; overflow:auto; }
canvas { display:block; }
#panel {
  position:fixed; top:16px; right:16px; z-index:10;
  background:rgba(232,223,200,.92); border:1px solid rgba(40,34,28,.18);
  border-radius:4px; padding:14px 18px; font-size:12px; color:var(--ink);
  line-height:2.1; min-width:220px; backdrop-filter:blur(4px);
}
#panel h3 { font-size:13px; margin-bottom:8px; letter-spacing:2px; }
#panel label { display:flex; align-items:center; justify-content:space-between; }
#panel input[type=range] { width:110px; }
#panel .val { width:32px; text-align:right; font-variant-numeric:tabular-nums; }
#panel button { margin-top:8px; padding:5px 14px; width:100%; background:var(--ink); color:var(--paper); border:none; border-radius:2px; font-family:inherit; font-size:12px; cursor:pointer; letter-spacing:2px; }
#seal { position:fixed; bottom:20px; right:24px; width:38px; height:38px; border:2px solid var(--seal); color:var(--seal); display:flex; align-items:center; justify-content:center; font-family:"Ma Shan Zheng",serif; font-size:18px; transform:rotate(-6deg); opacity:.85; z-index:5; }
</style>
</head>
<body>
<div id="panel">
  <h3>离屏刮白 v8</h3>
  <label>飞白强度 <span><input type="range" id="feibai" min="0" max="100" value="75"><span class="val" id="feibaiV">75</span></span></label>
  <label>丝痕数量 <span><input type="range" id="streaks" min="3" max="15" value="9"><span class="val" id="streaksV">9</span></span></label>
  <label>飞白起始 <span><input type="range" id="dryStart" min="20" max="80" value="42"><span class="val" id="dryStartV">42</span></span></label>
  <label>顿挫幅度 <span><input type="range" id="tremor" min="0" max="100" value="12"><span class="val" id="tremorV">12</span></span></label>
  <label>墨色浓淡 <span><input type="range" id="inkAmt" min="30" max="100" value="85"><span class="val" id="inkAmtV">85</span></span></label>
  <button id="redraw">重 绘</button>
</div>
<div id="seal">球</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = Math.max(window.innerWidth, 900);
  H = Math.max(window.innerHeight, 950);
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); window.addEventListener('resize', ()=>{resize();draw();});

function makeRng(seed) {
  let s = seed % 2147483647; if(s<=0) s+=2147483646;
  return function() { s=(s*16807)%2147483647; return (s-1)/2147483646; };
}

function createStamp(size, opts) {
  opts=opts||{};
  var c=document.createElement('canvas'); c.width=c.height=size;
  var g=c.getContext('2d');
  var feather=opts.feather||0.35, dryness=opts.dryness||0.2;
  var img=g.createImageData(size,size), h=size/2;
  for(var y=0;y<size;y++) for(var x=0;x<size;x++){
    var dx=(x-h)/h,dy=(y-h)/h,d=Math.sqrt(dx*dx+dy*dy);
    var idx=(y*size+x)*4;
    if(d<1){
      var a=Math.pow(1-d,1.2)*240;
      if(d>0.2){var s=Math.sin(x*12.9898+y*78.233)*43758.5453;var r=s-Math.floor(s);if(r<dryness*(d-0.2)*1.5)a*=0.15+r*0.3;}
      if(d>1-feather)a*=Math.pow((1-d)/feather,0.7);
      img.data[idx]=26;img.data[idx+1]=22;img.data[idx+2]=18;
      img.data[idx+3]=Math.min(255,Math.max(0,a));
    }
  }
  g.putImageData(img,0,0);
  return c;
}

var stampWet = createStamp(64, {feather:0.45, dryness:0.12});
var stampDry = createStamp(64, {feather:0.55, dryness:0.35});

// ─── Brush Path v8: draw to offscreen canvas, erase feibai, composite ───
function brushPathV8(mainCtx, pts, stampWet, stampDry, pressureFn, opts) {
  opts=opts||{};
  var opacity=opts.opacity||0.85;
  var feibai=opts.feibai||0;
  var numStreaks=opts.streaks||9;
  var dryStart=opts.dryStart||0.42;
  var tremor=opts.tremor||0;
  var seed=opts.seed||42;
  if(!pts||pts.length<2) return;

  var rng=makeRng(seed);

  // Bounding box of the stroke (with padding)
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(var i=0;i<pts.length;i++){
    minX=Math.min(minX,pts[i].x); maxX=Math.max(maxX,pts[i].x);
    minY=Math.min(minY,pts[i].y); maxY=Math.max(maxY,pts[i].y);
  }
  var pad=20;
  var bw=maxX-minX+pad*2, bh=maxY-minY+pad*2;
  var bx=minX-pad, by=minY-pad;

  // Create offscreen canvas at device pixel resolution
  var offCanvas=document.createElement('canvas');
  offCanvas.width=Math.ceil(bw*dpr);
  offCanvas.height=Math.ceil(bh*dpr);
  var off=offCanvas.getContext('2d');
  off.setTransform(dpr,0,0,dpr,0,0);

  // Compute path length
  var segLens=[],total=0;
  for(var i=0;i<pts.length-1;i++){var dl=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);segLens.push(dl);total+=dl;}
  if(total<0.5) return;

  // ── Pass 1: Draw stroke to offscreen canvas ──
  var acc=0;
  for(var i=0;i<pts.length-1;i++){
    var p=pts[i],n=pts[i+1],dist=segLens[i];
    if(dist<0.001) continue;
    var t0=acc/total,t1=(acc+dist)/total;
    var angle=Math.atan2(n.y-p.y,n.x-p.x)+Math.PI/2;
    var pr0=pressureFn(t0);
    var step=Math.max(1,pr0.width*0.16);
    var sub=Math.ceil(dist/step);
    for(var s=0;s<sub;s++){
      var f=s/sub,t=t0+(t1-t0)*f,pr=pressureFn(t);
      var w=pr.width,a=pr.opacity*opacity;
      var dryFactor=t<dryStart?0:Math.min(1,(t-dryStart)/(1-dryStart));
      var stamp=dryFactor>0.4?stampDry:stampWet;
      a*=(1-dryFactor*0.15);
      var tx=0,ty=0;
      if(tremor>0){
        var px=-Math.sin(angle-Math.PI/2),py=Math.cos(angle-Math.PI/2);
        tx=px*(rng()-0.5)*tremor*1.0;
        ty=py*(rng()-0.5)*tremor*1.0;
      }
      if(w<0.3) continue;
      off.save();
      off.translate(p.x-bx+(n.x-p.x)*f+tx, p.y-by+(n.y-p.y)*f+ty);
      off.rotate(angle);
      off.globalAlpha=a;
      var sz=Math.max(3,w*1.5);
      off.drawImage(stamp,-sz/2,-sz/2,sz,sz);
      off.restore();
    }
    acc+=dist;
  }

  // ── Pass 2: Erase feibai streaks ──
  if (feibai > 0.05) {
    off.save();
    off.globalCompositeOperation='destination-out';

    for(var si=0; si<numStreaks; si++){
      var lateral=(rng()-0.5)*1.4;
      var streakW=0.8+rng()*2.0; // Wider streaks (CSS pixels)
      var sStart=dryStart+rng()*(1-dryStart)*0.3;
      var density=0.25+rng()*0.65;
      var eraseA=(0.25+rng()*0.55)*feibai;

      off.lineCap='round';
      off.lineJoin='round';

      // Build path along the stroke
      var localAcc=0;
      var drawing=false;
      for(var i=0;i<pts.length-1;i++){
        var p=pts[i],n=pts[i+1],dist=segLens[i];
        if(dist<0.001) continue;
        var la=0; for(var j=0;j<i;j++) la+=segLens[j];
        var lt0=la/total, lt1=(la+dist)/total;
        var angle=Math.atan2(n.y-p.y,n.x-p.x);
        var perpX=-Math.sin(angle), perpY=Math.cos(angle);
        var prAt=pressureFn((lt0+lt1)/2);
        var latOff=lateral*prAt.width*0.4;

        var nSub=Math.max(3,Math.ceil(dist/2));
        off.beginPath();
        drawing=false;
        for(var ss=0;ss<=nSub;ss++){
          var sf=ss/nSub;
          var st=lt0+(lt1-lt0)*sf;
          if(st<sStart) continue;

          var bSeed=Math.sin(st*40+si*17.3)*43758.5;
          var bR=bSeed-Math.floor(bSeed);
          if(bR>density) {drawing=false; continue;}

          var fadeIn=Math.min(1,(st-sStart)/0.08);
          var fadeOut=Math.min(1,(1-st)/0.12);
          var fade=Math.min(fadeIn,fadeOut);

          var sx=p.x-bx+(n.x-p.x)*sf+perpX*latOff;
          var sy=p.y-by+(n.y-p.y)*sf+perpY*latOff;
          sx+=Math.sin(st*25+si*3)*0.8*feibai;
          sy+=Math.cos(st*18+si*7)*0.5*feibai;

          off.globalAlpha=eraseA*fade;
          off.lineWidth=streakW*(0.5+fade*0.5);

          if(!drawing){off.moveTo(sx,sy);drawing=true;}
          else off.lineTo(sx,sy);
        }
        off.stroke();
      }
    }
    off.restore();
  }

  // Composite offscreen to main
  mainCtx.drawImage(offCanvas, bx, by, bw, bh);
}

// ── Old brush ──
function brushPathOld(ctx, pts, stamp, pressureFn, opts) {
  opts=opts||{}; var opacity=opts.opacity||0.85;
  if(!pts||pts.length<2) return;
  var segLens=[],total=0;
  for(var i=0;i<pts.length-1;i++){var dl=Math.hypot(pts[i+1].x-pts[i].x,pts[i+1].y-pts[i].y);segLens.push(dl);total+=dl;}
  if(total<0.5) return;
  var acc=0;
  for(var i=0;i<pts.length-1;i++){
    var p=pts[i],n=pts[i+1],dist=segLens[i];
    if(dist<0.001) continue;
    var t0=acc/total,t1=(acc+dist)/total;
    var angle=Math.atan2(n.y-p.y,n.x-p.x)+Math.PI/2;
    var pr0=pressureFn(t0),step=Math.max(1,pr0.width*0.18),sub=Math.ceil(dist/step);
    for(var s=0;s<sub;s++){
      var f=s/sub,t=t0+(t1-t0)*f,pr=pressureFn(t);
      var w=pr.width,a=pr.opacity*opacity;
      if(w<0.3) continue;
      ctx.save();ctx.translate(p.x+(n.x-p.x)*f,p.y+(n.y-p.y)*f);
      ctx.rotate(angle);ctx.globalAlpha=a;
      var sz=Math.max(3,w*1.5);
      ctx.drawImage(stamp,-sz/2,-sz/2,sz,sz);ctx.restore();
    }
    acc+=dist;
  }
}

function cantileverPoints(x0,y0,baseAng,length,bend,twist,segs){
  segs=segs||40;var pts=[],px=x0,py=y0,dt=1/segs;
  for(var i=0;i<=segs;i++){var t=i/segs,a=baseAng+bend*t*t+Math.sin(t*Math.PI)*twist;
    if(i>0){px+=Math.cos(a)*length*dt;py+=Math.sin(a)*length*dt;}pts.push({x:px,y:py});}
  return pts;
}
function orchidPressure(maxW){
  return function(t){var w,o;
    if(t<0.08){w=maxW*(0.3+0.7*(t/0.08));o=0.85;}
    else if(t<0.60){w=maxW*(1.0-0.05*((t-0.08)/0.52));o=0.85;}
    else if(t<0.90){var k=(t-0.60)/0.30;w=maxW*(0.95-0.80*k);o=0.85-0.20*k;}
    else{w=maxW*0.15*(1-(t-0.90)/0.10);o=0.6;}
    return {width:Math.max(0.3,w),opacity:o};};
}

var INK={jiao:'#1a1612',nong:'#2e2820',zhong:'#443a30',dan:'#6b5e4c',qing:'#9a8d76',rouge:'#9a3a35'};

function drawPaper(){
  ctx.fillStyle='#e8dfc8';ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(W*0.3,H*0.2,50,W*0.5,H*0.5,W*0.8);
  g.addColorStop(0,'rgba(255,250,235,0.3)');g.addColorStop(1,'rgba(180,160,120,0.12)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function draw(){
  drawPaper();
  var feibai=parseInt(document.getElementById('feibai').value)/100;
  var streaks=parseInt(document.getElementById('streaks').value);
  var dryStart=parseInt(document.getElementById('dryStart').value)/100;
  var tremor=parseInt(document.getElementById('tremor').value)/100;
  var inkAmt=parseInt(document.getElementById('inkAmt').value)/100;
  document.getElementById('feibaiV').textContent=Math.round(feibai*100);
  document.getElementById('streaksV').textContent=streaks;
  document.getElementById('dryStartV').textContent=Math.round(dryStart*100);
  document.getElementById('tremorV').textContent=Math.round(tremor*100);
  document.getElementById('inkAmtV').textContent=Math.round(inkAmt*100);

  var y=90;
  ctx.fillStyle='rgba(26,22,18,.5)';ctx.font='13px "Noto Serif SC",serif';
  ctx.fillText('▎ 旧笔触 · v4.2', 60, y-20);
  var leaves=[
    {ang:-Math.PI/2-0.35,bend:0.35,twist:-0.12,len:160,w:5.5},
    {ang:-Math.PI/2+0.05,bend:0.55,twist:0.08,len:185,w:5},
    {ang:-Math.PI/2+0.45,bend:0.75,twist:0.18,len:150,w:4.5},
  ];
  leaves.forEach(function(l,idx){
    var pts=cantileverPoints(120+idx*120,y+180,l.ang,l.len,l.bend,l.twist);
    brushPathOld(ctx,pts,stampWet,orchidPressure(l.w),{opacity:inkAmt});
  });

  y=380;
  ctx.fillStyle='rgba(26,22,18,.5)';
  ctx.fillText('▎ 新笔触 · 离屏刮白 v8', 60, y-20);
  leaves.forEach(function(l,idx){
    var pts=cantileverPoints(120+idx*120,y+180,l.ang,l.len,l.bend,l.twist);
    brushPathV8(ctx,pts,stampWet,stampDry,orchidPressure(l.w),{
      opacity:inkAmt, feibai:feibai, streaks:streaks,
      dryStart:dryStart, tremor:tremor, seed:200+idx
    });
  });

  y=670;
  ctx.fillStyle='rgba(26,22,18,.5)';
  ctx.fillText('▎ 整株对比 · 左：旧  右：新', 60, y-20);
  var ocx=200,oby=y+170;
  var ol=[
    {ang:-Math.PI/2-0.4,bend:0.3,twist:-0.1,len:170,w:5},
    {ang:-Math.PI/2-0.1,bend:0.5,twist:0.05,len:200,w:5.5},
    {ang:-Math.PI/2+0.2,bend:0.7,twist:0.15,len:155,w:4.5},
    {ang:-Math.PI/2+0.5,bend:0.9,twist:0.2,len:130,w:4},
    {ang:-Math.PI/2-0.6,bend:0.2,twist:-0.05,len:120,w:3.5},
  ];
  ol.forEach(function(l,idx){
    var pts=cantileverPoints(ocx+(idx%3)*15-15,oby,l.ang,l.len,l.bend,l.twist);
    brushPathOld(ctx,pts,stampWet,orchidPressure(l.w),{opacity:inkAmt});
  });
  var pa=[-0.3,1.3,-1.5,2.3,-2.4];
  for(var pi=0;pi<5;pi++){
    var pL=pi<3?13:8,pW=pi<3?5:3.5;
    ctx.fillStyle=INK.dan;ctx.globalAlpha=0.65;
    ctx.beginPath();ctx.ellipse(ocx+Math.cos(pa[pi])*pL*0.45-20,oby-140+Math.sin(pa[pi])*pL*0.45,pL,pW,pa[pi],0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=INK.rouge;ctx.globalAlpha=0.70;
  ctx.beginPath();ctx.arc(ocx-20,oby-140,2,0,Math.PI*2);ctx.fill();

  var ncx=500,nby=y+170;
  ol.forEach(function(l,idx){
    var pts=cantileverPoints(ncx+(idx%3)*15-15,nby,l.ang,l.len,l.bend,l.twist);
    brushPathV8(ctx,pts,stampWet,stampDry,orchidPressure(l.w),{
      opacity:inkAmt, feibai:feibai*0.7, streaks:Math.max(4,streaks-2),
      dryStart:dryStart+0.1, tremor:tremor*0.5, seed:400+idx
    });
  });
  var nfx=ncx-20,nfy=nby-140;
  var petalStamp=createStamp(48,{feather:0.50,dryness:0.10});
  for(var pi2=0;pi2<5;pi2++){
    var pL2=pi2<3?16:10,pW2=pi2<3?7:4.5;
    var pColor=pi2<3?INK.zhong:INK.dan;
    var pAlpha=pi2<3?0.60:0.45;
    ctx.save();ctx.translate(nfx,nfy);ctx.rotate(pa[pi2]);
    ctx.fillStyle=pColor;
    for(var psi=0;psi<=12;psi++){
      var pt=psi/12;
      var pp=pt<0.15?(pt/0.15)*0.6:pt<0.6?0.6+0.4*Math.sin((pt-0.15)/0.45*Math.PI*0.5):1.0-(pt-0.6)/0.4*0.5;
      var pw=pW2*pp,px2=pL2*pt*0.85;
      var psz=Math.max(3,pw*2.2);
      ctx.globalAlpha=pAlpha*(0.4+0.6*pp);
      ctx.drawImage(petalStamp,px2-psz/2,-psz/2,psz,psz);
    }
    ctx.restore();
  }
  ctx.fillStyle=INK.rouge;ctx.globalAlpha=0.75;
  ctx.beginPath();ctx.arc(nfx,nfy,2.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

['feibai','streaks','dryStart','tremor','inkAmt'].forEach(function(id){
  document.getElementById(id).addEventListener('input',draw);
});
document.getElementById('redraw').addEventListener('click',draw);
draw();
</script>
</body>
</html>
