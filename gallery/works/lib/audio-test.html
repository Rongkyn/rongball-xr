<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>audio-lib 测试 · RongAudio v1.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #f4f0e6;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    position: fixed; top: 30px; left: 36px;
    font-size: 15px; letter-spacing: 8px; color: #7a6f5f; font-weight: normal;
  }
  h1 small { display: block; font-size: 10px; letter-spacing: 3px; color: #b0a48f; margin-top: 6px; }
  #state {
    position: fixed; top: 30px; right: 36px;
    font-size: 11px; letter-spacing: 2px; color: #b0a48f;
  }
  .row {
    position: fixed; left: 50%; transform: translateX(-50%);
    display: flex; gap: 18px;
  }
  #rowPluck { top: 32%; }
  #rowBell { top: 62%; }
  .note {
    width: 64px; height: 64px;
    border: 1px solid #c4b8a8;
    color: #6b5f4f;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.3s, transform 0.15s;
    background: rgba(255,255,255,0.35);
  }
  .note:hover { background: rgba(139,126,110,0.10); }
  .note.hit { background: rgba(139,126,110,0.22); transform: scale(0.94); }
  .label {
    position: fixed; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 5px; color: #a89c8c;
  }
  #labPluck { top: 26%; }
  #labBell { top: 56%; }
  #log {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #c0b4a0; letter-spacing: 1px;
  }
</style>
</head>
<body>
<h1>音频资产库测试<small>RongAudio v1.0 · KS弦 + 加法铃</small></h1>
<div id="state">AC: 未初始化</div>
<div class="label" id="labPluck">古琴拨弦 · 五声</div>
<div class="row" id="rowPluck"></div>
<div class="label" id="labBell">铜铃 · 五声</div>
<div class="row" id="rowBell"></div>
<div id="log">点击任意音键发声（首次点击初始化 AudioContext）</div>

<script src="audio-lib.js"></script>
<script>
(function(){
  'use strict';
  // A 五声（宫商角徵羽）：A C D E G
  const SCALE = [220.0, 261.63, 293.66, 329.63, 392.0];
  const NAMES = ['宫', '商', '角', '徵', '羽'];
  const stateEl = document.getElementById('state');
  const logEl = document.getElementById('log');
  let logCount = 0;

  function log(msg){
    logEl.textContent = (++logCount) + '. ' + msg;
  }

  function ensureAudio(){
    if (!RongAudio.ctx()){
      RongAudio.init();
      stateEl.textContent = 'AC: ' + RongAudio.ctx().state + ' / ' + RongAudio.ctx().sampleRate + 'Hz';
      log('init ok, state=' + RongAudio.ctx().state);
    }
  }

  function makeRow(container, onHit){
    const row = document.getElementById(container);
    for (let i = 0; i < SCALE.length; i++){
      const el = document.createElement('div');
      el.className = 'note';
      el.textContent = NAMES[i];
      el.dataset.idx = i;
      el.addEventListener('pointerdown', function(e){
        e.preventDefault();
        ensureAudio();
        const idx = parseInt(el.dataset.idx);
        const pan = (idx / (SCALE.length - 1)) * 1.6 - 0.8;
        onHit(SCALE[idx], pan, idx);
        el.classList.add('hit');
        setTimeout(() => el.classList.remove('hit'), 220);
      });
      row.appendChild(el);
    }
  }

  makeRow('rowPluck', function(freq, pan){
    RongAudio.pluck(freq, 0.85, { pan: pan });
    log('pluck ' + freq.toFixed(1) + 'Hz pan=' + pan.toFixed(2));
  });
  makeRow('rowBell', function(freq, pan){
    RongAudio.strikeBell(freq * 2, 0.7, { pan: pan });   // 铃音高八度更清亮
    log('bell ' + (freq*2).toFixed(1) + 'Hz pan=' + pan.toFixed(2));
  });

  // 暴露给 CDP 自动测试
  window.__test = {
    hitPluck: function(i){
      ensureAudio();
      RongAudio.pluck(SCALE[i], 0.85, { pan: 0 });
    },
    hitBell: function(i){
      ensureAudio();
      RongAudio.strikeBell(SCALE[i] * 2, 0.7, { pan: 0 });
    },
    state: function(){
      return RongAudio.ctx() ? RongAudio.ctx().state : 'null';
    }
  };
})();
</script>
</body>
</html>
