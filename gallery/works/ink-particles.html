<!DOCTYPE html>
<html lang="zh-CN">
<head>
      <link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水墨流韵 | 绒球的创作时间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #f5f3ef;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        #canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        
        .info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(60, 60, 60, 0.6);
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }
        
        .title {
            position: fixed;
            top: 30px;
            left: 30px;
            color: rgba(40, 40, 40, 0.75);
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            pointer-events: none;
        }
        
        .controls {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
        }
        
        button {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(100, 100, 100, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #444;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(100, 100, 100, 0.4);
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="title">水墨流韵</div>
    
    <div class="controls">
        <button id="clearBtn">清空</button>
        <button id="colorBtn">换色</button>
    </div>
    
    <div class="info">
        <div>移动鼠标 | 绘制水墨轨迹</div>
        <div>点击 | 晕染扩散</div>
        <div style="margin-top: 8px; font-size: 11px; opacity: 0.7;">绒球的创作时间 🧶</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        // 水墨色彩系统
        const colorPalettes = [
            { name: '墨', colors: ['#1a1a1a', '#2d2d2d', '#404040', '#555555'] },
            { name: '青', colors: ['#2c5f6e', '#3d7a8a', '#4e95a6', '#5fb0c2'] },
            { name: '朱', colors: ['#8b3a3a', '#a64d4d', '#c16060', '#dc7373'] },
            { name: '紫', colors: ['#5d4e6d', '#6e5f7e', '#7f708f', '#9081a0'] }
        ];
        let currentPalette = 0;
        
        // 粒子系统
        class InkParticle {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 1.0;
                this.maxLife = 0.8 + Math.random() * 0.4;
                this.size = 1 + Math.random() * 2;
                this.color = colorPalettes[currentPalette].colors[
                    Math.floor(Math.random() * colorPalettes[currentPalette].colors.length)
                ];
                this.opacity = 0.3 + Math.random() * 0.4;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.life -= 0.008;
                this.size += 0.02;
            }
            
            draw() {
                const alpha = this.life * this.opacity;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            isDead() {
                return this.life <= 0;
            }
        }
        
        // 晕染效果
        class Diffusion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 50 + Math.random() * 100;
                this.life = 1.0;
                this.color = colorPalettes[currentPalette].colors[
                    Math.floor(Math.random() * colorPalettes[currentPalette].colors.length)
                ];
            }
            
            update() {
                this.radius += 1.5;
                this.life = 1 - (this.radius / this.maxRadius);
            }
            
            draw() {
                if (this.life <= 0) return;
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, this.color + '00');
                gradient.addColorStop(0.5, this.color + Math.floor(this.life * 40).toString(16).padStart(2, '0'));
                gradient.addColorStop(1, this.color + '00');
                
                ctx.save();
                ctx.globalAlpha = this.life * 0.6;
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            isDead() {
                return this.life <= 0;
            }
        }
        
        let particles = [];
        let diffusions = [];
        let mouseX = 0;
        let mouseY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let isMouseMoving = false;

        // 1013 避坑：移动端主交互「拖动画墨」此前只挂 mousemove，真触摸无对应事件 → 拖移零响应。
        // 抽出按「上一触点→当前触点」距离发射粒子的轨迹函数，鼠标与触摸共用。
        function emitTrail(x, y, lastX, lastY) {
            const dx = x - lastX;
            const dy = y - lastY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > 2) {
                const particleCount = Math.min(5, Math.floor(distance / 3));
                for (let i = 0; i < particleCount; i++) {
                    const spread = 8;
                    const px = x + (Math.random() - 0.5) * spread;
                    const py = y + (Math.random() - 0.5) * spread;
                    const vx = (Math.random() - 0.5) * 2;
                    const vy = (Math.random() - 0.5) * 2;
                    particles.push(new InkParticle(px, py, vx, vy));
                }
            }
        }
        // 点击/触摸落点 - 晕染 + 爆发
        function emitBurst(x, y) {
            diffusions.push(new Diffusion(x, y));
            for (let i = 0; i < 30; i++) {
                const angle = (Math.PI * 2 * i) / 30;
                const speed = 2 + Math.random() * 3;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                particles.push(new InkParticle(x, y, vx, vy));
            }
        }

        // 鼠标移动事件
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            isMouseMoving = true;

            emitTrail(mouseX, mouseY, lastMouseX, lastMouseY);

            lastMouseX = mouseX;
            lastMouseY = mouseY;
        });

        // 触摸事件（1013 补：真机手指点按=晕染爆发、拖动=拖出墨迹）
        const touchLast = new Map();
        const touchStartAt = new Map();
        canvas.addEventListener('touchstart', (e) => {
            for (const t of e.changedTouches) {
                touchLast.set(t.identifier, { x: t.clientX, y: t.clientY });
                touchStartAt.set(t.identifier, { x: t.clientX, y: t.clientY, moved: false });
            }
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            for (const t of e.changedTouches) {
                const last = touchLast.get(t.identifier) || { x: t.clientX, y: t.clientY };
                emitTrail(t.clientX, t.clientY, last.x, last.y);
                touchLast.set(t.identifier, { x: t.clientX, y: t.clientY });
                const st = touchStartAt.get(t.identifier);
                if (st && Math.hypot(t.clientX - st.x, t.clientY - st.y) > 10) st.moved = true;
            }
        }, { passive: true });
        canvas.addEventListener('touchend', (e) => {
            // 短按（未明显移动）等价桌面 click：晕染爆发；拖动结束不重复爆发
            for (const t of e.changedTouches) {
                const st = touchStartAt.get(t.identifier);
                if (st && !st.moved) emitBurst(t.clientX, t.clientY);
                touchLast.delete(t.identifier);
                touchStartAt.delete(t.identifier);
            }
        }, { passive: true });
        canvas.addEventListener('touchcancel', (e) => {
            for (const t of e.changedTouches) {
                touchLast.delete(t.identifier);
                touchStartAt.delete(t.identifier);
            }
        }, { passive: true });

        // 点击事件 - 晕染
        canvas.addEventListener('click', (e) => {
            emitBurst(e.clientX, e.clientY);
        });
        
        // 清空按钮
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = '#f5f3ef';
            ctx.fillRect(0, 0, width, height);
            particles = [];
            diffusions = [];
        });
        
        // 换色按钮
        document.getElementById('colorBtn').addEventListener('click', () => {
            currentPalette = (currentPalette + 1) % colorPalettes.length;
        });
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
        
        // 动画循环
        function animate() {
            // 半透明覆盖创造拖尾效果
            ctx.fillStyle = 'rgba(245, 243, 239, 0.05)';
            ctx.fillRect(0, 0, width, height);
            
            // 更新和绘制晕染
            diffusions = diffusions.filter(d => {
                d.update();
                d.draw();
                return !d.isDead();
            });
            
            // 更新和绘制粒子
            particles = particles.filter(p => {
                p.update();
                p.draw();
                return !p.isDead();
            });
            
            requestAnimationFrame(animate);
        }
        
        // 初始化画布
        ctx.fillStyle = '#f5f3ef';
        ctx.fillRect(0, 0, width, height);
        
        animate();
    </script>
</body>
</html>
