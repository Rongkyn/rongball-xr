<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><title>兰花算法测试</title>
<style>body{margin:0;background:#e8dfc8;display:flex;justify-content:center;padding:20px;font-family:serif}
canvas{box-shadow:0 2px 10px rgba(0,0,0,.15)}</style></head>
<body>
<canvas id="c" width="1100" height="600"></canvas>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const INK={jiao:'#1a1612',nong:'#2e2820',zhong:'#443a30',dan:'#6b5e4c',qing:'#9a8d76',paper:'#e8dfc8'};

// 确定性随机
function makeRand(seed){let s=seed;return function(){s=(s*9301+49297)%233280;return s/233280;};}

function createBrushStamp(size,opts={}){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');const img=x.createImageData(size,size);
  const {feather=0.45,dryness=0.2}=opts;const cx=size/2,cy=size/2;
  for(let y=0;y<size;y++)for(let xx=0;xx<size;xx++){
    const dx=(xx-cx)/cx,dy=(y-cy)/cy;const d=Math.sqrt(dx*dx+dy*dy);
    const i=((y*size+xx)*4);
    if(d<1){let a=Math.pow(1-d,1.2)*240;
      if(d>0.2){const rnd=Math.sin(xx*12.9898+y*78.233)*43758.5453;const r=rnd-Math.floor(rnd);
        if(r<dryness*(d-0.2)*1.5)a*=0.15+r*0.3;}
      if(d>1-feather)a*=Math.pow((1-d)/feather,0.7);
      img.data[i]=26;img.data[i+1]=22;img.data[i+2]=18;img.data[i+3]=Math.min(255,Math.max(0,a));}}
  x.putImageData(img,0,0);return c;}
const stamp=createBrushStamp(64,{feather:0.45,dryness:0.2});
const stampDry=createBrushStamp(64,{feather:0.55,dryness:0.45});

function brushPath(ctx,pts,st,pressFn,op){
  const{opacity=0.55}=op;
  for(let i=0;i<pts.length-1;i++){
    const p=pts[i],n=pts[i+1];const dist=Math.hypot(n.x-p.x,n.y-p.y);
    const pr=pressFn(p.t);const step=Math.max(1,pr.width*0.18);const sub=Math.ceil(dist/step);
    for(let s=0;s<sub;s++){const f=s/sub;
      const x=p.x+(n.x-p.x)*f,y=p.y+(n.y-p.y)*f;const t=p.t+(n.t-p.t)*f;
      const pr2=pressFn(t);const w=pr2.width,a=pr2.opacity*opacity;
      const ang=Math.atan2(n.y-p.y,n.x-p.x)+Math.PI/2;
      ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=a;
      const sz=Math.max(3,w*1.5);ctx.drawImage(st,-sz/2,-sz/2,sz,sz);ctx.restore();}}
}
function orchidPressure(maxW){return function(t){
  let w,o;
  if(t<0.08){w=maxW*(0.3+0.7*(t/0.08));o=0.85;}                // 钉头
  else if(t<0.60){w=maxW*(1.0-0.05*((t-0.08)/0.52));o=0.85;}   // 主体宽
  else if(t<0.90){const k=(t-0.60)/0.30;w=maxW*(0.95-0.80*k);o=0.85-0.20*k;} // 提锋
  else{w=maxW*0.15*(1-(t-0.90)/0.10);o=0.6;}                  // 鼠尾
  return{width:Math.max(0.3,w),opacity:o};};}

// ─── 新兰花算法 v5 ───
// 宋画兰叶法：一笔定方向、二笔交凤眼、三笔破凤眼，添嫩叶抱根。
// 关键改进：出射点沿短根茎二列错开(不从一个点放射)；三次贝塞尔S翻转；种子驱动大幅变化。
function buildOrchidLeaves(rootX, rootY, rand){
  const leaves=[];
  const lean = (rand()<0.5?-1:1) * (0.4+rand()*0.6); // 整丛气势偏向
  const n = 5 + Math.floor(rand()*3);

  // 叶子沿短根茎(假球茎)竖向错开排列，二列互生
  function baseOffset(i){
    return { x: rootX + (i%2===0? -3-rand()*4 : 3+rand()*4), y: rootY - i*(3+rand()*4) };
  }

  // 第一笔：主叶——斜上方劲挺而出，中后段重力翻转垂落
  {
    const b=baseOffset(0);
    const ang = (lean<0? -2.0-rand()*0.4 : -1.1+rand()*0.4) + (rand()-0.5)*0.15;
    const len = 240 + rand()*60;
    const w = 3.2 + rand()*0.6;
    leaves.push(makeCubicLeaf(b.x,b.y,ang,len,w,'nong',rand,0.9+rand()*0.3));
  }
  // 第二笔：交凤眼——从另一侧上来，曲线与主叶在中上部交叉
  {
    const b=baseOffset(1);
    const ang = (lean<0? -1.2+rand()*0.4 : -1.9-rand()*0.4) + (rand()-0.5)*0.2;
    const len = 210 + rand()*40;
    const w = 2.8 + rand()*0.5;
    leaves.push(makeCubicLeaf(b.x,b.y,ang,len,w,'nong',rand,0.75+rand()*0.3));
  }
  // 第三笔：破凤眼——大幅斜出，有弧度地扫向侧方再垂落（不水平直走）
  {
    const b=baseOffset(2);
    const side = rand()<0.5?1:-1;
    const ang = side>0 ? (-0.1+rand()*0.7) : (-Math.PI+0.1+rand()*0.7);
    const len = 160 + rand()*50;
    const w = 2.4 + rand()*0.5;
    leaves.push(makeCubicLeaf(b.x,b.y,ang,len,w,'zhong',rand,0.85+rand()*0.3));
  }
  // 剩余：抱根短叶 + 外侧披散 + 垂叶
  for(let i=3;i<n;i++){
    const b=baseOffset(i);
    let ang;
    const r=rand();
    if(r<0.4) { ang = -1.6 + (rand()-0.5)*1.2; }
    else if(r<0.7) {
      const side = rand()<0.5?1:-1;
      ang = side>0 ? (-0.3+rand()*0.9) : (-Math.PI+0.3+rand()*0.9);
    } else { ang = Math.PI/2 + (rand()-0.5)*1.0; }
    const len = 80 + rand()*110;
    const w = 1.6 + rand()*1.2;
    const tone = rand()<0.5?'dan':'zhong';
    leaves.push(makeCubicLeaf(b.x,b.y,ang,len,w,tone,rand,0.6+rand()*0.6));
  }
  return leaves;
}

// 用三次贝塞尔造一片S形兰叶
// sag: 0=挺立 1=重度弯垂
function makeCubicLeaf(rootX,rootY,ang,len,w,tone,rand,sag){
  const ox=(rand()-0.5)*5, oy=(rand()-0.5)*4;
  const x0=rootX+ox, y0=rootY+oy;
  const dx=Math.cos(ang), dy=Math.sin(ang);
  const px=-dy, py=dx; // 垂直方向
  // 翻转方向：叶子向哪一侧弯(S的第一弯)
  const flip = rand()<0.5?-1:1;
  // 终点：沿出射方向，加下垂
  const endX = x0 + dx*len;
  const endY = y0 + dy*len + len*sag*0.4;
  // 第一控点：出射方向劲挺，轻微侧弯
  const c1x = x0 + dx*len*0.40 + px*flip*len*0.10;
  const c1y = y0 + dy*len*0.40 + py*flip*len*0.10;
  // 第二控点：后段反向弯+重力，自然垂落形成S
  const c2x = x0 + dx*len*0.72 - px*flip*len*0.10;
  const c2y = y0 + dy*len*0.72 - py*flip*len*0.10 + len*sag*0.28;
  // 采样三次贝塞尔
  const N=44;const pts=[];
  for(let i=0;i<=N;i++){const t=i/N,mt=1-t;
    const x=mt*mt*mt*x0+3*mt*mt*t*c1x+3*mt*t*t*c2x+t*t*t*endX;
    const y=mt*mt*mt*y0+3*mt*mt*t*c1y+3*mt*t*t*c2y+t*t*t*endY;
    pts.push({x,y,t});}
  return {pts,w,tone};
}

function drawOrchid(rootX,rootY,rand){
  const leaves=buildOrchidLeaves(rootX,rootY,rand);
  leaves.forEach(L=>{
    const st=L.tone==='dan'?stampDry:stamp;
    const op=L.tone==='nong'?0.8:L.tone==='zhong'?0.65:0.55;
    brushPath(ctx,L.pts,st,orchidPressure(L.w),{opacity:op});
    // 钉头
    ctx.globalAlpha=0.9;ctx.fillStyle=L.tone==='dan'?INK.dan:(L.tone==='zhong'?INK.zhong:INK.nong);
    ctx.beginPath();ctx.ellipse(L.pts[0].x,L.pts[0].y,L.w*0.8,L.w*0.5,0,0,Math.PI*2);ctx.fill();
    // 鼠尾尖
    const tip=L.pts[L.pts.length-1];ctx.globalAlpha=0.7;
    ctx.beginPath();ctx.arc(tip.x,tip.y,0.9,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  // 根茎点
  ctx.fillStyle=INK.jiao;ctx.globalAlpha=0.6;
  ctx.beginPath();ctx.ellipse(rootX,rootY,5,3,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

// 画三丛较大的兰花，2行x3列缩小会看不清细节，改1行3列大尺寸
ctx.fillStyle=INK.paper;ctx.fillRect(0,0,1100,600);
ctx.strokeStyle='rgba(107,94,76,0.2)';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(366,40);ctx.lineTo(366,560);ctx.moveTo(733,40);ctx.lineTo(733,560);ctx.stroke();ctx.setLineDash([]);

const seeds=[42,137,2024];
seeds.forEach((sd,i)=>{
  const rx=183+i*366, ry=380;
  drawOrchid(rx,ry,makeRand(sd));
  ctx.fillStyle=INK.zhong;ctx.font='14px serif';ctx.textAlign='center';
  ctx.fillText('种子 '+sd,rx,ry+60);
});
ctx.fillStyle=INK.dan;ctx.font='13px serif';ctx.textAlign='center';
ctx.fillText('兰花算法 v4 · 铁线描劲挺起笔 + 后段重力翻转垂落 + 钉头鼠尾',550,30);
</script></body></html>
